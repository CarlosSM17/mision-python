/* =========================================================================
 * 10-python.js — Tokenizador, analizador sintáctico y resaltado de Python.
 *
 * El analizador cubre el subconjunto del curso y sirve para tres cosas:
 *   1. Convertir Python en bloques (código inicial de los retos, modo 3).
 *   2. Dar mensajes de error de sintaxis precisos y en español, porque
 *      Skulpt solo dice «bad input».
 *   3. Contar construcciones del programa para revisar restricciones.
 * Lo que no reconoce no es un error: se conserva como «Python libre».
 * ========================================================================= */
'use strict';

PB.py = (() => {
  const PALABRAS_CLAVE = new Set(['False', 'None', 'True', 'and', 'as', 'assert', 'async', 'await', 'break', 'class',
    'continue', 'def', 'del', 'elif', 'else', 'except', 'finally', 'for', 'from', 'global', 'if', 'import', 'in', 'is',
    'lambda', 'nonlocal', 'not', 'or', 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield']);

  const FUNCIONES_INTEGRADAS = new Set(['print', 'input', 'int', 'float', 'str', 'bool', 'len', 'range', 'max', 'min',
    'sum', 'abs', 'round', 'sorted', 'list', 'type', 'enumerate', 'zip', 'reversed', 'chr', 'ord', 'any', 'all', 'pow',
    'divmod', 'isinstance', 'dict', 'set', 'tuple', 'help', 'map', 'filter', 'open']);

  const OPERADORES = ['**=', '//=', '>>=', '<<=', '!=', '%=', '&=', '**', '*=', '+=', '-=', '->', '//', '/=', ':=',
    '<<', '<=', '==', '>=', '>>', '@=', '^=', '|=', '%', '&', '(', ')', '*', '+', ',', '-', '.', '/', ':', ';', '<',
    '=', '>', '@', '[', ']', '^', '{', '|', '}', '~'];

  const ASIGNACION_AUMENTADA = new Set(['+=', '-=', '*=', '/=', '//=', '%=', '**=']);

  class ErrorPython extends Error {
    constructor(tipo, mensaje, linea, col) {
      super(mensaje);
      this.tipo = tipo;        // 'SyntaxError' | 'IndentationError'
      this.mensaje = mensaje;
      this.linea = linea;
      this.col = col || 0;
    }
  }

  const reNombre = /[\p{L}_][\p{L}\p{N}_]*/uy;
  const reNumero = /(?:0[xX][0-9a-fA-F_]+|0[bB][01_]+|0[oO][0-7_]+|(?:\d[\d_]*(?:\.[\d_]*)?|\.\d[\d_]*)(?:[eE][+-]?\d+)?[jJ]?)/y;
  const rePrefijoCadena = /^(?:[rRbBuUfF]|[rR][bBfF]|[bBfF][rR])$/;

  /* ------------------------------------------------------------------ *
   * Tokenizador
   * ------------------------------------------------------------------ */
  function tokenizar(fuente) {
    const src = fuente.replace(/\r\n?/g, '\n') + (fuente.endsWith('\n') ? '' : '\n');
    const toks = [];
    const sangrias = [0];
    const parentesis = [];
    let i = 0, linea = 1, inicioLinea = 0;
    let alInicio = true;
    let continuacion = false;
    let comentariosPendientes = [];

    const tok = (tipo, valor, ini, fin, extra) => {
      const t = { tipo, valor, ini, fin, linea, col: ini - inicioLinea };
      if (extra) Object.assign(t, extra);
      toks.push(t);
      return t;
    };
    const volcarComentarios = (filtro) => {
      const quedan = [];
      for (const c of comentariosPendientes) {
        if (filtro(c)) toks.push(c); else quedan.push(c);
      }
      comentariosPendientes = quedan;
    };

    while (i < src.length) {
      if (alInicio && parentesis.length === 0 && !continuacion) {
        let col = 0, j = i;
        while (j < src.length && (src[j] === ' ' || src[j] === '\t' || src[j] === '\f')) {
          if (src[j] === ' ') col++;
          else if (src[j] === '\t') col = (Math.floor(col / 8) + 1) * 8;
          else col = 0;
          j++;
        }
        if (src[j] === '\n') { i = j + 1; linea++; inicioLinea = i; continue; }
        if (src[j] === '#') {
          let k = j;
          while (src[k] !== '\n') k++;
          comentariosPendientes.push({ tipo: 'COMMENT', valor: src.slice(j, k), ini: j, fin: k, linea, col, solo: true });
          i = k + 1; linea++; inicioLinea = i;
          continue;
        }
        const tope = sangrias[sangrias.length - 1];
        if (col > tope) {
          sangrias.push(col);
          tok('INDENT', '', j, j);
          volcarComentarios(() => true);
        } else if (col < tope) {
          volcarComentarios(c => c.col > col);
          while (col < sangrias[sangrias.length - 1]) {
            sangrias.pop();
            tok('DEDENT', '', j, j);
          }
          if (col !== sangrias[sangrias.length - 1]) {
            throw new ErrorPython('IndentationError',
              'La sangría de esta línea no coincide con ninguna de las líneas anteriores. Alinea la línea con el bloque al que pertenece.',
              linea, col);
          }
          volcarComentarios(() => true);
        } else {
          volcarComentarios(() => true);
        }
        i = j;
        alInicio = false;
      }

      const c = src[i];

      if (c === '\n') {
        if (parentesis.length === 0) {
          const ult = toks[toks.length - 1];
          if (ult && ult.tipo !== 'NEWLINE' && ult.tipo !== 'INDENT' && ult.tipo !== 'DEDENT') tok('NEWLINE', '\n', i, i + 1);
          alInicio = true;
        }
        continuacion = false;
        i++; linea++; inicioLinea = i;
        continue;
      }
      if (c === ' ' || c === '\t' || c === '\f') { i++; continue; }
      if (c === '#') {
        let k = i;
        while (src[k] !== '\n') k++;
        tok('COMMENT', src.slice(i, k), i, k, { solo: false });
        i = k;
        continue;
      }
      if (c === '\\' && src[i + 1] === '\n') {
        i += 2; linea++; inicioLinea = i; continuacion = true;
        continue;
      }

      // Hueco para escribir (solo en el código inicial de los retos): «...»
      if (c === '«') {
        const k = src.indexOf('»', i + 1);
        if (k < 0 || src.slice(i, k).includes('\n')) throw new ErrorPython('SyntaxError', 'Hueco « sin cerrar con ».', linea, i - inicioLinea);
        tok('HUECO', src.slice(i + 1, k), i, k + 1);
        i = k + 1;
        continue;
      }

      // Nombres (y prefijos de cadenas como f"...")
      reNombre.lastIndex = i;
      const mNombre = reNombre.exec(src);
      if (mNombre) {
        const nombre = mNombre[0];
        const sig = src[i + nombre.length];
        if ((sig === '"' || sig === "'") && rePrefijoCadena.test(nombre)) {
          i = leerCadena(i, nombre.length);
          continue;
        }
        tok('NAME', nombre, i, i + nombre.length);
        i += nombre.length;
        continue;
      }

      if (c === '"' || c === "'") { i = leerCadena(i, 0); continue; }

      if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(src[i + 1]))) {
        reNumero.lastIndex = i;
        const m = reNumero.exec(src);
        tok('NUMBER', m[0], i, i + m[0].length);
        i += m[0].length;
        continue;
      }

      if ('“”‘’«»'.includes(c)) {
        throw new ErrorPython('SyntaxError',
          'Hay comillas tipográficas (“ ” o ‘ ’). Python solo entiende comillas rectas: " o \'. Bórralas y escríbelas desde la barra de símbolos.',
          linea, i - inicioLinea);
      }

      let op = null;
      for (const o of OPERADORES) { if (src.startsWith(o, i)) { op = o; break; } }
      if (op) {
        if ('([{'.includes(op)) parentesis.push({ c: op, linea, col: i - inicioLinea });
        else if (')]}'.includes(op)) {
          const abre = parentesis.pop();
          const esperado = { ')': '(', ']': '[', '}': '{' }[op];
          if (!abre) {
            throw new ErrorPython('SyntaxError', `Sobra un «${op}»: no hay ningún «${esperado}» abierto antes.`, linea, i - inicioLinea);
          }
          if (abre.c !== esperado) {
            const cierra = { '(': ')', '[': ']', '{': '}' }[abre.c];
            throw new ErrorPython('SyntaxError',
              `Se esperaba «${cierra}» para cerrar el «${abre.c}» de la línea ${abre.linea}, pero aparece «${op}».`, linea, i - inicioLinea);
          }
        }
        tok('OP', op, i, i + op.length);
        i += op.length;
        continue;
      }

      if (c === '¿' || c === '¡' || c === '?' || c === '$' || c === '`' || c === '!') {
        throw new ErrorPython('SyntaxError',
          `El símbolo «${c}» no se puede usar fuera de las comillas. Si es parte de un mensaje, ponlo dentro de "comillas".`,
          linea, i - inicioLinea);
      }
      throw new ErrorPython('SyntaxError', `Carácter no válido en Python: «${c}».`, linea, i - inicioLinea);
    }

    if (parentesis.length) {
      const abre = parentesis[parentesis.length - 1];
      const cierra = { '(': ')', '[': ']', '{': '}' }[abre.c];
      throw new ErrorPython('SyntaxError', `Falta cerrar el «${abre.c}» que se abrió en la línea ${abre.linea}: agrega «${cierra}».`, abre.linea, abre.col);
    }
    const ult = toks[toks.length - 1];
    if (ult && ult.tipo !== 'NEWLINE' && ult.tipo !== 'DEDENT' && ult.tipo !== 'INDENT') tok('NEWLINE', '\n', i, i);
    volcarComentarios(c => c.col > 0);
    while (sangrias.length > 1) { sangrias.pop(); tok('DEDENT', '', i, i); }
    volcarComentarios(() => true);
    tok('EOF', '', i, i);
    return { toks, src };

    function leerCadena(ini, largoPrefijo) {
      const prefijo = src.slice(ini, ini + largoPrefijo);
      let k = ini + largoPrefijo;
      const q = src[k];
      const triple = src.startsWith(q + q + q, k);
      const delim = triple ? q + q + q : q;
      const lineaIni = linea, colIni = ini - inicioLinea;
      k += delim.length;
      const ini2 = k;
      for (;;) {
        if (k >= src.length) {
          throw new ErrorPython('SyntaxError', 'Una cadena de texto no está cerrada: falta la comilla ' + delim + ' del final.', lineaIni, colIni);
        }
        const ch = src[k];
        if (ch === '\\') {
          if (src[k + 1] === '\n') { linea++; inicioLinea = k + 2; }
          k += 2; continue;
        }
        if (ch === '\n') {
          if (!triple) {
            throw new ErrorPython('SyntaxError',
              'La cadena de texto de esta línea no está cerrada: falta la comilla ' + q + ' del final.', lineaIni, colIni);
          }
          linea++; inicioLinea = k + 1; k++; continue;
        }
        if (src.startsWith(delim, k)) break;
        k++;
      }
      const t = { tipo: 'STRING', valor: src.slice(ini, k + delim.length), ini, fin: k + delim.length, linea: lineaIni, col: colIni };
      t.prefijo = prefijo.toLowerCase();
      t.comilla = q;
      t.triple = triple;
      t.interior = src.slice(ini2, k);
      toks.push(t);
      return k + delim.length;
    }
  }

  /* ------------------------------------------------------------------ *
   * Analizador sintáctico → árbol sencillo (lista plana de sentencias:
   * if, elif y else son sentencias separadas, igual que los bloques).
   * ------------------------------------------------------------------ */
  class NoSoportado extends Error {}

  function analizar(fuente) {
    const { toks: todos, src } = tokenizar(fuente);
    // Los comentarios al final de una línea de código se convierten en
    // comentarios propios en la línea siguiente.
    const toks = [];
    const finales = new Map();
    for (let k = 0; k < todos.length; k++) {
      const t = todos[k];
      if (t.tipo === 'COMMENT' && !t.solo) {
        let j = toks.length - 1;
        while (j >= 0 && toks[j].tipo === 'COMMENT') j--;
        if (j >= 0) finales.set(toks[j], t);
        continue;
      }
      toks.push(t);
    }

    let p = 0;
    const ver = (d = 0) => toks[Math.min(p + d, toks.length - 1)];
    const es = (tipo, valor, d = 0) => { const t = ver(d); return t.tipo === tipo && (valor === undefined || t.valor === valor); };
    const esOp = (v, d = 0) => es('OP', v, d);
    const esClave = (v, d = 0) => es('NAME', v, d);
    const avanzar = () => toks[p++];
    const errorEn = (t, msg, tipo = 'SyntaxError') => new ErrorPython(tipo, msg, t.linea, t.col);
    const texto = (a, b) => src.slice(a.ini, b.fin);
    let profFuncion = 0, profBucle = 0;

    function comentarioFinal(desde, hasta) {
      for (let k = desde; k < hasta; k++) {
        const c = finales.get(toks[k]);
        if (c) return { t: 'Comment', texto: c.valor.replace(/^#\s?/, ''), linea: c.linea };
      }
      return null;
    }

    function archivo() {
      const cuerpo = [];
      while (!es('EOF')) {
        if (es('NEWLINE')) { avanzar(); continue; }
        if (es('INDENT')) throw errorEn(ver(), 'Sangría inesperada: esta línea tiene espacios al inicio, pero no está dentro de un if, for, while o def. Quita los espacios del principio.', 'IndentationError');
        sentencia(cuerpo);
      }
      validarSecuencia(cuerpo);
      return cuerpo;
    }

    function bloque() {
      // Después de los dos puntos
      if (es('NEWLINE')) {
        const nl = avanzar();
        if (!es('INDENT')) {
          const sig = ver();
          throw new ErrorPython('IndentationError',
            `Se esperaba un bloque con sangría después de los dos puntos de la línea ${nl.linea}. Las instrucciones de dentro deben empezar con 4 espacios más.`,
            sig.tipo === 'EOF' ? nl.linea + 1 : sig.linea, 0);
        }
        avanzar();
        const cuerpo = [];
        while (!es('DEDENT') && !es('EOF')) {
          if (es('NEWLINE')) { avanzar(); continue; }
          if (es('INDENT')) throw errorEn(ver(), 'Sangría inesperada: esta línea tiene más espacios que la anterior sin que haya dos puntos antes.', 'IndentationError');
          sentencia(cuerpo);
        }
        if (es('DEDENT')) avanzar();
        validarSecuencia(cuerpo);
        return cuerpo;
      }
      // Cuerpo en la misma línea: if x: print(x)
      const cuerpo = [];
      sentenciasSimples(cuerpo);
      return cuerpo;
    }

    function validarSecuencia(cuerpo) {
      let previo = null;
      for (const s of cuerpo) {
        if (s.t === 'Comment') continue;
        if (s.t === 'Elif' && !(previo && (previo.t === 'If' || previo.t === 'Elif'))) {
          throw new ErrorPython('SyntaxError', '«elif» debe ir justo después de un «if» o de otro «elif», con la misma sangría.', s.linea, 0);
        }
        if (s.t === 'Else' && !(previo && ['If', 'Elif', 'While', 'For'].includes(previo.t)) && !(previo && previo.t === 'RawBlock' && /^(try|except|finally)\b/.test(previo.cabecera))) {
          throw new ErrorPython('SyntaxError', '«else» debe ir justo después de un «if» o «elif», con la misma sangría.', s.linea, 0);
        }
        previo = s;
      }
    }

    function esperarDosPuntos(cabecera) {
      if (esOp(':')) { avanzar(); return; }
      const t = ver();
      if (t.tipo === 'NEWLINE' || t.tipo === 'EOF') {
        throw new ErrorPython('SyntaxError', `Falta «:» (dos puntos) al final de la línea del «${cabecera}».`, cabecera_linea, 0);
      }
      if (t.tipo === 'OP' && t.valor === '=') {
        throw errorEn(t, 'En una condición se compara con «==» (dos signos). Un solo «=» sirve para guardar un valor en una variable.');
      }
      throw errorEn(t, `No esperaba «${t.valor}» aquí. ¿Falta «:» al final de la línea del «${cabecera}»?`);
    }
    let cabecera_linea = 0;

    function sentencia(cuerpo) {
      const t = ver();
      cabecera_linea = t.linea;
      if (t.tipo === 'COMMENT') {
        avanzar();
        cuerpo.push({ t: 'Comment', texto: t.valor.replace(/^#\s?/, ''), linea: t.linea });
        return;
      }
      if (t.tipo === 'NAME') {
        switch (t.valor) {
          case 'if': case 'elif': case 'while': {
            avanzar();
            const ini = p;
            const cond = expresionORaw([':']);
            if (cond === null) throw errorEn(ver(), `Falta la condición después de «${t.valor}».`);
            const c = comentarioFinal(ini, p + 1);
            esperarDosPuntos(t.valor);
            if (t.valor === 'while') profBucle++;
            const cuerpoInt = bloque();
            if (t.valor === 'while') profBucle--;
            if (c) cuerpoInt.unshift(c);
            cuerpo.push({ t: { if: 'If', elif: 'Elif', while: 'While' }[t.valor], cond, cuerpo: cuerpoInt, linea: t.linea });
            return;
          }
          case 'else': {
            avanzar();
            const c = comentarioFinal(p - 1, p + 1);
            esperarDosPuntos('else');
            const cuerpoInt = bloque();
            if (c) cuerpoInt.unshift(c);
            cuerpo.push({ t: 'Else', cuerpo: cuerpoInt, linea: t.linea });
            return;
          }
          case 'for': {
            avanzar();
            const ini = ver();
            if (es('NAME') && !PALABRAS_CLAVE.has(ver().valor) && esClave('in', 1)) {
              const variable = avanzar().valor;
              avanzar(); // in
              const iter = expresionORaw([':']);
              if (iter === null) throw errorEn(ver(), 'Falta lo que se va a recorrer después de «in».');
              const c = comentarioFinal(p, p + 1);
              esperarDosPuntos('for');
              profBucle++;
              const cuerpoInt = bloque();
              profBucle--;
              if (c) cuerpoInt.unshift(c);
              cuerpo.push({ t: 'For', variable, iter, cuerpo: cuerpoInt, linea: t.linea });
              return;
            }
            // for a, b in ... → bloque de Python libre
            p--;
            bloqueLibre(cuerpo, ini, true);
            return;
          }
          case 'def': {
            avanzar();
            if (!es('NAME') || PALABRAS_CLAVE.has(ver().valor)) throw errorEn(ver(), 'Después de «def» va el nombre de la función, por ejemplo: def saludar():');
            const nombre = avanzar().valor;
            if (!esOp('(')) throw errorEn(ver(), `Después del nombre «${nombre}» van paréntesis: def ${nombre}():`);
            const abre = avanzar();
            let prof = 1;
            const ini = p;
            while (prof > 0) {
              const x = avanzar();
              if (x.tipo === 'EOF') throw errorEn(abre, 'Falta cerrar el paréntesis de la función.');
              if (x.tipo === 'OP' && '([{'.includes(x.valor)) prof++;
              if (x.tipo === 'OP' && ')]}'.includes(x.valor)) prof--;
            }
            const cierra = toks[p - 1];
            const params = src.slice(abre.fin, cierra.ini).trim().replace(/\s+/g, ' ');
            if (esOp('->')) { avanzar(); expresionORaw([':']); }
            const c = comentarioFinal(ini, p + 1);
            esperarDosPuntos('def');
            profFuncion++;
            const bucles = profBucle; profBucle = 0;
            const cuerpoInt = bloque();
            profFuncion--; profBucle = bucles;
            if (c) cuerpoInt.unshift(c);
            cuerpo.push({ t: 'Def', nombre, params, cuerpo: cuerpoInt, linea: t.linea });
            return;
          }
          case 'try': case 'except': case 'finally': case 'with': case 'class': case 'async':
            bloqueLibre(cuerpo, t, false);
            return;
        }
      }
      if (t.tipo === 'OP' && t.valor === '@') { bloqueLibreLinea(cuerpo); return; }
      sentenciasSimples(cuerpo);
    }

    function bloqueLibre(cuerpo, t0, esFor) {
      // Cabecera: todo hasta los dos puntos de nivel 0
      const ini = ver();
      let prof = 0, k = p;
      for (;;) {
        const x = toks[k];
        if (x.tipo === 'NEWLINE' || x.tipo === 'EOF') {
          throw new ErrorPython('SyntaxError', `Falta «:» (dos puntos) al final de la línea del «${ini.valor}».`, ini.linea, 0);
        }
        if (x.tipo === 'OP' && '([{'.includes(x.valor)) prof++;
        if (x.tipo === 'OP' && ')]}'.includes(x.valor)) prof--;
        if (x.tipo === 'OP' && x.valor === ':' && prof === 0) break;
        k++;
      }
      const cabecera = texto(ini, toks[k - 1]);
      p = k + 1;
      if (esFor) profBucle++;
      const cuerpoInt = bloque();
      if (esFor) profBucle--;
      cuerpo.push({ t: 'RawBlock', cabecera, cuerpo: cuerpoInt, linea: ini.linea });
    }

    function bloqueLibreLinea(cuerpo) {
      const ini = ver();
      while (!es('NEWLINE') && !es('EOF')) avanzar();
      cuerpo.push({ t: 'Raw', texto: texto(ini, toks[p - 1]), linea: ini.linea });
      if (es('NEWLINE')) avanzar();
    }

    function sentenciasSimples(cuerpo) {
      for (;;) {
        const ini = p;
        const s = sentenciaSimple();
        cuerpo.push(s);
        const c = comentarioFinal(ini, p + 1);
        if (esOp(';')) {
          avanzar();
          if (c) cuerpo.push(c);
          if (es('NEWLINE') || es('EOF')) break;
          continue;
        }
        if (es('NEWLINE')) { avanzar(); if (c) cuerpo.push(c); break; }
        if (es('EOF') || es('DEDENT')) { if (c) cuerpo.push(c); break; }
        const t = ver();
        if (t.tipo === 'OP' && t.valor === ':') {
          throw errorEn(t, 'Sobran los dos puntos «:». Solo van al final de if, elif, else, for, while y def.');
        }
        throw errorEn(t, `No esperaba «${t.valor || t.tipo}» aquí. ¿Falta una coma, un operador o un paréntesis?`);
      }
    }

    function sentenciaSimple() {
      const t = ver();
      if (t.tipo === 'NAME') {
        switch (t.valor) {
          case 'pass': avanzar(); return { t: 'Pass', linea: t.linea };
          case 'break':
            avanzar();
            if (profBucle === 0) throw errorEn(t, '«break» solo puede usarse dentro de un bucle for o while.');
            return { t: 'Break', linea: t.linea };
          case 'continue':
            avanzar();
            if (profBucle === 0) throw errorEn(t, '«continue» solo puede usarse dentro de un bucle for o while.');
            return { t: 'Continue', linea: t.linea };
          case 'return': {
            avanzar();
            if (profFuncion === 0) throw errorEn(t, '«return» solo puede usarse dentro de una función (def).');
            if (es('NEWLINE') || es('EOF') || esOp(';') || es('DEDENT')) return { t: 'Return', valor: null, linea: t.linea };
            return { t: 'Return', valor: expresionORaw([';']), linea: t.linea };
          }
          case 'import': {
            if (es('NAME', undefined, 1) && (es('NEWLINE', undefined, 2) || es('EOF', undefined, 2) || esOp(';', 2))) {
              avanzar();
              const m = avanzar().valor;
              return { t: 'Import', modulo: m, linea: t.linea };
            }
            return lineaLibre();
          }
          case 'from': case 'global': case 'nonlocal': case 'del': case 'assert': case 'raise': case 'yield':
            return lineaLibre();
          case 'print':
            if (es('STRING', undefined, 1) || (es('NAME', undefined, 1) && !PALABRAS_CLAVE.has(ver(1).valor))) {
              throw errorEn(t, 'En Python 3, print necesita paréntesis: print("hola").');
            }
            break;
          case 'else': case 'elif':
            throw errorEn(t, `«${t.valor}» no puede ir aquí: debe empezar su propia línea, justo después del bloque del if.`);
          case 'if': case 'for': case 'while': case 'def':
            throw errorEn(t, `«${t.valor}» debe empezar su propia línea.`);
        }
      }
      if (t.tipo === 'OP' && t.valor === '=') throw errorEn(t, 'Falta el nombre de la variable antes de «=».');

      const ini = p;
      const objetivo = expresionORaw(['=', ...ASIGNACION_AUMENTADA, ';']);
      if (objetivo === null) throw errorEn(ver(), `No esperaba «${ver().valor || ver().tipo}» aquí.`);
      if (esOp('=')) {
        const igual = avanzar();
        if (es('NEWLINE') || es('EOF')) throw errorEn(igual, 'Falta el valor después de «=».');
        if (objetivo.t !== 'Name' && objetivo.t !== 'Subscript') {
          if (objetivo.t === 'Call') throw errorEn(igual, 'No se puede guardar un valor en una llamada a función. A la izquierda de «=» va el nombre de una variable.');
          if (objetivo.t === 'Num' || objetivo.t === 'Str') throw errorEn(igual, 'A la izquierda de «=» va el nombre de una variable, no un valor. Ejemplo: edad = 12');
          p = ini;
          return lineaLibre();
        }
        const ini2 = p;
        const valor = expresionORaw([';', '=']);
        if (esOp('=')) { p = ini; return lineaLibre(); }       // a = b = 0
        if (valor === null) { p = ini2; return lineaLibre(); }
        if (objetivo.t === 'Name') return { t: 'Assign', nombre: objetivo.id, valor, linea: t.linea };
        return { t: 'SetItem', obj: objetivo.obj, indice: objetivo.indice, valor, linea: t.linea };
      }
      if (es('OP') && ASIGNACION_AUMENTADA.has(ver().valor)) {
        const op = avanzar().valor;
        const valor = expresionORaw([';']);
        if (objetivo.t === 'Name' && ['+=', '-=', '*=', '/='].includes(op) && valor) {
          return { t: 'AugAssign', nombre: objetivo.id, op, valor, linea: t.linea };
        }
        p = ini;
        return lineaLibre();
      }
      return { t: 'Expr', valor: objetivo, linea: t.linea };
    }

    function lineaLibre() {
      const ini = ver();
      let prof = 0;
      while (!es('EOF')) {
        const x = ver();
        if (prof === 0 && (x.tipo === 'NEWLINE' || (x.tipo === 'OP' && x.valor === ';'))) break;
        if (x.tipo === 'OP' && '([{'.includes(x.valor)) prof++;
        if (x.tipo === 'OP' && ')]}'.includes(x.valor)) prof--;
        avanzar();
      }
      return { t: 'Raw', texto: texto(ini, toks[p - 1]), linea: ini.linea };
    }

    /* ---- Expresiones ---- */
    // Intenta analizar una expresión; si usa algo que no tiene bloque
    // (rebanadas, lambda, diccionarios...), la guarda como Python libre.
    function expresionORaw(paradas) {
      const ini = p;
      const t0 = ver();
      if (t0.tipo === 'NEWLINE' || t0.tipo === 'EOF' || (t0.tipo === 'OP' && paradas.includes(t0.valor))) return null;
      try {
        const e = expresion();
        const t = ver();
        if (t.tipo === 'NEWLINE' || t.tipo === 'EOF' || t.tipo === 'DEDENT' || (t.tipo === 'OP' && (paradas.includes(t.valor) || t.valor === ')' || t.valor === ']' || t.valor === ','))) return e;
        if (t.tipo === 'OP' && (t.valor === '=' || t.valor === ':') && !paradas.includes(t.valor)) return e;
      } catch (err) {
        if (!(err instanceof NoSoportado)) throw err;
      }
      p = ini;
      return escanearLibre(paradas);
    }

    function escanearLibre(paradas) {
      const ini = ver();
      let prof = 0;
      let prev = null;
      while (!es('EOF')) {
        const x = ver();
        if (prof === 0) {
          if (x.tipo === 'NEWLINE' || x.tipo === 'DEDENT') break;
          if (x.tipo === 'OP' && (paradas.includes(x.valor) || x.valor === ')' || x.valor === ']' || x.valor === ',')) break;
        }
        if (x.tipo === 'OP' && '([{'.includes(x.valor)) prof++;
        if (x.tipo === 'OP' && ')]}'.includes(x.valor)) prof--;
        if (prev && pegados(prev, x)) {
          throw errorEn(x, `Falta un operador o una coma entre «${prev.valor}» y «${x.valor}».`);
        }
        prev = x;
        avanzar();
      }
      if (p === toks.indexOf(ini)) return null;
      return { t: 'RawExpr', texto: texto(ini, toks[p - 1]) };
    }

    function pegados(a, b) {
      const atomo = x => (x.tipo === 'NAME' && !PALABRAS_CLAVE.has(x.valor)) || x.tipo === 'NUMBER' || x.tipo === 'STRING' || x.tipo === 'HUECO';
      const literal = x => x.tipo === 'NUMBER' || x.tipo === 'STRING';
      if (!atomo(a) || !atomo(b)) return false;
      if (a.tipo === 'STRING' && b.tipo === 'STRING') return false;
      return literal(a) || literal(b) || (a.tipo === 'NAME' && b.tipo === 'NAME');
    }

    function expresion() {
      if (esClave('lambda')) throw new NoSoportado();
      const e = oLogico();
      if (esClave('if')) throw new NoSoportado();          // a if c else b
      if (esOp(':=')) throw new NoSoportado();
      return e;
    }
    function oLogico() {
      let e = yLogico();
      while (esClave('or')) { avanzar(); e = { t: 'BoolOp', op: 'or', a: e, b: yLogico() }; }
      return e;
    }
    function yLogico() {
      let e = noLogico();
      while (esClave('and')) { avanzar(); e = { t: 'BoolOp', op: 'and', a: e, b: noLogico() }; }
      return e;
    }
    function noLogico() {
      if (esClave('not')) { avanzar(); return { t: 'Not', v: noLogico() }; }
      return comparacion();
    }
    const COMPARADORES = ['==', '!=', '<', '<=', '>', '>='];
    function comparacion() {
      const a = aritmetica();
      let op = null;
      if (es('OP') && COMPARADORES.includes(ver().valor)) op = avanzar().valor;
      else if (esClave('in')) { avanzar(); op = 'in'; }
      else if (esClave('not') && esClave('in', 1)) { avanzar(); avanzar(); op = 'not in'; }
      else if (esClave('is')) throw new NoSoportado();
      else if (esOp('=') && false) op = null;
      if (!op) return a;
      const b = aritmetica();
      if ((es('OP') && COMPARADORES.includes(ver().valor)) || esClave('in') || esClave('is') || (esClave('not') && esClave('in', 1))) {
        throw new NoSoportado();                         // 0 < x < 10
      }
      if (op === 'in' || op === 'not in') return { t: 'In', op, a, b };
      return { t: 'Compare', op, a, b };
    }
    function aritmetica() {
      let e = termino();
      while (esOp('+') || esOp('-')) { const op = avanzar().valor; e = { t: 'BinOp', op, a: e, b: termino() }; }
      return e;
    }
    function termino() {
      let e = factor();
      while (esOp('*') || esOp('/') || esOp('//') || esOp('%') || esOp('@')) {
        const op = avanzar().valor;
        if (op === '@') throw new NoSoportado();
        e = { t: 'BinOp', op, a: e, b: factor() };
      }
      return e;
    }
    function factor() {
      if (esOp('-')) {
        avanzar();
        const v = factor();
        if (v.t === 'Num' && !v.texto.startsWith('-')) return { t: 'Num', texto: '-' + v.texto };
        return { t: 'Neg', v };
      }
      if (esOp('+') || esOp('~')) throw new NoSoportado();
      return potencia();
    }
    function potencia() {
      const base = primario();
      if (esOp('**')) { avanzar(); return { t: 'BinOp', op: '**', a: base, b: factor() }; }
      return base;
    }
    function primario() {
      let e = atomo();
      for (;;) {
        if (esOp('(')) {
          const abre = avanzar();
          const { args, kwargs } = argumentos();
          if (!esOp(')')) throw errorEn(abre, 'Falta cerrar el paréntesis «)».');
          avanzar();
          e = { t: 'Call', func: e, args, kwargs };
        } else if (esOp('[')) {
          avanzar();
          if (esOp(':') || esOp(']')) throw new NoSoportado();
          const indice = expresion();
          if (!esOp(']')) throw new NoSoportado();       // rebanadas a[1:3]

    `<circle cx="12" cy="12" r="10.5" fill="#ffffff" fill-opacity="0.92"/>${cuerpo}</svg>`);

    },
    /* ---- Azar ---- */
    {

      args0: [{ type: 'field_input', name: 'NOMBRE', text: 'saludar' }, { type: 'field_input', name: 'PARAMS', text: '' }],
      message1: '%1', args1: [{ type: 'input_statement', name: 'DO' }],
      previousStatement: null, nextStatement: null, colour: COLOR.funciones,

    },

    },

    },
    /* ---- Python libre ---- */
    {

    },

    },

      previousStatement: null, nextStatement: null, colour: COLOR.libre, tooltip: 'Un bloque de Python escrito a mano.'
    },
    {
      type: 'py_hueco', message0: '✎ %1', args0: [{ type: 'field_input', name: 'CODIGO', text: '' }],
      output: null, colour: COLOR.hueco,
      tooltip: 'Hueco: escribe aquí la expresión en Python (también puedes escribirla en el panel de Python).'
    }
  ];

  function registrar() {
    if (registrar.hecho) return;
    registrar.hecho = true;
    Blockly.defineBlocksWithJsonArray(definiciones);

    // Validadores y avisos que no caben en JSON
    const conValidador = (tipo, campo, fn) => {
      const init = Blockly.Blocks[tipo].init;
      Blockly.Blocks[tipo].init = function () {
        init.call(this);
        this.getField(campo).setValidator(fn);
      };
    };
    conValidador('py_number', 'NUM', validarNumero);
    conValidador('py_def', 'NOMBRE', validarNombre);
    conValidador('py_def', 'PARAMS', validarParametros);
    conValidador('py_kwarg', 'NOMBRE', validarNombre);
    for (const t of ['py_string', 'py_fstring', 'py_comment']) conValidador(t, 'TEXTO', comillas);
    for (const t of ['py_raw_stmt', 'py_raw_expr', 'py_hueco']) conValidador(t, 'CODIGO', comillas);
    conValidador('py_raw_block', 'CABECERA', comillas);

    const avisar = (tipo, fn) => { Blockly.Blocks[tipo].onchange = conAviso(fn); };
    avisar('py_elif', function () {
      const a = bloqueAnterior(this);
      return a && (a.type === 'py_if' || a.type === 'py_elif') ? null : 'elif debe ir justo debajo de un bloque if o de otro elif.';
    });
    avisar('py_else', function () {
      const a = bloqueAnterior(this);
      return a && ['py_if', 'py_elif', 'py_for', 'py_while', 'py_raw_block'].includes(a.type) ? null : 'else debe ir justo debajo de un bloque if o elif.';
    });
    avisar('py_break', function () { return dentroDe(this, ['py_for', 'py_while']) ? null : 'break solo funciona dentro de un bucle for o while.'; });
    avisar('py_continue', function () { return dentroDe(this, ['py_for', 'py_while']) ? null : 'continue solo funciona dentro de un bucle for o while.'; });
    avisar('py_return', function () { return dentroDe(this, ['py_def']) ? null : 'return solo funciona dentro de una función (def).'; });

    // Bloques variádicos
    definirVariadico('py_print', { etiqueta: 'print(', cierre: ')', min: 0, max: 8, inicio: 1, color: COLOR.salida, salida: false, tooltip: 'Muestra en pantalla. Con + agregas más piezas separadas por comas.' });
    definirVariadico('py_list', { etiqueta: '[', cierre: ']', min: 0, max: 12, inicio: 3, color: COLOR.listas, salida: true, tooltip: 'Una lista: varios valores en orden, separados por comas.' });
    definirVariadico('py_range', { etiqueta: 'range(', cierre: ')', min: 1, max: 3, inicio: 1, color: COLOR.control, salida: true, tooltip: 'range(5) → 0,1,2,3,4 · range(1, 6) → 1…5 · range(0, 10, 2) → de 2 en 2.' });
    definirVariadico('py_call', { cierre: ')', min: 0, max: 8, inicio: 0, color: COLOR.funciones, salida: true, campoNombre: true, tooltip: 'Usa (llama) una función y obtén lo que devuelve.' });
    definirVariadico('py_call_stmt', { cierre: ')', min: 0, max: 8, inicio: 0, color: COLOR.funciones, salida: false, campoNombre: true, tooltip: 'Usa (llama) una función.' });
    definirVariadico('py_method_call', { cierre: ')', min: 0, max: 8, inicio: 0, color: COLOR.libre, salida: true, campoObjeto: true, tooltip: 'Llama un método de un objeto.' });
    for (const t of ['py_call', 'py_call_stmt', 'py_method_call']) {
      const init = Blockly.Blocks[t].init;
      Blockly.Blocks[t].init = function () { init.call(this); this.getField('NOMBRE').setValidator(validarNombre); };
    }

    // Los huecos se dibujan punteados desde la hoja de estilos (por su color).
  }

  return { registrar, COLOR, validarNumero };
})();

;
/* =========================================================================
 * 21-generador.js — De bloques a Python.
 * Además del código, produce un mapa línea ↔ bloque (para resaltar el bloque
 * y su línea a la vez) y la posición de los huecos editables del modo 2.
 * ========================================================================= */
'use strict';

PB.gen = (() => {
  const MARCA_S = '⁣S';                 // marca de inicio de bloque de instrucción
  const H1 = '⁣H', H2 = '⁤', H3 = '⁥';  // marcas de hueco
  const reHueco = /⁣H([^⁤]*)⁤([^⁥]*)⁥/g;

  // Precedencias de Python (menor número = se agrupa antes)
  const O = { ATOMO: 0, LLAMADA: 2, POT: 3, UNARIO: 4, MULT: 5, SUMA: 6, REL: 11, NOT: 12, AND: 13, OR: 14, NADA: 99 };
  const PREC_ARIT = { '+': O.SUMA, '-': O.SUMA, '*': O.MULT, '/': O.MULT, '//': O.MULT, '%': O.MULT, '**': O.POT };

  let G = null;

  function crear() {
    const Gen = Blockly.CodeGenerator || Blockly.Generator;
    G = new Gen('Python');
    G.INDENT = '    ';
    G.init = function () { this.isInitialized = true; };
    G.finish = function (codigo) { return codigo; };
    G.scrubNakedValue = function () { return ''; };
    G.scrub_ = function (bloque, codigo, soloEste) {
      if (bloque.outputConnection) return codigo;
      let r = MARCA_S + bloque.id + '\n' + codigo;
      const sig = bloque.nextConnection && bloque.nextConnection.targetBlock();
      if (sig && !soloEste) r += G.blockToCode(sig);
      return r;
    };

    const F = G.forBlock;

    /** Código de una entrada de valor, con paréntesis solo si hacen falta. */
    function val(b, nombre, externo, asociativo = false) {
      const hijo = b.getInputTargetBlock(nombre);
      if (!hijo) return '___';
      const r = G.blockToCode(hijo);
      if (!r || (Array.isArray(r) && r[0] === '')) return '___';
      let [codigo, interno] = Array.isArray(r) ? r : [r, O.NADA];
      const mismo = interno === externo;
      const necesita = interno > externo || (mismo && !asociativo && interno > O.LLAMADA && interno !== O.NADA);
      if (necesita) codigo = '(' + codigo + ')';
      return codigo;
    }
    const opcional = (b, nombre, externo) => (b.getInputTargetBlock(nombre) ? val(b, nombre, externo) : '');

    function cuerpo(b, nombre = 'DO') {
      let c = G.statementToCode(b, nombre) || '';
      const real = c.split('\n').some(l => {
        const t = l.trim();
        return t && !t.startsWith('#') && !t.startsWith(MARCA_S);
      });
      if (!real) c += G.INDENT + 'pass\n';
      return c;
    }
    const argumentos = (b) => {
      const r = [];
      for (let i = 0; i < (b.n_ || 0); i++) r.push(val(b, 'ARG' + i, O.NADA));
      return r.join(', ');
    };
    const nombreVar = (b) => {
      const campo = b.getField('VAR');
      const v = campo && campo.getVariable && campo.getVariable();
      return v ? v.name : (campo ? campo.getText() : 'x');
    };
    /** Escapa las comillas dobles sin tocar las secuencias \n, \t, etc. */
    function comillasDobles(txt) {
      let r = '';
      for (let k = 0; k < txt.length; k++) {
        const ch = txt[k];
        if (ch === '\\') { r += ch + (txt[k + 1] ?? '\\'); k++; continue; }
        r += ch === '"' ? '\\"' : ch;
      }
      return r;
    }
    function precedenciaTexto(txt) {
      const t = txt.trim();
      if (!t) return O.ATOMO;
      if (/^-?\d+(\.\d+)?$/.test(t) || /^[A-Za-z_][\w.]*(\([^()]*\))?(\[[^\[\]]*\])?$/.test(t) || /^f?"[^"]*"$/.test(t) || /^'[^']*'$/.test(t)) return O.ATOMO;
      return O.NADA;
    }

    F.py_print = b => 'print(' + argumentos(b) + ')\n';
    F.py_input = b => ['input(' + opcional(b, 'PROMPT', O.NADA) + ')', O.LLAMADA];
    F.py_convert = b => [b.getFieldValue('TIPO') + '(' + val(b, 'VALOR', O.NADA) + ')', O.LLAMADA];
    F.py_comment = b => {
      const t = b.getFieldValue('TEXTO').trim();
      return '#' + (t ? ' ' + t : '') + '\n';
    };
    F.py_assign = b => nombreVar(b) + ' = ' + val(b, 'VALOR', O.NADA) + '\n';
    F.py_augassign = b => nombreVar(b) + ' ' + b.getFieldValue('OP') + ' ' + val(b, 'VALOR', O.NADA) + '\n';
    F.py_var = b => [nombreVar(b), O.ATOMO];
    F.py_number = b => {
      const t = b.getFieldValue('NUM');
      return [t, t.startsWith('-') ? O.UNARIO : O.ATOMO];
    };
    F.py_arith = b => {
      const op = b.getFieldValue('OP');
      const p = PREC_ARIT[op];
      const derechaAsoc = op === '**';
      const a = val(b, 'A', p, !derechaAsoc);
      const c = val(b, 'B', p, derechaAsoc);
      return [a + ' ' + op + ' ' + c, p];
    };
    F.py_round = b => {
      const n = opcional(b, 'N', O.NADA);
      return ['round(' + val(b, 'X', O.NADA) + (n ? ', ' + n : '') + ')', O.LLAMADA];
    };
    F.py_compare = b => [val(b, 'A', O.REL) + ' ' + b.getFieldValue('OP') + ' ' + val(b, 'B', O.REL), O.REL];
    F.py_in = b => [val(b, 'A', O.REL) + ' ' + b.getFieldValue('OP') + ' ' + val(b, 'B', O.REL), O.REL];
    F.py_logic = b => {
      const op = b.getFieldValue('OP');
      const p = op === 'and' ? O.AND : O.OR;
      return [val(b, 'A', p, true) + ' ' + op + ' ' + val(b, 'B', p, true), p];
    };
    F.py_not = b => ['not ' + val(b, 'A', O.NOT, true), O.NOT];
    F.py_bool = b => [b.getFieldValue('VALOR'), O.ATOMO];
    F.py_string = b => ['"' + comillasDobles(b.getFieldValue('TEXTO')) + '"', O.ATOMO];
    F.py_fstring = b => ['f"' + comillasDobles(b.getFieldValue('TEXTO')) + '"', O.ATOMO];
    F.py_len = b => ['len(' + val(b, 'X', O.NADA) + ')', O.LLAMADA];
    F.py_str_method = b => [val(b, 'X', O.LLAMADA) + '.' + b.getFieldValue('METODO') + '()', O.LLAMADA];
    F.py_if = b => 'if ' + val(b, 'COND', O.NADA) + ':\n' + cuerpo(b);
    F.py_elif = b => 'elif ' + val(b, 'COND', O.NADA) + ':\n' + cuerpo(b);
    F.py_else = b => 'else:\n' + cuerpo(b);
    F.py_while = b => 'while ' + val(b, 'COND', O.NADA) + ':\n' + cuerpo(b);
    F.py_for = b => 'for ' + nombreVar(b) + ' in ' + val(b, 'ITER', O.NADA) + ':\n' + cuerpo(b);
    F.py_range = b => ['range(' + argumentos(b) + ')', O.LLAMADA];
    F.py_break = () => 'break\n';
    F.py_continue = () => 'continue\n';
    F.py_pass = () => 'pass\n';
    F.py_list = b => ['[' + argumentos(b) + ']', O.ATOMO];
    F.py_index = b => [val(b, 'LISTA', O.LLAMADA) + '[' + val(b, 'INDICE', O.NADA) + ']', O.LLAMADA];
    F.py_index_set = b => val(b, 'LISTA', O.LLAMADA) + '[' + val(b, 'INDICE', O.NADA) + '] = ' + val(b, 'VALOR', O.NADA) + '\n';
    F.py_append = b => val(b, 'LISTA', O.LLAMADA) + '.' + b.getFieldValue('METODO') + '(' + val(b, 'X', O.NADA) + ')\n';
    F.py_func1 = b => [b.getFieldValue('FUNC') + '(' + val(b, 'X', O.NADA) + ')', O.LLAMADA];
    F.py_import = b => 'import ' + b.getFieldValue('MODULO') + '\n';
    F.py_randint = b => ['random.randint(' + val(b, 'A', O.NADA) + ', ' + val(b, 'B', O.NADA) + ')', O.LLAMADA];
    F.py_choice = b => ['random.choice(' + val(b, 'X', O.NADA) + ')', O.LLAMADA];
    F.py_def = b => 'def ' + b.getFieldValue('NOMBRE') + '(' + b.getFieldValue('PARAMS') + '):\n' + cuerpo(b);
    F.py_return = b => {
      const v = opcional(b, 'VALOR', O.NADA);
      return 'return' + (v ? ' ' + v : '') + '\n';
    };
    F.py_call = b => [b.getFieldValue('NOMBRE') + '(' + argumentos(b) + ')', O.LLAMADA];
    F.py_call_stmt = b => b.getFieldValue('NOMBRE') + '(' + argumentos(b) + ')\n';
    F.py_method_call = b => [val(b, 'OBJ', O.LLAMADA) + '.' + b.getFieldValue('NOMBRE') + '(' + argumentos(b) + ')', O.LLAMADA];
    F.py_kwarg = b => [b.getFieldValue('NOMBRE') + '=' + val(b, 'VALOR', O.NADA), O.NADA];
    F.py_expr_stmt = b => val(b, 'VALOR', O.NADA) + '\n';
    F.py_raw_stmt = b => (b.getFieldValue('CODIGO').trim() || 'pass') + '\n';
    F.py_raw_expr = b => {
      const t = b.getFieldValue('CODIGO').trim();
      return [t || '___', precedenciaTexto(t)];
    };
    F.py_raw_block = b => b.getFieldValue('CABECERA').trim().replace(/:$/, '') + ':\n' + cuerpo(b);
    F.py_hueco = b => {
      const t = b.getFieldValue('CODIGO').trim();
      return [H1 + b.id + H2 + t + H3, precedenciaTexto(t)];
    };
  }

  /**
   * Genera el Python de un espacio de trabajo.
   * Devuelve { codigo, lineas: [{texto, segmentos, bloque}], bloqueALinea, lineaABloque, huecos }
   */
  function generar(ws) {
    if (!G) crear();
    let crudo = '';
    try { crudo = G.workspaceToCode(ws); } catch (e) { console.error('Error al generar Python', e); }
    const lineas = [];
    let pendiente = null;
    for (const l of crudo.split('\n')) {
      const t = l.trimStart();
      if (t.startsWith(MARCA_S)) { pendiente = t.slice(MARCA_S.length); continue; }
      const segmentos = [];
      let k = 0, m;
      reHueco.lastIndex = 0;
      while ((m = reHueco.exec(l)) !== null) {
        if (m.index > k) segmentos.push({ texto: l.slice(k, m.index) });
        segmentos.push({ hueco: m[1], texto: m[2] });
        k = m.index + m[0].length;
      }
      if (k < l.length) segmentos.push({ texto: l.slice(k) });
      const texto = segmentos.map(s => (s.hueco !== undefined ? (s.texto || '___') : s.texto)).join('');
      lineas.push({ texto: texto.replace(/\s+$/, ''), segmentos, bloque: pendiente });
      pendiente = null;
    }
    // Limpieza de líneas vacías al inicio, al final y repetidas
    const limpias = [];
    for (const l of lineas) {
      if (!l.texto.trim()) {
        if (!limpias.length || !limpias[limpias.length - 1].texto.trim()) continue;
        limpias.push({ texto: '', segmentos: [], bloque: null });
      } else limpias.push(l);
    }
    while (limpias.length && !limpias[limpias.length - 1].texto.trim()) limpias.pop();

    const bloqueALinea = {}, lineaABloque = {}, huecos = [];
    limpias.forEach((l, i) => {
      if (l.bloque) { bloqueALinea[l.bloque] = i + 1; lineaABloque[i + 1] = l.bloque; }
      for (const s of l.segmentos) if (s.hueco !== undefined) huecos.push({ id: s.hueco, linea: i + 1, texto: s.texto });

    const codigo = limpias.map(l => l.texto).join('\n') + (limpias.length ? '\n' : '');

  /** La línea de un bloque cualquiera (si es un valor, la de su instrucción). */

    while (b) {
      if (resultado.bloqueALinea[b.id]) return resultado.bloqueALinea[b.id];
      b = b.getParent();
    }
    return null;

/* =========================================================================
 * 22-conversor.js — De Python a bloques.
 * Convierte el árbol de PB.py.analizar en el JSON de Blockly. Así el código
 * inicial de cada reto se escribe en Python y la plataforma lo muestra como
 * bloques; también permite ver como bloques lo que el alumno escribe.
 * ========================================================================= */
'use strict';

PB.conv = (() => {
  const ARIT = new Set(['+', '-', '*', '/', '//', '%', '**']);
  const METODOS_TEXTO = new Set(['upper', 'lower', 'title', 'capitalize', 'strip']);
  const FUNC1 = new Set(['max', 'min', 'sum', 'sorted', 'abs']);

  function aBloques(codigo, opciones = {}) {
    const arbol = PB.py.analizar(codigo);           // puede lanzar ErrorPython
    const cont = { libres: 0, bloqueado: !!opciones.bloquear };
    const primero = cadena(arbol, cont);
    const bloques = primero ? [Object.assign(primero, { x: 24, y: 24 })] : [];
    return { json: { blocks: { languageVersion: 0, blocks: bloques } }, libres: cont.libres };
  }

  function cadena(sentencias, cont) {
    let primero = null, ultimo = null;
    for (const s of sentencias) {
      const b = sentencia(s, cont);
      if (!b) continue;
      if (cont.bloqueado) { b.deletable = false; b.movable = false; }
      if (!primero) primero = b;
      else ultimo.next = { block: b };
      ultimo = b;
    }
    return primero;
  }

  const conCuerpo = (b, cuerpo, cont) => {
    const c = cadena(cuerpo, cont);
    if (c) { b.inputs = b.inputs || {}; b.inputs.DO = { block: c }; }
    return b;
  };

  function entrada(expr, cont) {
    if (!expr || expr.t === 'Blank') return undefined;
    if (expr.t === 'Hueco') return { shadow: { type: 'py_hueco', fields: { CODIGO: expr.texto } } };
    const b = expresion(expr, cont);
    return b ? { block: b } : undefined;
  }

  function conEntradas(tipo, entradas, cont, extra = {}) {
    const b = Object.assign({ type: tipo }, extra);
    for (const [nombre, expr] of Object.entries(entradas)) {
      const e = entrada(expr, cont);
      if (e) { b.inputs = b.inputs || {}; b.inputs[nombre] = e; }
    }
    return b;
  }

  function variadico(tipo, args, kwargs, cont, extra = {}) {
    const todos = args.slice();
    for (const kw of kwargs || []) todos.push({ t: 'Kwarg', nombre: kw.nombre, valor: kw.valor });
    const b = Object.assign({ type: tipo, extraState: { n: todos.length } }, extra);
    todos.forEach((a, i) => {
      const e = entrada(a, cont);
      if (e) { b.inputs = b.inputs || {}; b.inputs['ARG' + i] = e; }
    });
    return b;
  }

  function sentencia(s, cont) {
    switch (s.t) {
      case 'Comment': return { type: 'py_comment', fields: { TEXTO: s.texto } };
      case 'Pass': return { type: 'py_pass' };
      case 'Break': return { type: 'py_break' };
      case 'Continue': return { type: 'py_continue' };
      case 'Import':
        if (['random', 'math', 'time'].includes(s.modulo)) return { type: 'py_import', fields: { MODULO: s.modulo } };
        cont.libres++;
        return { type: 'py_raw_stmt', fields: { CODIGO: 'import ' + s.modulo } };
      case 'Raw': cont.libres++; return { type: 'py_raw_stmt', fields: { CODIGO: s.texto } };
      case 'RawBlock': cont.libres++; return conCuerpo({ type: 'py_raw_block', fields: { CABECERA: s.cabecera } }, s.cuerpo, cont);
      case 'Assign': return conEntradas('py_assign', { VALOR: s.valor }, cont, { fields: { VAR: { name: s.nombre } } });
      case 'AugAssign': return conEntradas('py_augassign', { VALOR: s.valor }, cont, { fields: { VAR: { name: s.nombre }, OP: s.op } });
      case 'SetItem': return conEntradas('py_index_set', { LISTA: s.obj, INDICE: s.indice, VALOR: s.valor }, cont);
      case 'If': return conCuerpo(conEntradas('py_if', { COND: s.cond }, cont), s.cuerpo, cont);
      case 'Elif': return conCuerpo(conEntradas('py_elif', { COND: s.cond }, cont), s.cuerpo, cont);
      case 'Else': return conCuerpo({ type: 'py_else' }, s.cuerpo, cont);
      case 'While': return conCuerpo(conEntradas('py_while', { COND: s.cond }, cont), s.cuerpo, cont);
      case 'For': return conCuerpo(conEntradas('py_for', { ITER: s.iter }, cont, { fields: { VAR: { name: s.variable } } }), s.cuerpo, cont);
      case 'Def': return conCuerpo({ type: 'py_def', fields: { NOMBRE: s.nombre, PARAMS: s.params } }, s.cuerpo, cont);
      case 'Return': return conEntradas('py_return', { VALOR: s.valor }, cont);
      case 'Expr': return expresionComoSentencia(s.valor, cont);
    }
    cont.libres++;
    return { type: 'py_raw_stmt', fields: { CODIGO: '' } };
  }

  function expresionComoSentencia(e, cont) {
    if (e.t === 'Call') {
      if (e.func.t === 'Name') {
        if (e.func.id === 'print') return variadico('py_print', e.args, e.kwargs, cont);
        return variadico('py_call_stmt', e.args, e.kwargs, cont, { fields: { NOMBRE: e.func.id } });
      }
      if (e.func.t === 'Attribute' && (e.func.attr === 'append' || e.func.attr === 'remove') && e.args.length === 1 && !e.kwargs.length) {
        return conEntradas('py_append', { LISTA: e.func.obj, X: e.args[0] }, cont, { fields: { METODO: e.func.attr } });
      }
    }
    return conEntradas('py_expr_stmt', { VALOR: e }, cont);
  }

  function libre(texto, cont) {
    cont.libres++;
    return { type: 'py_raw_expr', fields: { CODIGO: texto } };
  }

  function expresion(e, cont) {
    switch (e.t) {
      case 'Name': return { type: 'py_var', fields: { VAR: { name: e.id } } };
      case 'Num': return { type: 'py_number', fields: { NUM: e.texto } };
      case 'Str': return { type: 'py_string', fields: { TEXTO: e.texto } };
      case 'FStr': return { type: 'py_fstring', fields: { TEXTO: e.texto } };
      case 'Bool': return { type: 'py_bool', fields: { VALOR: e.v } };
      case 'None': return libre('None', cont);
      case 'RawExpr': return libre(e.texto, cont);
      case 'Hueco': return { type: 'py_hueco', fields: { CODIGO: e.texto } };
      case 'Kwarg': return conEntradas('py_kwarg', { VALOR: e.valor }, cont, { fields: { NOMBRE: e.nombre } });
      case 'BinOp':
        if (ARIT.has(e.op)) return conEntradas('py_arith', { A: e.a, B: e.b }, cont, { fields: { OP: e.op } });
        break;
      case 'Compare': return conEntradas('py_compare', { A: e.a, B: e.b }, cont, { fields: { OP: e.op } });
      case 'In': return conEntradas('py_in', { A: e.a, B: e.b }, cont, { fields: { OP: e.op } });
      case 'BoolOp': return conEntradas('py_logic', { A: e.a, B: e.b }, cont, { fields: { OP: e.op } });
      case 'Not': return conEntradas('py_not', { A: e.v }, cont);
      case 'Neg': return libre('-' + textoDe(e.v), cont);
      case 'List': return variadico('py_list', e.items, [], cont);
      case 'Subscript': return conEntradas('py_index', { LISTA: e.obj, INDICE: e.indice }, cont);
      case 'Attribute': return libre(textoDe(e), cont);
      case 'Call': return llamada(e, cont);
    }
    return libre(textoDe(e), cont);
  }

  function llamada(e, cont) {
    const { func, args, kwargs } = e;
    const sinKw = !kwargs.length;
    if (func.t === 'Name') {
      const f = func.id;
      if (f === 'input' && sinKw && args.length <= 1) return conEntradas('py_input', { PROMPT: args[0] }, cont);
      if ((f === 'int' || f === 'float' || f === 'str') && sinKw && args.length === 1) return conEntradas('py_convert', { VALOR: args[0] }, cont, { fields: { TIPO: f } });
      if (f === 'len' && sinKw && args.length === 1) return conEntradas('py_len', { X: args[0] }, cont);
      if (FUNC1.has(f) && sinKw && args.length === 1) return conEntradas('py_func1', { X: args[0] }, cont, { fields: { FUNC: f } });
      if (f === 'round' && sinKw && (args.length === 1 || args.length === 2)) return conEntradas('py_round', { X: args[0], N: args[1] }, cont);
      if (f === 'range' && sinKw && args.length >= 1 && args.length <= 3) return variadico('py_range', args, [], cont);
      return variadico('py_call', args, kwargs, cont, { fields: { NOMBRE: f } });
    }
    if (func.t === 'Attribute') {
      if (func.obj.t === 'Name' && func.obj.id === 'random' && sinKw) {
        if (func.attr === 'randint' && args.length === 2) return conEntradas('py_randint', { A: args[0], B: args[1] }, cont);
        if (func.attr === 'choice' && args.length === 1) return conEntradas('py_choice', { X: args[0] }, cont);
      }
      if (METODOS_TEXTO.has(func.attr) && !args.length && sinKw) {
        return conEntradas('py_str_method', { X: func.obj }, cont, { fields: { METODO: func.attr } });
      }
      const b = variadico('py_method_call', args, kwargs, cont, { fields: { NOMBRE: func.attr } });
      const obj = entrada(func.obj, cont);
      if (obj) { b.inputs = b.inputs || {}; b.inputs.OBJ = obj; }
      return b;
    }
    return libre(textoDe(e), cont);
  }

  /** Reconstruye el texto de una expresión (para las piezas de Python libre). */
  function textoDe(e) {
    if (!e) return '___';
    switch (e.t) {
      case 'Name': return e.id;
      case 'Num': return e.texto;
      case 'Str': return '"' + e.texto + '"';
      case 'FStr': return 'f"' + e.texto + '"';
      case 'Bool': return e.v;
      case 'None': return 'None';
      case 'Blank': return '___';
      case 'Hueco': return e.texto || '___';
      case 'RawExpr': return e.texto;
      case 'BinOp': return '(' + textoDe(e.a) + ' ' + e.op + ' ' + textoDe(e.b) + ')';
      case 'Compare': case 'In': return textoDe(e.a) + ' ' + e.op + ' ' + textoDe(e.b);
      case 'BoolOp': return textoDe(e.a) + ' ' + e.op + ' ' + textoDe(e.b);
      case 'Not': return 'not ' + textoDe(e.v);
      case 'Neg': return '-' + textoDe(e.v);
      case 'List': return '[' + e.items.map(textoDe).join(', ') + ']';
      case 'Subscript': return textoDe(e.obj) + '[' + textoDe(e.indice) + ']';
      case 'Attribute': return textoDe(e.obj) + '.' + e.attr;
      case 'Call': return textoDe(e.func) + '(' + e.args.map(textoDe).concat(e.kwargs.map(k => k.nombre + '=' + textoDe(k.valor))).join(', ') + ')';
    }
    return '___';
  }

  /** Carga código Python como bloques en un espacio de trabajo. */
  function cargar(ws, codigo, opciones = {}) {
    const r = aBloques(codigo, opciones);
    Blockly.Events.disable();
    try {
      ws.clear();
      Blockly.serialization.workspaces.load(r.json, ws);
    } finally {
      Blockly.Events.enable();
    }
    return r;
  }

  /** Convierte una expresión escrita a mano (p. ej. en un hueco) en un bloque. */
  function expresionABloque(texto) {
    const arbol = PB.py.analizar(texto);
    if (arbol.length !== 1 || arbol[0].t !== 'Expr') return null;
    const cont = { libres: 0 };
    return expresion(arbol[0].valor, cont);
  }

  return { aBloques, cargar, expresionABloque };
})();

          toolboxBackgroundColour: '#FFFFFF',

          flyoutBackgroundColour: '#EEF1F8',
          flyoutForegroundColour: '#3A3F58',
          flyoutOpacity: 1,
          scrollbarColour: '#C5CBDD',
          scrollbarOpacity: 0.8,
          insertionMarkerColour: '#000000',
          insertionMarkerOpacity: 0.2
        },
        fontStyle: { family: '"Nunito", "Segoe UI", system-ui, sans-serif', weight: '700', size: 12 },
        startHats: false
      });
    } catch (e) { tema = null; }

    Blockly.dialog.setAlert((msg, cb) => { PB.ui.alerta(msg).then(() => cb && cb()); });
    Blockly.dialog.setConfirm((msg, cb) => { PB.ui.confirmar(msg).then(v => cb && cb(v)); });
    Blockly.dialog.setPrompt((msg, porDefecto, cb) => {
      PB.ui.pedirTexto(msg, porDefecto, { titulo: 'Nombre de variable', validar: PB.py.problemaConNombre }).then(v => cb(v));
    });
    const M = Blockly.Msg;
    M.NEW_VARIABLE = 'Crear variable…';
    M.RENAME_VARIABLE = 'Cambiar nombre de la variable…';
    M.DELETE_VARIABLE = 'Borrar la variable «%1»';
    M.VARIABLE_ALREADY_EXISTS = 'Ya existe una variable llamada «%1».';
  }

  /* ---------- Categorías dinámicas ---------- */
  function registrarDinamicas(ws, ctx) {
    ws.registerButtonCallback('CREAR_VARIABLE', async () => {
      const nombre = await PB.ui.pedirTexto('Escribe el nombre de la nueva variable (sin espacios ni acentos):', '', {
        titulo: 'Nueva variable', placeholder: 'por ejemplo: puntos',
        validar: n => PB.py.problemaConNombre(n) || (ws.getVariable(n) ? 'Ya existe una variable con ese nombre.' : null)
      });
      if (nombre) {
        ws.createVariable(nombre);
        ws.ultimaVariable_ = nombre;
        const caja = ws.getToolbox();
        if (caja && caja.refreshSelection) caja.refreshSelection();
      }
    });

    ws.registerToolboxCategoryCallback('PY_VARIABLES', (w) => {
      const items = [{ kind: 'button', text: '➕ Crear variable', callbackKey: 'CREAR_VARIABLE' }];
      const vars = w.getVariablesOfType('').map(v => v.name).sort((a, b) => a.localeCompare(b));
      const puede = (t) => permitido(t, DINAMICOS.variables.find(d => d.tipo === t).s, ctx);
      if (!vars.length) {
        items.push({ kind: 'label', text: 'Primero crea una variable.' });
        return items;
      }
      const principal = vars.includes(w.ultimaVariable_) ? w.ultimaVariable_ : vars[0];
      if (puede('py_assign')) {
        items.push({ kind: 'block', type: 'py_assign', fields: { VAR: { name: principal } },
          inputs: { VALOR: ctx.modo === 2 ? HUECO() : num(0) } });
      }
      if (puede('py_augassign')) {
        items.push({ kind: 'block', type: 'py_augassign', fields: { VAR: { name: principal }, OP: '+=' },
          inputs: { VALOR: ctx.modo === 2 ? HUECO() : num(1) } });
      }
      if (puede('py_var')) {
        for (const v of vars) items.push({ kind: 'block', type: 'py_var', fields: { VAR: { name: v } } });
      }
      return items;
    });

    ws.registerToolboxCategoryCallback('PY_FUNCIONES', (w) => {
      const items = [];
      const puede = (t) => permitido(t, DINAMICOS.funciones.find(d => d.tipo === t).s, ctx);
      if (puede('py_def')) items.push({ kind: 'block', type: 'py_def', fields: { NOMBRE: 'saludar', PARAMS: '' } });
      if (puede('py_return')) items.push({ kind: 'block', type: 'py_return' });
      const defs = w.getAllBlocks(false).filter(b => b.type === 'py_def' && !b.isInFlyout);
      const nombres = new Map();
      for (const d of defs) {
        const params = d.getFieldValue('PARAMS').trim();
        nombres.set(d.getFieldValue('NOMBRE'), params ? params.split(',').length : 0);
      }
      if (nombres.size) items.push({ kind: 'label', text: 'Tus funciones:' });
      for (const [nombre, n] of nombres) {
        if (puede('py_call_stmt')) items.push({ kind: 'block', type: 'py_call_stmt', fields: { NOMBRE: nombre }, extraState: { n } });
        if (puede('py_call')) items.push({ kind: 'block', type: 'py_call', fields: { NOMBRE: nombre }, extraState: { n } });
      }
      if (!nombres.size && puede('py_call_stmt')) {
        items.push({ kind: 'label', text: 'Cuando definas una función, aquí aparecerá para usarla.' });
      }
      return items;
    });
  }

  function opcionesBase(extra) {
    return Object.assign({
      renderer: 'zelos',
      theme: tema || undefined,
      media: PB.config.rutaMediaBlockly,
      sounds: false,
      trashcan: true,
      zoom: { controls: true, wheel: true, startScale: 0.85, maxScale: 2.2, minScale: 0.35, scaleSpeed: 1.15, pinch: true },
      move: { scrollbars: true, drag: true, wheel: true },
      grid: { spacing: 28, length: 3, colour: '#E2E6F0', snap: false },
      oneBasedIndex: false
    }, extra || {});
  }

  /** Espacio de trabajo editable. */
  function crearEspacio(div, { sesion, modo, permitidos, escala }) {
    configurar();
    const ctx = { sesion, modo, permitidos };
    const ws = Blockly.inject(div, opcionesBase({
      toolbox: construirCaja(ctx),
      zoom: { controls: true, wheel: true, startScale: escala || 0.85, maxScale: 2.2, minScale: 0.35, scaleSpeed: 1.15, pinch: true }
    }));
    registrarDinamicas(ws, ctx);
    arreglarMedia(div);
    return ws;
  }

  /** Espacio de trabajo de solo lectura (ejemplos, pistas, preguntas). */
  function crearLectura(div, escala = 0.8) {
    configurar();
    const ws = Blockly.inject(div, opcionesBase({
      readOnly: true, trashcan: false,
      zoom: { controls: true, wheel: false, startScale: escala, maxScale: 2, minScale: 0.3, pinch: true },
      move: { scrollbars: true, drag: true, wheel: true }
    }));
    arreglarMedia(div);
    return ws;
  }

  /** En la versión sin conexión, los íconos de Blockly vienen incrustados. */
  function arreglarMedia(div) {
    if (!PB.config.spritesBlockly) return;
    for (const img of div.querySelectorAll('image')) {
      const href = img.getAttribute('xlink:href') || img.getAttribute('href') || '';
      if (href.endsWith('sprites.png')) {
        img.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', PB.config.spritesBlockly);
        img.setAttribute('href', PB.config.spritesBlockly);
      }
    }
  }

  /** Pone una escala legible y muestra el programa desde su esquina superior izquierda. */
  function encuadrar(ws, escala = 0.85) {
    try {
      Blockly.svgResize(ws);
      ws.setScale(escala);
      if (!ws.getTopBlocks(false).length) { ws.scrollCenter(); return; }
      const m = ws.getMetrics();
      ws.scroll(-(m.contentLeft - 16), -(m.contentTop - 16));
    } catch (e) { /* sin bloques */ }
  }

  return { construirCaja, crearEspacio, crearLectura, encuadrar, configurar, CATALOGO };
})();

/* =========================================================================
 * 40-ejecutor.js — Ejecuta Python en el navegador con Skulpt.
 *   · interactivo: la consola pide los datos de input()
 *   · paso a paso: pausa en cada línea y muestra las variables
 *   · prueba: entradas y números «al azar» fijos, para el verificador
 * ========================================================================= */
'use strict';

PB.ejecutor = (() => {
  const DETENIDO = '__PB_DETENIDO__';
  const SIN_ENTRADAS = '__PB_SIN_ENTRADAS__';
  const MAX_SALIDA = 60000;

  let ocupado = false;
  let detenerSolicitado = false;
  let rechazarEntrada = null;
  let pasoPendiente = null;     // {continuar, rechazar} cuando está en pausa
  let pausado = false;
  let retardoPaso = 600;

  function disponible() {
    return typeof window.Sk !== 'undefined' && Sk.misceval && Sk.importMainWithBody;
  }

  function leerModulo(nombre) {
    const archivos = (window.PB_STDLIB && window.PB_STDLIB.files) || (Sk.builtinFiles && Sk.builtinFiles.files) || {};
    if (archivos[nombre] === undefined) throw "File not found: '" + nombre + "'";
    return archivos[nombre];
  }

  function reprCorto(v) {
    let r;
    try {
      r = Sk.misceval.objectRepr(v);
      if (typeof r !== 'string') r = r && r.v !== undefined ? r.v : String(r);
    } catch (e) { r = '?'; }
    return r.length > 80 ? r.slice(0, 77) + '…' : r;
  }

  function tipoDe(v) {
    try { return (v.tp$name || (v.ob$type && v.ob$type.tp$name) || '').toString(); } catch (e) { return ''; }
  }

  function leerVariables(dic) {
    const r = [];
    if (!dic) return r;
    for (const k of Object.keys(dic)) {
      if (k.startsWith('__') || k.startsWith('$')) continue;
      const v = dic[k];
      if (v === undefined || v === null) continue;
      const t = tipoDe(v);
      if (t === 'module') continue;
      if (t === 'function') { r.push({ nombre: k, tipo: 'función', valor: k + '()' }); continue; }
      r.push({ nombre: k, tipo: t, valor: reprCorto(v) });
    }
    return r;
  }

  function preludioAzar(azar) {
    const cola = JSON.stringify(azar);
    return 'import random as __pb_r; __pb_q = ' + cola +
      '; __pb_r.randint = lambda a, b: __pb_q.pop(0) if __pb_q else a' +
      '; __pb_r.choice = lambda s: __pb_q.pop(0) if __pb_q else s[0]' +
      '; __pb_r.shuffle = lambda s: None; __pb_r.random = lambda: 0.5\n';
  }

  function extraerError(e, desfase) {
    const texto = String(e && e.toString ? e.toString() : e);
    if (texto.includes(DETENIDO) || detenerSolicitado) return { tipo: 'Detenido', mensaje: '', linea: null, original: '' };
    if (texto.includes(SIN_ENTRADAS)) return { tipo: 'EntradasAgotadas', mensaje: '', linea: null, original: '' };
    let tipo = 'Error', mensaje = texto, linea = null;
    try {
      if (window.Sk && e instanceof Sk.builtin.BaseException) {
        tipo = String(e.tp$name || (e.constructor && e.constructor.tp$name) || 'Error');
        if (e.args && e.args.v && e.args.v.length) {
          const a = e.args.v[0];
          mensaje = a && a.v !== undefined ? String(a.v) : String(a);
        } else mensaje = '';
        if (e.traceback && e.traceback.length) {
          const marco = e.traceback.find(t => t.filename && t.filename.indexOf('<stdin>') === 0) || e.traceback[0];
          linea = marco.lineno;
        }
      } else if (e instanceof Error) {
        tipo = 'ErrorInterno';
        mensaje = e.message;
      }
    } catch (x) { /* nos quedamos con el texto */ }
    if (linea !== null && desfase) linea -= desfase;
    if (linea !== null && linea < 1) linea = null;
    if (tipo === 'TimeoutError' || tipo === 'TimeLimitError') tipo = 'TiempoAgotado';
    return { tipo, mensaje, linea, original: tipo === 'TiempoAgotado' ? 'TimeLimitError: ' + mensaje : (tipo + (mensaje ? ': ' + mensaje : '')) };
  }

  /**
   * Ejecuta código Python.
   * opciones:
   *   entradas: [..]       → modo prueba (si se acaban, error EntradasAgotadas)
   *   azar: [..]           → valores fijos para random.randint / random.choice
   *   alSalida(t)          → cada fragmento impreso (interactivo)
   *   alEntrada(prompt)    → Promise<string> (interactivo)
   *   paso: {retardo, alLinea(linea, vars, locales)} → paso a paso
   *   limiteMs             → tiempo máximo de cálculo
   */
  async function ejecutar(codigo, opciones = {}) {
    if (!disponible()) {
      return { ok: false, salida: '', salidaPantalla: '', error: { tipo: 'SinInterprete', mensaje: '', linea: null, original: '' } };
    }
    if (ocupado) return { ok: false, salida: '', salidaPantalla: '', error: { tipo: 'Ocupado', mensaje: '', linea: null, original: '' } };
    ocupado = true;
    detenerSolicitado = false;
    pausado = false;
    pasoPendiente = null;

    const modoPrueba = Array.isArray(opciones.entradas);
    const entradas = modoPrueba ? opciones.entradas.map(String) : [];
    let usadas = 0;
    let salida = '';            // solo lo que imprime el programa con print (lo que revisan las pruebas)
    let pantalla = '';          // como se vería en la terminal (mensajes de input y lo que se escribió)
    let excesiva = false;

    const azar = opciones.azar && opciones.azar.length ? opciones.azar : null;
    const preludio = azar ? preludioAzar(azar) : '';
    const desfase = preludio ? 1 : 0;
    const fuente = preludio + codigo;
    const limite = opciones.limiteMs || (modoPrueba ? 4000 : 20000);
    retardoPaso = opciones.paso ? (opciones.paso.retardo ?? 600) : 0;

    const escribir = (t) => {
      if (excesiva) return;
      salida += t;
      pantalla += t;
      if (salida.length > MAX_SALIDA) {
        excesiva = true;
        Sk.execLimit = 1;
      }
      if (opciones.alSalida) opciones.alSalida(t);
    };

    const entrada = (prompt) => {
      const p = prompt === undefined || prompt === null ? '' : String(prompt);
      if (p) {
        pantalla += p;
        if (opciones.alSalida) opciones.alSalida(p);
      }
      if (modoPrueba) {
        if (usadas >= entradas.length) return Promise.reject(new Error(SIN_ENTRADAS));
        const v = entradas[usadas++];
        pantalla += v + '\n';
        return Promise.resolve(v);
      }
      return new Promise((resolve, reject) => {
        rechazarEntrada = reject;
        Promise.resolve(opciones.alEntrada ? opciones.alEntrada(p) : '').then(v => {
          rechazarEntrada = null;
          const valor = PB.util.quitarComillasTipograficas(String(v ?? ''));
          pantalla += valor + '\n';
          usadas++;
          Sk.execStart = Date.now();   // el tiempo de escribir no cuenta
          resolve(valor);
        }, err => { rechazarEntrada = null; reject(err); });
      });
    };

    Sk.configure({
      output: escribir,
      read: leerModulo,
      __future__: Sk.python3,
      inputfun: entrada,
      inputfunTakesPrompt: true,
      execLimit: limite,
      yieldLimit: 100,
      // En paso a paso, los bucles también pausan en su encabezado en cada vuelta
      killableWhile: !!opciones.paso,
      killableFor: !!opciones.paso,
      debugging: !!opciones.paso,
      breakpoints: () => true
    });
    Sk.execLimit = limite;
    Sk.execStart = Date.now();

    const manejadores = {};
    if (opciones.paso) {
      let ultimaLinea = null;
      const manejar = (susp) => new Promise((resolve, reject) => {
        if (detenerSolicitado) { reject(new Error(DETENIDO)); return; }
        let s = susp, modulo = null, profundo = null;
        while (s instanceof Sk.misceval.Suspension) {
          if (s.$loc && Object.prototype.hasOwnProperty.call(s.$loc, '__name__')) modulo = s;
          if (s.$lineno) profundo = s;
          s = s.child;
        }
        const linea = profundo ? profundo.$lineno - desfase : null;
        const continuar = () => {
          pasoPendiente = null;
          Sk.execStart = Date.now();
          try { resolve(susp.resume()); } catch (e) { reject(e); }
        };
        // Misma línea dos veces seguidas (encabezado de bucle): no pausar de nuevo
        if (linea === ultimaLinea && !pausado) { setTimeout(continuar, 0); return; }
        ultimaLinea = linea;
        const vars = modulo ? leerVariables(modulo.$loc) : [];
        let locales = null;
        if (profundo && profundo !== modulo && profundo.$tmps) {
          locales = leerVariables(Object.fromEntries(Object.entries(profundo.$tmps).filter(([k]) => !k.startsWith('$'))));
        }
        try { opciones.paso.alLinea(linea, vars, locales); } catch (e) { /* la interfaz no debe romper la ejecución */ }
        pasoPendiente = { continuar, rechazar: reject };
        if (!pausado) setTimeout(() => { if (pasoPendiente && pasoPendiente.continuar === continuar && !pausado) continuar(); }, retardoPaso);
      });
      manejadores['Sk.debug'] = manejar;
      manejadores['Sk.delay'] = manejar;
    }

    let error = null;
    try {
      await Sk.misceval.asyncToPromise(() => Sk.importMainWithBody('<stdin>', false, fuente, true), manejadores);
    } catch (e) {
      error = extraerError(e, desfase);
    }
    if (excesiva) error = { tipo: 'SalidaExcesiva', mensaje: '', linea: null, original: '' };
    ocupado = false;
    rechazarEntrada = null;
    pasoPendiente = null;
    const fueDetenido = error && error.tipo === 'Detenido';
    detenerSolicitado = false;
    return { ok: !error, salida, salidaPantalla: pantalla, error, detenido: fueDetenido, entradasUsadas: usadas };
  }

  function detener() {
    if (!ocupado) return;
    detenerSolicitado = true;
    try { Sk.execLimit = 1; } catch (e) { /* nada */ }
    if (rechazarEntrada) rechazarEntrada(new Error(DETENIDO));
    if (pasoPendiente) pasoPendiente.rechazar(new Error(DETENIDO));
  }

  function pausar(valor) {
    pausado = valor;
    if (!valor && pasoPendiente) pasoPendiente.continuar();
  }

  function siguientePaso() {
    if (pasoPendiente) pasoPendiente.continuar();
  }

  function fijarRetardo(ms) { retardoPaso = ms; }

  return {
    ejecutar, detener, pausar, siguientePaso, fijarRetardo, disponible,
    get ocupado() { return ocupado; },
    get pausado() { return pausado; }
  };
})();

/* =========================================================================
 * 41-errores.js — Explica los errores de Python en español.
 * Siempre muestra también el nombre original del error (SyntaxError,
 * NameError…) para que el alumno aprenda a reconocerlos.
 * ========================================================================= */
'use strict';

PB.errores = (() => {
  const CONFUSIONES = {
    Print: 'print', PRINT: 'print', imprimir: 'print', escribir: 'print', mostrar: 'print', prnt: 'print', pritn: 'print', pint: 'print',
    Input: 'input', imput: 'input', entrada: 'input', leer: 'input', inpt: 'input',
    true: 'True', false: 'False', verdadero: 'True', falso: 'False', none: 'None',
    Int: 'int', entero: 'int', Float: 'float', Str: 'str', Len: 'len', lenght: 'len', length: 'len',
    Range: 'range', rango: 'range', si: 'if', mientras: 'while', para: 'for', sino: 'else',
    Random: 'random', aleatorio: 'random'
  };

  function nombresDelCodigo(codigo) {
    const c = PB.py.contar(codigo);
    return Object.keys(c.nombres || {});
  }

  function lineaDeAsignacion(codigo, nombre) {
    try {
      const { toks } = PB.py.tokenizar(codigo);
      for (let k = 0; k < toks.length - 1; k++) {
        const t = toks[k];
        if (t.tipo === 'NAME' && t.valor === nombre) {
          const s = toks[k + 1];
          const ant = toks[k - 1];
          if (s.tipo === 'OP' && (s.valor === '=' || s.valor === '+=')) return t.linea;
          if (ant && ant.tipo === 'NAME' && (ant.valor === 'for' || ant.valor === 'def')) return t.linea;
        }
      }
    } catch (e) { /* nada */ }
    return null;
  }

  function sugerencia(nombre, codigo) {
    if (CONFUSIONES[nombre]) return CONFUSIONES[nombre];
    const candidatos = new Set([...nombresDelCodigo(codigo), ...PB.py.FUNCIONES_INTEGRADAS]);
    candidatos.delete(nombre);
    let mejor = null, dist = 3;
    for (const c of candidatos) {
      const d = PB.util.distancia(nombre.toLowerCase(), c.toLowerCase());
      const tope = Math.max(1, Math.floor(Math.min(nombre.length, c.length) / 3));
      if (d < dist && d <= tope) { mejor = c; dist = d; }
    }
    return mejor;
  }

  /**
   * err: {tipo, mensaje, linea, original} de PB.ejecutor
   * Devuelve {tipo, titulo, texto, linea, original}
   */
  function explicar(err, codigo) {
    if (!err) return null;
    const r = { tipo: err.tipo, linea: err.linea, original: err.original || '', texto: '' };
    const m = err.mensaje || '';
    let x;

    switch (err.tipo) {
      case 'SyntaxError': case 'IndentationError': case 'TabError': {
        const diag = PB.py.revisarSintaxis(codigo);
        if (diag) {
          r.tipo = diag.tipo;
          r.linea = diag.linea;
          r.texto = diag.mensaje;
        } else {
          r.texto = 'Python no entiende cómo está escrita esta línea. Revisa que los paréntesis y las comillas cierren, ' +
            'que no falten comas u operadores y que if, for, while y def terminen con dos puntos «:».';
          if (/indent/i.test(m)) {
            r.tipo = 'IndentationError';
            r.texto = 'Hay un problema de sangría (los espacios al inicio de la línea). Las líneas de un mismo bloque deben empezar en la misma columna.';
          }
        }
        break;
      }
      case 'NameError': {
        x = /name '([^']+)' is not defined/.exec(m);
        const nombre = x ? x[1] : '';
        if (nombre === '___') {
          r.texto = 'Todavía hay un hueco «___» sin completar en esta línea. Pon ahí el bloque o el valor que falta.';
          break;
        }
        if (nombre === 'random') {
          r.texto = 'Usas random, pero falta traer el módulo. Agrega «import random» al inicio del programa.';
          break;
        }
        const sug = sugerencia(nombre, codigo);
        const lineaAsig = lineaDeAsignacion(codigo, nombre);
        if (lineaAsig && err.linea && lineaAsig > err.linea) {
          r.texto = `Usas «${nombre}» antes de darle un valor: se crea hasta la línea ${lineaAsig}. En Python primero se guarda el valor y después se usa.`;
        } else if (sug && sug !== nombre) {
          r.texto = `Python no conoce «${nombre}». ¿Quisiste decir «${sug}»? Python distingue mayúsculas y minúsculas, y el nombre debe escribirse exactamente igual.`;
        } else if (nombre && /^[\p{L}_]+$/u.test(nombre) && !lineaAsig) {
          r.texto = `Python no conoce «${nombre}». Si es una variable, primero guárdale un valor (${nombre} = …). Si es un texto, ponlo entre comillas: "${nombre}".`;
        } else {
          r.texto = `Python no conoce el nombre «${nombre}». Revisa cómo está escrito y que tenga un valor antes de usarlo.`;
        }
        break;
      }
      case 'TypeError': {
        if (/concatenate|can only concatenate|for \+: '(int|float)' and 'str'|for \+: 'str' and '(int|float)'/.test(m)) {
          r.texto = 'Estás uniendo con + un texto y un número. Convierte el número en texto con str(), o separa con comas en print: print("Edad:", edad). Si el número viene de input(), recuerda que input() siempre da texto: conviértelo con int() o float().';
