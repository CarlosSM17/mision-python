<style>
/* =========================================================================
 * Estilos de la plataforma «De Bloques a Python»
 * Pensados para iPad (botones grandes, campos de 16 px para que Safari no
 * haga zoom) y para proyectar en el salón.
 * ========================================================================= */
:root {
  color-scheme: light;
  --fondo: #F3F5FA;
  --superficie: #FFFFFF;
  --superficie-2: #F8F9FC;
  --superficie-3: #EEF1F8;
  --borde: #DFE3EE;
  --borde-fuerte: #C9CFDF;
  --texto: #1E2240;
  --texto-suave: #575D7E;
  --texto-tenue: #8A90AA;
  --primario: #4F46E5;
  --primario-oscuro: #3B33C4;
  --primario-suave: #EEEFFF;
  --exito: #15803D;
  --exito-claro: #22A55A;
  --exito-suave: #E7F6EC;
  --error: #C62828;
  --error-suave: #FDECEC;
  --aviso: #B45309;
  --aviso-suave: #FFF5E0;
  --amarillo: #FFAB19;
  --resalte: #FFF2B8;
  --seleccion: #E6E8FF;
  --consola: #1D2033;
  --consola-texto: #E7E9F5;
  --radio: 14px;
  --radio-chico: 9px;
  --sombra: 0 1px 2px rgba(22, 26, 60, .06), 0 6px 18px rgba(22, 26, 60, .07);
  --sombra-alta: 0 10px 40px rgba(22, 26, 60, .22);
  --fuente: "Nunito", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --fuente-codigo: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --cabeza: 56px;
}

* { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
html.texto-grande { font-size: 18px; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--fondo);
  color: var(--texto);
  font-family: var(--fuente);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
#app { min-height: 100%; }
a { color: var(--primario); }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .5em; }
h1 { font-size: 1.7rem; font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 800; }
h3 { font-size: 1.1rem; font-weight: 800; }
p { margin: 0 0 .75em; }
code, pre, .codigo { font-family: var(--fuente-codigo); font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
.panel-python, .editor, .consola, .anim-codigo { font-feature-settings: "liga" 0, "calt" 0; }
button { font-family: inherit; }
input, textarea { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid rgba(79, 70, 229, .45); outline-offset: 2px; }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4em;
  min-height: 40px; padding: 8px 16px; border-radius: 11px; border: 1px solid transparent;
  font-size: .95rem; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: background .15s, transform .08s, box-shadow .15s; -webkit-tap-highlight-color: transparent; user-select: none;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primario { background: var(--primario); color: #fff; box-shadow: 0 2px 0 var(--primario-oscuro); }
.btn-primario:hover:not(:disabled) { background: var(--primario-oscuro); }
.btn-secundario, .btn-suave { background: var(--superficie); color: var(--texto); border-color: var(--borde-fuerte); }
.btn-suave:hover:not(:disabled), .btn-secundario:hover:not(:disabled) { background: var(--superficie-3); }
.btn-ejecutar { background: var(--exito-claro); color: #fff; box-shadow: 0 2px 0 #17803f; }
.btn-ejecutar:hover:not(:disabled) { background: #1c9450; }
.btn-detener, .btn-peligro { background: var(--error); color: #fff; }
.btn-chico { min-height: 34px; padding: 5px 11px; font-size: .88rem; border-radius: 9px; }
.btn-icono {
  display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; padding: 0;
  border-radius: 10px; border: 1px solid var(--borde); background: var(--superficie); color: var(--texto);
  font-size: 1.05rem; font-weight: 800; cursor: pointer; text-decoration: none;
}
.btn-icono:hover { background: var(--superficie-3); }

/* ---------- Campos ---------- */
.campo {
  width: 100%; min-height: 44px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--borde-fuerte);
  background: #fff; color: var(--texto); font: inherit; font-size: 16px; margin-bottom: 8px;
}
.campo:focus { outline: none; border-color: var(--primario); box-shadow: 0 0 0 3px rgba(79, 70, 229, .18); }
.campo-codigo { font-family: var(--fuente-codigo); font-size: 14px; }
.campo-etiqueta { display: block; font-weight: 700; font-size: .9rem; margin: 6px 0 4px; color: var(--texto-suave); }
.campo-error { color: var(--error); font-weight: 700; min-height: 1.2em; margin: 0; }
.nota { color: var(--texto-suave); font-size: .9rem; }
.centro { text-align: center; }

/* ---------- Cabecera de la aplicación ---------- */
.app-cabeza {
  position: sticky; top: 0; z-index: 50; height: var(--cabeza);
  display: flex; align-items: center; gap: 12px; padding: 0 14px;
  background: var(--superficie); border-bottom: 1px solid var(--borde);
}
.marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--texto); min-width: 0; }
.logo { position: relative; width: 36px; height: 36px; flex: none; }
.logo-bloque { position: absolute; inset: 4px 0 0 0; background: var(--amarillo); border-radius: 8px 8px 8px 8px; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .12); }
.logo-bloque::before { content: ""; position: absolute; top: -4px; left: 8px; width: 12px; height: 6px; background: var(--amarillo); border-radius: 3px 3px 0 0; }
.logo-texto { position: absolute; inset: 4px 0 0 0; display: grid; place-items: center; font-family: var(--fuente-codigo); font-weight: 800; color: #3d2a00; font-size: 15px; }
.marca-texto { font-weight: 800; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-nav { display: flex; gap: 4px; margin-left: auto; }
.app-nav a {
  display: flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 10px; text-decoration: none;
  color: var(--texto-suave); font-weight: 700; font-size: .93rem;
}
.app-nav a:hover { background: var(--superficie-3); }
.app-nav a.activo { background: var(--primario-suave); color: var(--primario); }
.app-nav a.nav-docente-activo { color: var(--aviso); }
.app-herramientas { display: flex; align-items: center; gap: 6px; }
.alumno-chip {
  border: 1px solid var(--borde); background: var(--superficie-2); border-radius: 999px; padding: 6px 12px;
  font-weight: 700; font-size: .88rem; cursor: pointer; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--texto);
}
@media (max-width: 900px) {
  .nav-texto { display: none; }
  .marca-texto { max-width: 32vw; }
}
@media (max-width: 560px) {
  .marca-texto, .alumno-chip { display: none; }
  .app-cabeza { gap: 6px; padding: 0 8px; }
  .app-nav a { padding: 7px 8px; }
}
@media (max-width: 440px) {
  .app-herramientas .btn-icono { display: none; }
}

/* ---------- Vista principal ---------- */
.vista { max-width: 1120px; margin: 0 auto; padding: 22px 16px 56px; }
.vista.con-taller { max-width: none; padding: 0; height: calc(100vh - var(--cabeza)); height: calc(100dvh - var(--cabeza)); overflow: hidden; overflow: clip; }
.taller, .taller-cuerpo, .taller-lateral, .lateral-inf { overflow: hidden; overflow: clip; }
.consola-linea input { max-width: calc(100% - 90px); }
.tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 18px; margin-bottom: 16px; box-shadow: var(--sombra); }
.tarjeta.peligro { border-color: #f3c3c3; }
.acciones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.fila-campos { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }
.fila-campos .campo { margin: 0; }
@media (max-width: 640px) { .fila-campos { grid-template-columns: 1fr; } }
.tabla-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: .93rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--borde); vertical-align: top; }
th { background: var(--superficie-2); font-weight: 800; color: var(--texto-suave); font-size: .85rem; }
.aviso-almacen { background: var(--aviso-suave); color: var(--aviso); border-radius: 10px; padding: 10px 14px; font-weight: 700; margin: 10px 0; }

/* ---------- Chips y estrellas ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 800; background: var(--superficie-3); color: var(--texto-suave); white-space: nowrap; }
.chip-modo.modo-1 { background: #F0E9FF; color: #6B3FD6; }
.chip-modo.modo-2 { background: #E8F7EC; color: #237A3B; }
.chip-modo.modo-3 { background: #E6F0FF; color: #2459B8; }
.chip-modo.modo-4 { background: #FFF0E0; color: #A44E00; }
.chip-codigo { font-family: var(--fuente-codigo); font-weight: 600; background: #fff; border: 1px solid var(--borde); color: var(--texto); }
.chip-explorador { background: #E5F6EF; color: #0E7A50; margin-left: 6px; }
.chip-programador { background: #E7ECFF; color: #3644B5; margin-left: 6px; }
.chip-maestro { background: #FFF0D9; color: #9A5A00; margin-left: 6px; }
.estrellas { color: #D7DBE6; letter-spacing: 1px; font-size: 1rem; white-space: nowrap; }
.estrellas .llena { color: #F5B301; }

/* ---------- Inicio ---------- */
.inicio-cabeza {
  display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center;
  background: linear-gradient(135deg, #4F46E5 0%, #7C4DFF 60%, #9966FF 100%); color: #fff;
  border-radius: 20px; padding: 26px; margin-bottom: 18px; box-shadow: var(--sombra);
}
.inicio-cabeza .nota { color: rgba(255, 255, 255, .85); margin: 6px 0 0; }
.lema { font-size: 1.05rem; opacity: .92; }
.barra-progreso { height: 12px; background: rgba(255, 255, 255, .28); border-radius: 999px; overflow: hidden; max-width: 420px; }
.barra-relleno { height: 100%; background: #FFD84D; border-radius: 999px; transition: width .6s ease; }
.insignias-fila { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
.insignia-item { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 86px; text-align: center; font-size: .75rem; font-weight: 700; line-height: 1.2; }
.insignia.bloqueada { opacity: .75; }
.insignia.ganada svg { filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .2)); }
.inicio-cabeza .insignia-item { color: #fff; }
@media (max-width: 820px) {
  .inicio-cabeza { grid-template-columns: 1fr; }
  .insignias-fila { justify-content: flex-start; }
}
.continuar {
  display: flex; align-items: center; gap: 14px; padding: 14px 18px; margin-bottom: 18px; text-decoration: none; color: var(--texto);
  background: var(--superficie); border: 2px solid var(--primario); border-radius: var(--radio); box-shadow: var(--sombra);
}
.continuar small { display: block; color: var(--texto-suave); font-weight: 700; }
.continuar-icono { width: 42px; height: 42px; border-radius: 50%; background: var(--primario); color: #fff; display: grid; place-items: center; font-size: 1.1rem; flex: none; }
.unidad { margin-bottom: 26px; }
.unidad-cabeza { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.unidad-cabeza h2 { margin: 0; }
.unidad-cabeza .nota { margin-left: auto; }
.unidad-icono { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 1.4rem; background: var(--color-unidad); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .12); }
.unidad-num { font-size: .8rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--texto-tenue); }
.rejilla-sesiones { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.tarjeta-sesion {
  position: relative; display: flex; gap: 12px; padding: 14px; text-decoration: none; color: var(--texto);
  background: var(--superficie); border: 1px solid var(--borde); border-left: 6px solid var(--color-unidad);
  border-radius: var(--radio); box-shadow: var(--sombra); transition: transform .12s, box-shadow .12s;
}
.tarjeta-sesion:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(22, 26, 60, .12); }
.ts-num { flex: none; width: 38px; height: 38px; border-radius: 10px; background: var(--superficie-3); display: grid; place-items: center; font-weight: 800; font-size: 1.05rem; }
.ts-cuerpo { min-width: 0; flex: 1; }
.ts-titulo { font-weight: 800; line-height: 1.25; }
.ts-reto { color: var(--texto-suave); font-size: .88rem; margin: 3px 0 8px; }
.ts-pie { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ts-pasos { display: inline-flex; gap: 3px; margin-left: auto; }
.ts-pasos i { width: 7px; height: 7px; border-radius: 50%; background: var(--borde-fuerte); }
.ts-pasos i.visto { background: var(--exito-claro); }
.ts-hecho { position: absolute; top: -8px; right: -8px; width: 26px; height: 26px; border-radius: 50%; background: var(--exito-claro); color: #fff; display: grid; place-items: center; font-weight: 800; box-shadow: var(--sombra); }
.pie-inicio { margin-top: 20px; }

/* ---------- Sesión ---------- */
.sesion-cabeza { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.sesion-titulos { flex: 1; min-width: 0; }
.sesion-unidad { font-weight: 800; font-size: .85rem; color: var(--color-unidad); filter: brightness(.8); text-transform: uppercase; letter-spacing: .05em; }
.sesion-cabeza h1 { margin: 2px 0 8px; }
.sesion-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.sesion-navegacion { display: flex; gap: 6px; flex: none; }
@media (max-width: 640px) { .sesion-navegacion { display: none; } }
.pasos {
  display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 10px; margin-bottom: 14px;
  -webkit-overflow-scrolling: touch; scrollbar-width: thin;
}
.paso {
  display: flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 12px; white-space: nowrap;
  text-decoration: none; color: var(--texto-suave); font-weight: 700; font-size: .9rem;
  background: var(--superficie); border: 1px solid var(--borde);
}
.paso-num { width: 22px; height: 22px; border-radius: 50%; background: var(--superficie-3); display: grid; place-items: center; font-size: .78rem; font-weight: 800; }
.paso.visto .paso-num { background: var(--exito-claro); color: #fff; }
.paso.activo { background: var(--primario); color: #fff; border-color: var(--primario); }
.paso.activo .paso-num { background: #fff; color: var(--primario); }
.sesion-contenido { background: var(--superficie); border: 1px solid var(--borde); border-radius: 18px; padding: 22px; box-shadow: var(--sombra); }
@media (max-width: 640px) { .sesion-contenido { padding: 16px; } }
.siguiente-paso { display: flex; justify-content: flex-end; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--borde); }
.intro-paso { color: var(--texto-suave); }

.historia-grande { display: flex; gap: 14px; align-items: flex-start; background: #FFF8E6; border: 1px solid #F6E1A6; border-radius: var(--radio); padding: 16px; margin-bottom: 16px; font-size: 1.05rem; }
.historia-grande p { margin: 0; }
.historia-icono { font-size: 2rem; line-height: 1; }
.historia { font-style: italic; color: var(--texto-suave); }
.objetivos { background: var(--primario-suave); border-radius: var(--radio); padding: 14px 18px; margin-bottom: 16px; }
.objetivos ul { margin: 0; padding-left: 1.2em; }
.teoria-texto { margin-bottom: 12px; }
.teoria-texto ul, .teoria-texto ol { padding-left: 1.3em; }
.teoria-titulo { margin-top: 22px; }
.analogia { display: flex; gap: 14px; background: #EEF8FF; border: 1px solid #CBE6FF; border-radius: var(--radio); padding: 14px 16px; margin: 14px 0; }
.analogia-icono { font-size: 1.9rem; line-height: 1; }
.fichas { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.ficha, .ficha-mini { background: var(--superficie-2); border: 1px solid var(--borde); border-radius: 12px; padding: 12px; }
.ficha-titulo { font-weight: 800; margin-bottom: 6px; }
.ficha .codigo, .ficha-mini .codigo { margin: 0 0 6px; }
.tabla-comparacion td { vertical-align: middle; }
.tabla-comparacion .codigo { margin: 0; }
.teoria-bloques, .teoria-animacion { margin: 16px 0; }
.bloques-y-python { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: stretch; }
.bloques-y-python .codigo { margin: 0; }
@media (max-width: 700px) { .bloques-y-python { grid-template-columns: 1fr; } }
.bloques-lectura { position: relative; border: 1px solid var(--borde); border-radius: 12px; overflow: hidden; background: #F8F9FC; }

/* ---------- Código con resaltado ---------- */
.codigo {
  background: #FBFBFE; border: 1px solid var(--borde); border-radius: 10px; padding: 10px 14px; margin: 8px 0;
  font-size: 15px; line-height: 1.6; overflow-x: auto; white-space: pre; tab-size: 4; color: #1E2240;
}
.codigo.con-numeros .cn { display: inline-block; width: 2em; margin-right: .8em; color: var(--texto-tenue); text-align: right; user-select: none; }
.codigo.salida { background: var(--consola); color: var(--consola-texto); border-color: var(--consola); }
.codigo.en-opcion { margin: 0; background: transparent; border: 0; padding: 0; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.opcion { min-width: 0; }
.tarjeta .insignias-fila { justify-content: flex-start; }
.tk-kw { color: #9C27B0; font-weight: 700; }
.tk-fn { color: #0B5FCC; }
.tk-def { color: #0B5FCC; font-weight: 700; }
.tk-str, .tk-fstr { color: #18803A; }
.tk-num, .tk-cte { color: #B25000; }
.tk-com { color: #858BA5; font-style: italic; }
.tk-op { color: #B0365A; }

.editor.solo-lectura .editor-texto { caret-color: transparent; }
.barra-simbolos { display: flex; gap: 4px; padding: 6px 8px; overflow-x: auto; background: var(--superficie); border-top: 1px solid var(--borde); flex: none; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
.simbolo { flex: none; min-width: 40px; height: 40px; border-radius: 9px; border: 1px solid var(--borde-fuerte); background: #fff; font-family: var(--fuente-codigo); font-size: 17px; font-weight: 700; color: var(--texto); cursor: pointer; touch-action: manipulation; }
.simbolo:active { background: var(--primario-suave); }

/* ---------- Panel de Python ---------- */
.panel-python { font-family: var(--fuente-codigo); font-size: 15px; line-height: 1.75; padding: 6px 0; font-variant-ligatures: none; }
.pl-linea { display: flex; align-items: baseline; padding: 0 10px 0 0; cursor: pointer; white-space: pre; }
.pl-linea:hover { background: #F4F5FB; }
.pl-num { flex: none; width: 2.6em; padding-right: .9em; text-align: right; color: var(--texto-tenue); font-size: 13px; user-select: none; }
.pl-codigo { white-space: pre; }
.pl-linea.sel { background: var(--seleccion); }
.pl-linea.actual { background: var(--resalte); }
.pl-linea.error { background: var(--error-suave); box-shadow: inset 3px 0 0 var(--error); }
.pl-vacio { padding: 16px; color: var(--texto-tenue); font-family: var(--fuente); font-size: .92rem; }
.pl-hueco {
  font-family: var(--fuente-codigo); font-size: 16px; padding: 1px 6px; margin: 0 1px; min-width: 4ch;
  background: #FFF4B8; border: 2px dashed #C99A00; border-radius: 6px; color: #3d2f00; outline: none;
}
.pl-hueco:focus { border-style: solid; background: #fff; box-shadow: 0 0 0 3px rgba(201, 154, 0, .25); }

/* ---------- Consola ---------- */
.consola {
  background: var(--consola); color: var(--consola-texto); font-family: var(--fuente-codigo); font-size: 15px; line-height: 1.55;
  padding: 10px 12px; overflow: auto; min-height: 80px; height: 100%; font-variant-ligatures: none;
}
.consola-vacia { color: #8D93B5; font-family: var(--fuente); font-size: .9rem; }
.consola-linea { white-space: pre-wrap; word-break: break-word; min-height: 1.55em; display: flex; flex-wrap: wrap; align-items: center; }
.consola-usuario { color: #FFD84D; font-weight: 700; }
.consola-entrada {
  flex: 1; min-width: 120px; font-family: var(--fuente-codigo); font-size: 16px; color: #FFD84D; background: rgba(255, 255, 255, .07);
  border: 0; border-bottom: 2px solid #FFD84D; padding: 3px 6px; outline: none; border-radius: 4px 4px 0 0;
}
.consola-enviar { margin-left: 6px; border: 0; border-radius: 7px; background: #FFD84D; color: #2d2400; font-weight: 800; padding: 5px 10px; cursor: pointer; font-family: var(--fuente); }
.consola-mensaje { margin: 8px 0 4px; padding: 9px 12px; border-radius: 9px; font-family: var(--fuente); font-size: .92rem; white-space: normal; }
.consola-error { background: #3A1E26; border: 1px solid #7A3343; color: #FFD9DF; }
.consola-exito { background: #183A27; color: #BDF0CF; }
.consola-info { background: #262A45; color: #CDD2F0; }
.error-titulo { font-weight: 800; margin-bottom: 3px; }
.error-original { margin-top: 6px; font-family: var(--fuente-codigo); font-size: 12.5px; opacity: .75; }

/* ---------- Variables ---------- */
.variables { padding: 8px 10px; background: #fff; }
.variables-vacio { color: var(--texto-tenue); font-size: .88rem; margin: 6px 0; }
.variables-linea { font-size: .78rem; font-weight: 800; color: #8a6500; text-transform: uppercase; }
.variables-titulo { font-size: .8rem; font-weight: 800; color: var(--texto-suave); margin-top: 6px; }
.tabla-vars { font-family: var(--fuente-codigo); font-size: 14px; }
.tabla-vars th { font-family: var(--fuente); }
.tabla-vars td { padding: 4px 8px; }
.tabla-vars tr.cambio td { background: var(--resalte); transition: background .3s; }
.tabla-vars tr.nueva td { background: #E8F7EE; }
.var-nombre { font-weight: 700; }
.var-tipo { color: var(--texto-tenue); font-size: 12px; }

/* ---------- Blockly ---------- */
.blockly-div { width: 100%; height: 100%; }
.blocklyToolboxDiv, .blocklyFlyout { font-family: var(--fuente); }
.blocklyTreeLabel, .blocklyToolboxCategoryLabel { font-family: var(--fuente) !important; font-weight: 700; font-size: 14px !important; }
.blocklyTreeRow, .blocklyToolboxCategory { min-height: 34px; display: flex; align-items: center; }
.blocklyFlyoutLabelText { font-family: var(--fuente) !important; fill: var(--texto-suave) !important; font-weight: 700; }
.blocklyFlyoutButton .blocklyText { font-family: var(--fuente) !important; font-weight: 800; }
.blocklyWidgetDiv .blocklyHtmlInput { font-size: 16px !important; font-family: var(--fuente-codigo); }
.blocklyPath[fill="#ffe066" i] { stroke: #B88A00 !important; stroke-width: 2px; stroke-dasharray: 5 3; }
g:has(> .blocklyPath[fill="#ffe066" i]) > .blocklyText,
g:has(> .blocklyPath[fill="#ffe066" i]) > g > .blocklyText:not(.blocklyEditableText > .blocklyText) { fill: #5a4300 !important; }

/* ---------- Modales, avisos y menú ---------- */
.modal-fondo { position: fixed; inset: 0; z-index: 200; background: rgba(20, 22, 45, .45); display: grid; place-items: center; padding: 16px; animation: aparecer .15s ease; }
.modal {
  width: 100%; max-width: 520px; max-height: calc(100vh - 32px); overflow: auto; background: var(--superficie);
  border-radius: 18px; box-shadow: var(--sombra-alta); padding: 22px; animation: subir .18s ease;
}
.modal-titulo { margin-bottom: 12px; }
.modal-pie { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.avisos { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: calc(100% - 32px); max-width: 480px; }
.aviso { pointer-events: auto; background: var(--texto); color: #fff; padding: 10px 16px; border-radius: 12px; box-shadow: var(--sombra-alta); font-weight: 700; font-size: .93rem; transition: opacity .35s, transform .35s; text-align: center; }
.aviso-exito { background: var(--exito); }
.aviso-error { background: var(--error); }
.aviso.saliendo { opacity: 0; transform: translateY(10px); }
.menu-emergente { position: fixed; z-index: 250; min-width: 220px; background: var(--superficie); border: 1px solid var(--borde); border-radius: 12px; box-shadow: var(--sombra-alta); padding: 6px; display: flex; flex-direction: column; }
.menu-item { text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 8px; font-weight: 700; font-size: .93rem; cursor: pointer; color: var(--texto); }
.menu-item:hover { background: var(--superficie-3); }
.celebracion { text-align: center; }
.estrellas-grandes { font-size: 3.2rem; letter-spacing: 6px; color: #DDE1EB; }
.estrellas-grandes .llena { color: #F5B301; display: inline-block; animation: estrella .5s ease both; }
.estrellas-grandes .llena:nth-child(2) { animation-delay: .15s; }
.estrellas-grandes .llena:nth-child(3) { animation-delay: .3s; }
.insignia-nueva { display: flex; align-items: center; gap: 12px; justify-content: center; margin-top: 12px; padding: 10px; background: #FFF8E1; border-radius: 12px; text-align: left; }
.error-carga { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: var(--fondo); }
.error-carga .tarjeta { max-width: 520px; }
@keyframes aparecer { from { opacity: 0; } }
@keyframes subir { from { opacity: 0; transform: translateY(14px); } }
@keyframes estrella { from { transform: scale(0) rotate(-40deg); opacity: 0; } 70% { transform: scale(1.3); } }

/* ---------- Glosario ---------- */
.tabla-glosario code { font-weight: 700; }

/* ---------- Animaciones de teoría ---------- */
.animacion { background: var(--superficie-2); border: 1px solid var(--borde); border-radius: var(--radio); padding: 14px; }
.anim-controles { display: flex; gap: 6px; margin-top: 10px; }
.anim-nota { margin: 10px 0 0; font-weight: 700; color: var(--texto-suave); min-height: 1.5em; }
.anim-codigo { font-family: var(--fuente-codigo); font-size: 15px; }
.anim-codigo > div { padding: 2px 8px; border-radius: 6px; opacity: .55; }
.anim-codigo > div.actual { background: var(--resalte); opacity: 1; }
.anim-codigo > div.hecho { opacity: .85; }
.anim-codigo .codigo { margin: 0 0 8px; }
.anim-cajas { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; min-height: 96px; }
.anim-caja { width: 120px; text-align: center; }
.anim-caja .anim-valor { height: 64px; display: grid; place-items: center; background: #fff; border: 3px solid var(--amarillo); border-top-width: 10px; border-radius: 8px; font-family: var(--fuente-codigo); font-weight: 800; font-size: 1.1rem; }
.anim-caja.cambio .anim-valor { animation: rebote .5s ease; background: var(--resalte); }
.anim-etiqueta { margin-top: 4px; font-family: var(--fuente-codigo); font-weight: 800; color: #B35C00; }
@keyframes rebote { 40% { transform: scale(1.12); } }
.anim-decision { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.anim-dato { font-family: var(--fuente-codigo); font-weight: 800; background: #fff; border: 2px solid var(--borde); border-radius: 8px; padding: 4px 12px; }
.anim-rombo { font-family: var(--fuente-codigo); font-weight: 800; background: #FFF0CC; border: 2px solid var(--amarillo); padding: 8px 16px; border-radius: 10px; }
.anim-rombo.si { background: var(--exito-suave); border-color: var(--exito-claro); }
.anim-rombo.no { background: var(--error-suave); border-color: var(--error); }
.anim-ramas { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.anim-rama { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 14px; border-radius: 10px; border: 2px dashed var(--borde-fuerte); opacity: .45; font-family: var(--fuente-codigo); font-size: 14px; }
.anim-rama.activa { opacity: 1; border-style: solid; border-color: var(--exito-claro); background: var(--exito-suave); }
.anim-bucle { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.anim-flecha { font-size: 2.4rem; color: var(--amarillo); animation: girar 2s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
.anim-vueltas { display: flex; gap: 8px; }
.anim-vuelta { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: #fff; border: 2px solid var(--borde); font-family: var(--fuente-codigo); font-weight: 800; }
.anim-vuelta.hecha { background: var(--exito-suave); border-color: var(--exito-claro); }
.anim-vuelta.actual { background: var(--resalte); border-color: var(--amarillo); transform: scale(1.1); }
.anim-lista { display: flex; gap: 6px; flex-wrap: wrap; }
.anim-celda { text-align: center; }
.anim-celda .anim-valor { min-width: 96px; padding: 12px 8px; background: #fff; border: 2px solid #FF661A; border-radius: 8px; font-family: var(--fuente-codigo); font-weight: 700; }
.anim-celda.marca .anim-valor { background: #FFE7D9; transform: translateY(-4px); box-shadow: 0 6px 12px rgba(255, 102, 26, .25); }
.anim-indice { font-family: var(--fuente-codigo); font-weight: 800; color: #C2410C; margin-top: 3px; }
.anim-funcion { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.anim-entrada, .anim-salida { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 2px solid var(--borde); font-family: var(--fuente-codigo); font-weight: 800; font-size: 1.2rem; }
.anim-entrada.activa { border-color: var(--primario); }
.anim-salida.activa { border-color: var(--exito-claro); background: var(--exito-suave); animation: rebote .5s; }
.anim-maquina { padding: 12px 18px; border-radius: 12px; background: #FF6680; color: #fff; font-weight: 800; text-align: center; font-family: var(--fuente-codigo); }
.anim-maquina.trabajando { animation: rebote .6s ease infinite; }

/* =========================================================================
 * juego.css — Estilos de «Misión Python»: mapa, teoría gráfica,
 * exploradores, Kahoot, actividades y gamificación.
 * ========================================================================= */
:root {
  --kh-morado: #46178F;
  --kh-morado-osc: #2E0E66;
  --kh-rojo: #E21B3C;
  --kh-azul: #1368CE;
  --kh-amarillo: #D89E00;
  --kh-verde: #26890C;
  --oro: #F5B301;
}
body { background: radial-gradient(circle at 10% 0%, #EEF0FF 0, transparent 40%), radial-gradient(circle at 90% 10%, #FFF4E0 0, transparent 35%), var(--fondo); background-attachment: fixed; }
.chip-ok { background: var(--exito-suave); color: var(--exito); margin-left: 8px; }
.btn-grande { min-height: 52px; padding: 12px 22px; font-size: 1.08rem; border-radius: 14px; }
.rebote { animation: rebotar 2.4s ease-in-out infinite; }
@keyframes rebotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.sacudir { animation: sacudir .45s; }
@keyframes sacudir { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
button.mini, .mini { min-width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--borde-fuerte); background: #fff; font-weight: 800; cursor: pointer; color: var(--texto); font-size: .9rem; }
button.mini:hover { background: var(--superficie-3); }

/* ---------- Cabecera ---------- */
.logo-mision { font-size: 1.7rem; width: 38px; height: 38px; display: grid; place-items: center; background: linear-gradient(135deg, #9966FF, #4F46E5); border-radius: 12px; box-shadow: 0 3px 0 #3B33C4; }
.pildora-xp { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; background: #FFF6DA; border: 1px solid #F3D98A; text-decoration: none; color: #5A4300; font-weight: 800; font-size: .82rem; }
.pildora-nivel { background: var(--oro); color: #fff; border-radius: 999px; padding: 2px 8px; text-shadow: 0 1px 0 rgba(0, 0, 0, .2); }
.pildora-barra { width: 60px; height: 8px; border-radius: 999px; background: #F3E2A8; overflow: hidden; }
.pildora-relleno { display: block; height: 100%; background: linear-gradient(90deg, #F5B301, #FF8C1A); border-radius: 999px; }
.pildora-racha { padding: 5px 10px; border-radius: 999px; background: var(--superficie-3); font-weight: 800; font-size: .85rem; color: var(--texto-tenue); }
.pildora-racha.activa { background: #FFE9DC; color: #C2410C; }
.alumno-chip { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.alumno-avatar { font-size: 1.2rem; }
@media (max-width: 1100px) { .pildora-barra, .pildora-xp-n { display: none; } }
@media (max-width: 760px) { .alumno-nombre, .ocultar-chico { display: none; } .pildora-racha { display: none; } }

/* ---------- Mapa de misiones ---------- */
.mapa-perfil { display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; padding: 22px; border-radius: 22px; margin-bottom: 20px; color: #fff;
  background: linear-gradient(135deg, #2E0E66 0%, #4F46E5 55%, #7C4DFF 100%); box-shadow: 0 12px 30px rgba(46, 14, 102, .25); position: relative; overflow: hidden; }
.mapa-perfil::after { content: "✦ · ✧ · ✦"; position: absolute; right: 18px; top: 8px; opacity: .25; font-size: 1.6rem; letter-spacing: 8px; }
.mapa-avatar { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; font-size: 3.4rem; background: rgba(255, 255, 255, .16); border: 4px solid rgba(255, 255, 255, .5); text-decoration: none; transition: transform .15s; }
.mapa-avatar:hover { transform: scale(1.06) rotate(-4deg); }
.mapa-datos h1 { margin: 0 0 4px; }
.mapa-nivel { font-weight: 800; opacity: .95; margin-bottom: 6px; }
.mapa-datos .nota { color: rgba(255, 255, 255, .85); }
.xp-barra { height: 12px; border-radius: 999px; background: rgba(0, 0, 0, .15); overflow: hidden; max-width: 420px; }
.xp-barra.grande { height: 18px; max-width: none; }
.xp-barra-relleno { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #FFD84D, #FF8C1A); transition: width .8s ease; }
.tarjeta .xp-barra, .juega-progreso .xp-barra, .logro .xp-barra { background: var(--superficie-3); }
.mapa-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.mapa-chips .chip { background: rgba(255, 255, 255, .18); color: #fff; text-decoration: none; padding: 5px 12px; font-size: .85rem; }
.mapa-acciones { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.mapa-acciones .btn-primario { background: #FFD84D; color: #2E2400; box-shadow: 0 4px 0 #C9A20C; }
.btn-desafio { position: relative; background: rgba(255, 255, 255, .16); color: #fff; border: 2px solid rgba(255, 255, 255, .5); }
.btn-desafio.hecho { opacity: .8; }
.punto-aviso { position: absolute; top: -5px; right: -5px; width: 14px; height: 14px; border-radius: 50%; background: #FF3D57; box-shadow: 0 0 0 0 rgba(255, 61, 87, .6); animation: latido 1.6s infinite; }
@keyframes latido { 70% { box-shadow: 0 0 0 10px rgba(255, 61, 87, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 61, 87, 0); } }
@media (max-width: 820px) { .mapa-perfil { grid-template-columns: auto 1fr; } .mapa-acciones { grid-column: 1 / -1; } .mapa-avatar { width: 72px; height: 72px; font-size: 2.6rem; } }

.mapa-camino { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 10px 0 30px; position: relative; }
.mundo-banner { display: flex; align-items: center; gap: 14px; width: min(560px, 100%); padding: 14px 18px; border-radius: 18px; margin: 22px 0 8px; color: #fff;
  background: var(--c); box-shadow: 0 6px 0 rgba(0, 0, 0, .18), 0 10px 22px rgba(0, 0, 0, .1); }
.mundo-icono { font-size: 2.2rem; }
.mundo-num { font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; opacity: .9; }
.mundo-nombre { font-size: 1.25rem; font-weight: 800; }
.mundo-insignia { margin-left: auto; font-size: .78rem; font-weight: 800; background: rgba(255, 255, 255, .22); padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.mundo-insignia.ganada { background: #FFD84D; color: #4A3700; }
.nodo { position: relative; display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--texto); transition: transform .15s; width: 200px; }
.nodo:hover .anillo { transform: scale(1.06); }
.anillo { border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--c) calc(var(--p) * 1%), #DDE1EC 0); transition: transform .15s; box-shadow: 0 6px 0 rgba(0, 0, 0, .12); }
.anillo-interior { width: calc(100% - 14px); height: calc(100% - 14px); border-radius: 50%; background: #fff; display: grid; place-items: center; font-weight: 800; }
.nodo-icono { font-size: 2.2rem; }
.nodo:not(.empezado):not(.actual) .anillo-interior { background: #F1F3F8; filter: grayscale(.4); }
.nodo.completo .anillo-interior { background: #FFF8DC; }
.nodo-corona { position: absolute; top: -14px; font-size: 1.5rem; animation: rebotar 2s infinite; }
.nodo.actual .anillo { animation: pulso-nodo 1.6s infinite; }
@keyframes pulso-nodo { 0%, 100% { box-shadow: 0 6px 0 rgba(0, 0, 0, .12), 0 0 0 0 rgba(79, 70, 229, .5); } 50% { box-shadow: 0 6px 0 rgba(0, 0, 0, .12), 0 0 0 12px rgba(79, 70, 229, 0); } }
.nodo-aqui { position: absolute; left: calc(50% + 50px); top: 6px; background: #fff; border: 2px solid var(--primario); color: var(--primario); font-weight: 800; font-size: .8rem; border-radius: 12px; padding: 4px 10px; white-space: nowrap; display: flex; align-items: center; gap: 6px; box-shadow: var(--sombra); }
.nodo-aqui-avatar { font-size: 1.3rem; }
.nodo-etq { display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: 8px; line-height: 1.2; }
.nodo-etq small { color: var(--texto-tenue); font-weight: 800; font-size: .74rem; text-transform: uppercase; }
.nodo-etq strong { font-size: .95rem; }
@media (max-width: 560px) { .nodo { transform: none !important; } .nodo-aqui { left: auto; right: -40px; } }
.mapa-pie { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 10px 0 20px; }

/* ---------- Misión ---------- */
.mision-cabeza { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.mision-icono { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font-size: 2.2rem; background: var(--c); box-shadow: 0 5px 0 rgba(0, 0, 0, .15); flex: none; }
.mision-titulos { flex: 1; min-width: 0; }
.mision-titulos h1 { margin: 2px 0 6px; font-size: 1.55rem; }
.mision-mundo { font-weight: 800; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--texto-tenue); }
.mision-progreso { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .82rem; }
.mision-progreso .anillo-interior { font-size: .8rem; }
@media (max-width: 640px) { .mision-progreso { display: none; } .mision-icono { width: 48px; height: 48px; font-size: 1.6rem; } }
.pasos .paso { padding: 9px 14px; gap: 6px; }
.paso-icono { font-size: 1.1rem; }
.paso.visto:not(.activo) { border-color: #BDE5CA; background: #F3FBF5; }
.paso.visto:not(.activo)::after { content: "✓"; color: var(--exito); font-weight: 800; margin-left: 2px; }
.objetivos-chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }

.il-flecha-ejecutar { background: var(--exito-claro); color: #fff; width: 64px; height: 64px; border-radius: 50%; justify-content: center; font-size: 1.4rem; animation: none; box-shadow: 0 4px 0 #17803f; }

  background: linear-gradient(180deg, #8E6BFF, #6C4BE0); box-shadow: 0 5px 0 #4B33A8; position: relative; transition: transform .2s; }

os con \u003ccode\u003efloat()\u003c/code\u003e y dos fórmulas.","Para metros multiplica por 1000. Para °F usa \u003ccode\u003ec * 9 / 5 + 32\u003c/code\u003e.","Ejemplo de una línea: \u003ccode\u003emetros = km * 1000\u003c/code\u003e; luego \u003ccode\u003eprint(km, \"km son\", metros, \"metros\")\u003c/code\u003e."],"niveles":{"explorador":{"descripcion":"Las preguntas ya están. Completa las dos fórmulas.","inicio":"km = float(input(\"Distancia en kilómetros: \"))\nmetros = ___\nprint(km, \"km son\", metros, \"metros\")\nc = float(input(\"Temperatura en °C: \"))\nf = ___\nprint(c, \"°C son\", f, \"°F\")","solucion":"km = float(input(\"Distancia en kilómetros: \"))\nmetros = km * 1000\nprint(km, \"km son\", metros, \"metros\")\nc = float(input(\"Temperatura en °C: \"))\nf = c * 9 / 5 + 32\nprint(c, \"°C son\", f, \"°F\")"},"programador":{"inicio":"","solucion":"# Distancia\nkm = float(input(\"Distancia en kilómetros: \"))\nmetros = km * 1000\nprint(km, \"km son\", metros, \"metros\")\n# Temperatura\nc = float(input(\"Temperatura en °C: \"))\nf = c * 9 / 5 + 32\nprint(c, \"°C son\", f, \"°F\")"},"maestro":{"enunciado":"además, pide tu estatura en metros y muéstrala en centímetros, redondeada con \u003ccode\u003eround()\u003c/code\u003e a número entero: \u003ccode\u003e1.52 m son 152 cm\u003c/code\u003e.","inicio":"","requiere":["round"],"pruebas":[{"nombre":"Con estatura 1.52","entradas":["2.5","30","1.52"],"contiene":["2500.0","86.0","152 cm"]},{"nombre":"Con estatura 1.6","entradas":["1","100","1.6"],"contiene":["1000.0","212.0","160 cm"]}],"solucion":"km = float(input(\"Distancia en kilómetros: \"))\nmetros = km * 1000\nprint(km, \"km son\", metros, \"metros\")\nc = float(input(\"Temperatura en °C: \"))\nf = c * 9 / 5 + 32\nprint(c, \"°C son\", f, \"°F\")\nestatura = float(input(\"Estatura en metros: \"))\ncm = round(estatura * 100)\nprint(estatura, \"m son\", cm, \"cm\")"}}},"extra":{"id":"m03-extra","titulo":"Días vividos","historia":"¿Cuántos días has vivido? o \u003e secreto:\n        print(\"Más bajo\")\n    else:\n        adivinado = True\nprint(\"¡Lo lograste en\", intentos, \"intentos!\")"},"programador":{"descripcion":"Escribe el juego completo: el número secreto, el \u003ccode\u003ewhile\u003c/code\u003e, las pistas «Más alto» / «Más bajo» y el contador de intentos.","inicio":"","solucion":"import random\n\nsecreto = random.randint(1, 20)\nintentos = 0\nadivinado = False\n\nwhile not adivinado:\n    numero = int(input(\"Adivina un número del 1 al 20: \"))\n    intentos = intentos + 1\n    if numero \u003c secreto:\n        print(\"Más alto\")\n    elif numero \u003e secreto:\n        print(\"Más bajo\")\n    else:\n        adivinado = True\n\nprint(\"¡Lo lograste en\", intentos, \"intentos!\")"},"maestro":{"enunciado":"limita el juego a \u003cb\u003e5 intentos\u003c/b\u003e. Si se acaban, muestra \u003ccode\u003ePerdiste, el número era 12\u003c/code\u003e (con el número secreto). Si se adivina al primer intento, escribe «1 intento» en singular: \u003ccode\u003e¡Lo lograste en 1 intento!\u003c/code\u003e.","inicio":"","pruebas":[{"nombre":"A la primera","entradas":["7"],"azar":[7],"contiene":["Lo lograste en 1 intento"],"no_contiene":["1 intentos"]},{"nombre":"En 3 intentos","entradas":["10","5","7"],"azar":[7],"contiene":["Más bajo","Más alto","Lo lograste en 3 intentos"]},{"nombre":"Se acaban los intentos","entradas":["1","2","3","4","5"],"azar":[12],"contiene":["Más alto","Más alto","Más alto","Más alto","Más alto","Perdiste","12"],"no_contiene":["Lo lograste"]}],"solucion":"import random\n\nsecreto = random.randint(1, 20)\nintentos = 0\nadivinado = False\n\nwhile not adivinado and intentos \u003c 5:\n    numero = int(input(\"Adivina un número del 1 al 20: \"))\n    intentos = intentos + 1\n    if numero \u003c secreto:\n        print(\"Más alto\")\n    elif numero \u003e secreto:\n        print(\"Más bajo\")\n    else:\n        adivinado = True\n\nif adivinado:\n    if intentos == 1:\n        print(\"¡Lo logras \")\n    print(borde)\n\nnombre = input(\"Nombre: \")\nsaludo(nombre)\nmarco(\"Bienvenido \" + nombre)"},"maestro":{"enunciado":"agrega a \u003ccode\u003emarco\u003c/code\u003e un segundo parámetro \u003ccode\u003esimbolo\u003c/code\u003e para elegir el carácter del borde, y llama \u003ccode\u003emarco(\"Bienvenido \" + nombre, \"#\")\u003c/code\u003e.","inicio":"","pruebas":[{"nombre":"Ana con #","entradas":["Ana"],"exacto":"¡Hola, Ana!\n##################\n# Bienvenido Ana #\n##################"}],"solucion":"def saludo(nombre):\n    print(\"¡Hola, \" + nombre + \"!\")\n\ndef marco(texto, simbolo):\n    borde = simbolo * (len(texto) + 4)\n    print(borde)\n    print(simbolo + \" \" + texto + \" \" + simbolo)\n    print(borde)\n\nnombre = input(\"Nombre: \")\nsaludo(nombre)\nmarco(\"Bienvenido \" + nombre, \"#\")"}}},"extra":{"id":"m13-extra","titulo":"Rectángulos a la medida","historia":"Un taller de dibujo con símbolos.","enunciado":"Define \u003ccode\u003erectangulo(ancho, alto)\u003c/code\u003e que dibuje un rectángulo de asteriscos. Pide el ancho y el alto y llama la función. Para 4 y 2:\u003cbr\u003e\u003ccode\u003e****\u003c/code\u003e\u003cbr\u003e\u003ccode\u003e****\u003c/code\u003e","inicio":"","requiere":["def","for"],"pruebas":[{"nombre":"4 x 2","entradas":["4","2"],"exacto":"****\n****"},{"nombre":"2 x 3","entradas":["2","3"],"exacto":"**\n**\n**"}],"solucion":"def rectangulo(ancho, alto):\n    for i in range(alto):\n        print(\"*\" * ancho)\n\nancho = int(input(\"Ancho: \"))\nalto = int(input(\"Alto: \"))\nrectangulo(ancho, alto)"},"kahoot":{"preguntas":[{"pregunta":"¿Qué palabra crea una función?","opciones":["function","create","func","def"],"correcta":3,"codigoOpciones":true},{"pregunta":"¿Qué muestra este programa?","opciones":["Hola\nHola","Hola","Nada","Error"],"correcta":2,"codigo":"def saludar():\n    print(\"Hola\")","tiempo":30,"explicacion":"Solo define la función; nunca la llama."},{"pregunta":"¿Qué muestra?","opciones":["Error","¡Hol f","titulo":"return: ¿verdadero o falso?","instrucciones":"¿Verdadero o falso? ¡Contra reloj! Necesitas 70 % de aciertos.","tiempo":12,"afirmaciones":[{"texto":"\u003ccode\u003ereturn\u003c/code\u003e entrega un valor a quien llamó la función.","correcta":true},{"texto":"\u003ccode\u003eprint\u003c/code\u003e y \u003ccode\u003ereturn\u003c/code\u003e hacen exactamente lo mismo.","correcta":false,"explicacion":"print muestra; return devuelve el valor para usarlo."},{"texto":"Después de un \u003ccode\u003ereturn\u003c/code\u003e, la función termina.","correcta":true},{"texto":"Una función sin return devuelve \u003ccode\u003eNone\u003c/code\u003e.","correcta":true},{"texto":"Una función solo puede tener un parámetro.","correcta":false,"explicacion":"Puede tener varios, separados por comas."},{"texto":"El valor devuelto se puede guardar en una variable.","correcta":true}]}],"retos":[{"id":"m14-r1","titulo":"El doble","resumen":"Tu primer return.","enunciado":"Completa la función \u003ccode\u003edoble(n)\u003c/code\u003e para que \u003cb\u003edevuelva\u003c/b\u003e el doble de n. El programa debe mostrar \u003ccode\u003e14\u003c/code\u003e.","inicio":"def doble(n):\n    ___\n\nprint(doble(7))","requiere":["return"],"prohibe":[],"pruebas":[{"exacto":"14"}],"solucion":"def doble(n):\n    return n * 2\n\nprint(doble(7))","pistas":["Usa \u003ccode\u003ereturn\u003c/code\u003e, no print.","Después de return va el valor que se entrega.","La línea es \u003ccode\u003ereturn n * 2\u003c/code\u003e."]},{"id":"m14-r2","titulo":"¿Es par?","resumen":"Devolver True o False.","enunciado":"Completa \u003ccode\u003ees_par(n)\u003c/code\u003e para que devuelva \u003ccode\u003eTrue\u003c/code\u003e si n es par. El programa pide un número y muestra \u003ccode\u003ePar\u003c/code\u003e o \u003ccode\u003eImpar\u003c/code\u003e.","inicio":"def es_par(n):\n    return ___\n\nnumero = int(input(\"Número: \"))\nif es_par(numero):\n    print(\"Par\")\nelse:\n    print(\"Impar\")","requiere":["retur ro":{"enunciado":"guarda las preguntas en una lista y las respuestas en otra, y recórrelas con un \u003ccode\u003efor\u003c/code\u003e para no repetir la llamada a \u003ccode\u003epreguntar\u003c/code\u003e. El total (3) también debe salir de \u003ccode\u003elen()\u003c/code\u003e.","inicio":"","requiere":["lista*2","for","len"],"solucion":"def preguntar(pregunta, correcta):\n    r = input(pregunta).lower()\n    if r == correcta:\n        print(\"Correcto\")\n        return 1\n    print(\"Incorrecto\")\n    return 0\n\ndef mensaje_final(puntaje):\n    if puntaje == 3:\n        return \"¡Excelente!\"\n    elif puntaje == 2:\n        return \"Bien\"\n    return \"Sigue practicando\"\n\npreguntas = [\"¿Cuántas patas tiene una araña? \", \"¿De qué color es el cielo despejado? \", \"¿Cuánto es 9 x 7? \"]\nrespuestas = [\"8\", \"azul\", \"63\"]\npuntaje = 0\nfor i in range(len(preguntas)):\n    puntaje += preguntar(preguntas[i], respuestas[i])\nprint(\"Puntaje:\", puntaje, \"de\", len(preguntas))\nprint(mensaje_final(puntaje))"}}},"extra":{"id":"m14-extra","titulo":"Calculadora con funciones","historia":"Una calculadora donde cada operación es una función.","enunciado":"Escribe las funciones \u003ccode\u003esumar(a, b)\u003c/code\u003e, \u003ccode\u003erestar(a, b)\u003c/code\u003e, \u003ccode\u003emultiplicar(a, b)\u003c/code\u003e y \u003ccode\u003edividir(a, b)\u003c/code\u003e, cada una con \u003ccode\u003ereturn\u003c/code\u003e. Pide dos números y una operación (\u003ccode\u003e+ - * /\u003c/code\u003e) y muestra \u003ccode\u003eResultado: 12\u003c/code\u003e. Si dividen entre cero, muestra \u003ccode\u003eNo se puede dividir entre cero\u003c/code\u003e.","inicio":"","requiere":["def*4","return*4","elif"],"pruebas":[{"nombre":"8 + 4","entradas":["8","4","+"],"contiene":["Resultado: 12"]},{"nombre":"8 * 4","entradas":["8","4","*"],"contiene":["Resultado: 32"]},{"nombre":"9 / 3","entradas":["9","3","/"],"contiene":["Resultado: 3.0"]},{"nombre":"5 / 0","entradas":["5","0","/"],"contiene":["No se puede dividir entre cero"]}],"solucion":"def sumar(a, b):\n    return a + b\n\ndef restar(a, b):\n    return a - b\n\ndef multiplicar(a, b):\n    return a * b\n\ndef dividir(a, b):\n    return a / b\n\nx = int(input(\"Primer número: \"))\ny = int(input(\"Segundo número: \"))\nop = input(\"Operación (+ - * /): \")\nif op == \"+\":\n    print(\"Resultado:\", sumar(x, y))\nelif op == \"-\":\n    print(\"Resultado:\", restar(x, y))\nelif op == \"*\":\n    print(\"Resultado:\", multiplicar(x, y))\nelif op == \"/\":\n    if y == 0:\n        print(\"No se puede dividir entre cero\")\n    else:\n        print(\"Resultado:\", dividir(x, y))\nelse:\n    print(\"Operación desconocida\")"},"kahoot":{"preguntas":[{"pregunta":"¿Qué hace \u003ccode\u003ereturn\u003c/code\u003e?","opciones":["Devuelve un valor a quien llamó la función","Repite la función","Borra la función","Muestra un valor en la pantalla"],"correcta":0},{"pregunta":"¿Qué muestra?","opciones":["8","4","None","doble(4)"],"correcta":0,"codigo":"def doble(n):\n    return n * 2\n\nprint(doble(4))","tiempo":30,"salidaEsRespuesta":true},{"pregunta":"¿Qué muestra?","opciones":["6","9","7","Error"],"correcta":2,"codigo":"def triple(x):\n    return x * 3\n\nprint(triple(2) + 1)","tiempo":30,"salidaEsRespuesta":true},{"pregunta":"¿Qué devuelve una función que no tiene return?","opciones":["Un error","None","False","0"],"correcta":1},{"pregunta":"¿Qué muestra?","opciones":["6","True","Par","False"],"correcta":1,"codigo":"def es_par(n):\n    return n % 2 == 0\n\nprint(es_par(6))","tiempo":30,"salidaEsRespuesta":true},{"tipo":"vf","pregunta":"Después de ejecutar un return, la función sigue con las líneas de abajo.","opciones":["Verdadero","Falso"],"correcta":1,"tiempo":15,"explicacion":"return termina la función de inmediato."},{"pregunta":"¿Qué muestra?","opciones":["10","7","Error","3"],"correcta":0,"codigo":"def suma(a, b):\n    return a + b\n\nprint(suma(3, 4) + suma(1, 2))","tiempo":30,"salidaE s:\n        jugada = input(\"No válida. Piedra, papel o tijera: \").lower()\n    return jugada\n\ndef ganador_ronda(tu, compu):\n    if tu == compu:\n        return \"empate\"\n    elif (tu == \"piedra\" and compu == \"tijera\") or (tu == \"papel\" and compu == \"piedra\") or (tu == \"tijera\" and compu == \"papel\"):\n        return \"tu\"\n    else:\n        return \"compu\"\n\npuntos_tu = 0\npuntos_compu = 0\nwhile puntos_tu \u003c 3 and puntos_compu \u003c 3:\n    tu = pedir_jugada()\n    compu = random.choice(opciones)\n    print(\"La computadora eligió\", compu)\n    resultado = ganador_ronda(tu, compu)\n    if resultado == \"tu\":\n        puntos_tu += 1\n        print(\"¡Ganas la ronda!\")\n    elif resultado == \"compu\":\n        puntos_compu += 1\n        print(\"La computadora gana la ronda\")\n    else:\n        print(\"Empate\")\n    print(\"Marcador:\", puntos_tu, \"-\", puntos_compu)\nif puntos_tu == 3:\n    print(\"¡Ganaste el juego!\")\nelse:\n    print(\"Ganó la computadora\")","entradasPrueba":["piedra","lagarto","papel","tijera","piedra"],"azarPrueba":["tijera","piedra","papel","tijera"]},{"id":"aventura","icono":"🗺️","titulo":"Aventura de texto","resumen":"Una historia con decisiones y varios finales.","descripcion":"Una historia en la que quien juega decide qué hacer y llega a distintos finales. Usa una lista para el inventario (objetos que encuentra) y funciones para cada escena. Ideas extra: puntos de vida, objetos que abren caminos nuevos.","inicio":"inventario = []\n\n# Cada escena puede ser una función\ndef escena_bosque():\n    print(\"Estás en un bosque oscuro. Hay un camino a la izquierda y otro a la derecha.\")\n    eleccion = input(\"¿izquierda o derecha? \").lower()\n    # Usa if / elif / else para decidir qué pasa\n\ndef escena_cueva():\n    pass\n\n# Programa principal\nprint(\"=== La aventura comienza ===\")\nescena_bosque()\n","solucion":"inventario = []\n\ndef pedir(opciones):\n    eleccion = input(\"Elige (\" + \" / \".join(opciones) + \"): \").lower()\n    while eleccion not in opciones:\n        eleccion = input(\"Esa opción no existe. Elige otra vez: \").lower()\n    return eleccion\n\ndef escena_cueva():\n    print(\"Entras a una cueva. Brilla algo en el fondo.\")\n    eleccion = pedir([\"tomar\", \"salir\"])\n    if eleccion == \"tomar\":\n        inventario.append(\"llave dorada\")\n        print(\"¡Encontraste una llave dorada!\")\n    else:\n        print(\"Sales de la cueva con cuidado.\")\n\ndef escena_puerta():\n    print(\"Llegas a una puerta enorme.\")\n    if \"llave dorada\" in inventario:\n        print(\"Usas la llave dorada. ¡Encontraste el tesoro! FINAL FELIZ\")\n    else:\n        print(\"La puerta está cerrada. Regresas a casa. FINAL ABIERTO\")\n\nprint(\"=== La aventura comienza ===\")\nprint(\"Estás en un bosque. Hay un camino a la izquierda y otro a la derecha.\")\ncamino = pedir([\"izquierda\", \"derecha\", \"quedarme\"])\nif camino == \"izquierda\":\n    escena_cueva()\n    escena_puerta()\nelif camino == \"derecha\":\n    escena_puerta()\nelse:\n    print(\"Te quedas a dormir bajo un árbol. FINAL TRANQUILO\")\nprint(\"Inventario final:\", inventario)","entradasPrueba":["izquierda","tomar"]},{"id":"quiz","icono":"❓","titulo":"Quiz temático","resumen":"Banco de preguntas en listas.","descripcion":"Un quiz sobre el tema que elijas, con las preguntas y respuestas guardadas en \u003cb\u003elistas\u003c/b\u003e y recorridas con un bucle. Ideas extra: preguntas en orden aleatorio, varias oportunidades por pregunta, récord de puntaje.","inicio":"preguntas = [\"¿Pregunta 1? \", \"¿Pregunta 2? \", \"¿Pregunta 3? \"]\nrespuestas = [\"r1\", \"r2\", \"r3\"]\n\n# Función que hace una pregunta y devuelve 1 si acierta o 0 si no\ndef preguntar(pregunta, correcta):\n    pass\n\n# Función que devuelve un mensaje según el puntaje\ndef mensaje_final(puntaje, total):\n    pass\n\n# Programa principal: recorre las preguntas con un for\npuntaje = 0\n","solucion":"preguntas = [\"¿Cuál es el planeta más grande? \", \"¿Cuántos continentes hay? \", \"¿Qué animal es el más grande del mundo? \", \"¿Cuál es el océano más grande? \"]\nrespuestas = [\"jupiter\", \"5\", \"ballena azul\", \"pacifico\"]\n\ndef preguntar(pregunta, correcta):\n    r = input(pregunta).lower()\n    if r == correcta:\n        print(\"¡Correcto!\")\n        return 1\n    print(\"Incorrecto. La respuesta era\", correcta)\n    return 0\n\ndef mensaje_final(puntaje, total):\n    if puntaje == total:\n        return \"¡Perfecto!\"\n    elif puntaje \u003e= total / 2:\n        return \"¡Bien hecho!\"\n    else:\n        return \"¡A estudiar un poco más!\"\n\npuntaje = 0\nfor i in range(len(preguntas)):\n    puntaje += preguntar(preguntas[i], respuestas[i])\nprint(\"Puntaje:\", puntaje, \"de\", len(preguntas))\nprint(mensaje_final(puntaje, len(preguntas)))","entradasPrueba":["jupiter","7","ballena azul","pacifico"]},{"id":"mascota","icono":"🐶","titulo":"Mascota virtual","resumen":"Una mascota que come, juega y duerme.","descripcion":"Una mascota con niveles de hambre, energía y felicidad. Un menú permite darle de comer, jugar o dormir, y cada acción cambia sus niveles. Ideas extra: la mascota se enferma si el hambre llega a 10, una lista de juguetes favoritos.","inicio":"nombre = input(\"¿Cómo se llama tu mascota? \")\nhambre = 5\nenergia = 5\nfelicidad = 5\njuguetes = [\"pelota\", \"cuerda\", \"hueso\"]\n\n# Función que muestra cómo está la mascota\ndef mostrar_estado():\n    pass\n\n# Funciones para cada acción: comer, jugar, dormir\n\n# Programa principal: un menú que se repite hasta que elijan salir\n","solucion":"import random\n\nnombre = input(\"¿Cómo se llama tu mascota? \")\nhambre = 5\nenergia = 5\nfelicidad = 5\njuguetes = [\"pelota\", \"cuerda\", \"hueso\"]\n\ndef mostrar_estado():\n    print(nombre, \"→ hambre:\", hambre, \"energía:\", energia, \"felicidad:\", felicidad)\n\ndef limitar(valor):\n    if valor \u003c 0:\n        return 0\n    elif valor \u003e 10:\n        return 10\n    return valor\n\nseguir = True\nwhile seguir:\n    mostrar_estado()\n    opcion = input(\"¿Qué hacemos? (comer / jugar / dormir / salir) \").lower()\n    if opcion == \"comer\":\n        hambre = limitar(hambre - 3)\n        print(nombre, \"comió muy rico.\")\n    elif opcion == \"jugar\":\n        juguete = random.choice(juguetes)\n        felicidad = limitar(felicidad + 2)\n        energia = limitar(energia - 2)\n        hambre = limitar(hambre + 1)\n        print(nombre, \"jugó con la\", juguete)\n    elif opcion == \"dormir\":\n        energia = 10\n        print(nombre, \"durmió una siesta.\")\n    elif opcion == \"salir\":\n        seguir = False\n    else:\n        print(\"No entendí esa opción.\")\nprint(\"¡Adiós,\", nombre + \"!\")","entradasPrueba":["Firulais","comer","jugar","volar","dormir","salir"],"azarPrueba":["pelota"]}]},"kahoot":{"titulo":"Kahoot de repaso general","aleatorio":10},"resumen":[{"icono":"💡","texto":"Un proyecto se planea: idea, pasos y funciones."},{"icono":"🧪","texto":"Programa poco a poco y prueba cada parte."},{"icono":"✅","texto":"Requisitos: input, elif, un bucle, una lista y dos funciones."}],"glosario":[{"en":"pseudocode","es":"pseudocódigo","def":"Los pasos de un programa escritos en español, antes de programarlos."},{"en":"debug","es":"depurar","def":"Encontrar y corregir errores."},{"en":"test","es":"probar","def":"Ejecutar el programa con distintos datos para ver si funciona."},{"en":"menu","es":"menú","def":"Lista de opciones para que el usuario elija."}],"plan":{"activacion":"Muestra 2 o 3 proyectos de ejemplo (los esqueletos de las opciones) y pide que cada quien elija el suyo.","ejemplo":"Planea en vivo un proyecto con comentarios: título, pedir nombre, rondas, resultado.","practica":"Actividades rápidas: ¿qué requisito es? y buenas prácticas.","reto":"Programación del proyecto (puede abarcar más de una sesión). Revisa avances con «Revisar requisitos».","cierre":"Cada quien escribe qué le falta para terminar. 'use strict';

const PB = window.PB = window.PB || {};

PB.util = (() => {
  /** Crea un elemento: el('div', {class: 'x', onclick: fn}, hijo1, 'texto', ...) */
  function el(tag, attrs, ...hijos) {
    const e = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') e.className = v;
        else if (k === 'html') e.innerHTML = v;
        else if (k === 'text') e.textContent = v;
        else if (k === 'style' && typeof v === 'object') {
          // Las variables CSS (--c, --p…) solo se pueden fijar con setProperty
          for (const [p, x] of Object.entries(v)) {
            if (x === null || x === undefined) continue;
            if (p.startsWith('--')) e.style.setProperty(p, String(x));
            else e.style[p] = x;
          }
        }
        else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
        else if (k === 'dataset') Object.assign(e.dataset, v);
        else if (v === true) e.setAttribute(k, '');
        else e.setAttribute(k, v);
      }
    }
    agregar(e, hijos);
    return e;
  }

  function agregar(padre, hijos) {
    for (const h of hijos.flat(Infinity)) {
      if (h === null || h === undefined || h === false) continue;
      padre.appendChild(h instanceof Node ? h : document.createTextNode(String(h)));
    }
    return padre;
  }

  function vaciar(e) { while (e.firstChild) e.removeChild(e.firstChild); return e; }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /** Quita acentos, pasa a minúsculas y compacta espacios: para comparar salidas. */
  function normalizar(s) {
    return String(s ?? '')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[¡¿]/g, '')
      .toLowerCase()
      .replace(/[ \t]+/g, ' ')
      .split('\n').map(l => l.trim()).join('\n')
      .replace(/\n{2,}/g, '\n')
      .trim();
  }

  function debounce(fn, ms) {
    let t = null;
    return function (...args) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), ms);
    };
  }

  function fechaCorta(iso) {
    if (!iso) return '';
    try {
      // «2026-10-01» sin hora se interpretaría en UTC (y saldría un día antes en México)
      const f = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? new Date(iso + 'T12:00:00') : new Date(iso);
      return f.toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' });
    } catch (e) { return iso.slice(0, 10); }
  }

  function hoyISO() { return new Date().toISOString(); }

  function clonar(o) { return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }

  /** Distancia de edición, para sugerir nombres parecidos en NameError. */
  function distancia(a, b) {
    const m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[n];
  }

  function slug(s) {
    return normalizar(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'alumno';
  }

  return { el, agregar, vaciar, esc, normalizar, debounce, fechaCorta, hoyISO, clonar, distancia, slug };
})();

/* ---------- Almacenamiento: localStorage con respaldo en memoria ----------
 * Dentro del iframe de Google Sites, Safari puede bloquear o borrar el
 * almacenamiento. Nunca dejamos que eso rompa la plataforma.            */
PB.almacen = (() => {
  const memoria = {};
  let disponible = false;
  try {
    const k = '__pb_prueba__';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    disponible = true;
  } catch (e) { disponible = false; }

  function leer(clave, porDefecto) {
    try {
      const v = disponible ? window.localStorage.getItem(clave) : memoria[clave];
      if (v === null || v === undefined) return porDefecto;
      return JSON.parse(v);
    } catch (e) { return porDefecto; }
  }

  function escribir(clave, valor) {
    const txt = JSON.stringify(valor);
    memoria[clave] = txt;
    if (!disponible) return false;
    try { window.localStorage.setItem(clave, txt); return true; } catch (e) { return false; }
  }

  function borrar(clave) {
    delete memoria[clave];
    try { if (disponible) window.localStorage.removeItem(clave); } catch (e) { /* nada */ }
  }

  function leerSesion(clave) {
    try { return window.sessionStorage.getItem(clave); } catch (e) { return memoria['s:' + clave] ?? null; }
  }
  function escribirSesion(clave, v) {
    memoria['s:' + clave] = v;
    try { window.sessionStorage.setItem(clave, v); } catch (e) { /* nada */ }
  }

  return { leer, escribir, borrar, leerSesion, escribirSesion, get disponible() { return disponible; } };
})();

/* ---------- Ventanas modales, avisos y diálogos propios ----------
 * window.prompt/alert pueden estar bloqueados en el iframe de Google Sites,
 * por eso usamos diálogos dentro de la página.                         */
PB.ui = (() => {
  const { el } = PB.util;
  let pila = [];

  function modal({ titulo, contenido, botones = [{ texto: 'Cerrar', tipo: 'primario' }], ancho, alCerrar, clase }) {
    return new Promise(resolve => {
      const fondo = el('div', { class: 'modal-fondo' });
      const caja = el('div', { class: 'modal' + (clase ? ' ' + clase : ''), role: 'dialog', 'aria-modal': 'true' });
      if (ancho) caja.style.maxWidth = ancho;
      const cerrar = (valor) => {
        fondo.remove();
        pila = pila.filter(p => p !== fondo);
        document.removeEventListener('keydown', teclas);
        if (alCerrar) alCerrar(valor);
        resolve(valor);
      };
      const teclas = (ev) => {
        if (pila[pila.length - 1] !== fondo) return;
        if (ev.key === 'Escape') cerrar(null);
      };
      if (titulo) caja.appendChild(el('h2', { class: 'modal-titulo' }, titulo));
      const cuerpo = el('div', { class: 'modal-cuerpo' });
      if (typeof contenido === 'function') contenido(cuerpo, cerrar);
      else if (contenido instanceof Node) cuerpo.appendChild(contenido);
      else if (contenido) cuerpo.innerHTML = contenido;
      caja.appendChild(cuerpo);
      if (botones && botones.length) {
        const pie = el('div', { class: 'modal-pie' });
        for (const b of botones) {
          pie.appendChild(el('button', {
            class: 'btn ' + (b.tipo === 'primario' ? 'btn-primario' : b.tipo === 'peligro' ? 'btn-peligro' : 'btn-secundario'),
            onclick: () => {
              if (b.accion) {
                const r = b.accion(cuerpo);
                if (r === false) return;
                cerrar(r === undefined ? (b.valor ?? b.texto) : r);
              } else cerrar(b.valor ?? b.texto);
            }
          }, b.texto));
        }
        caja.appendChild(pie);
      }
      fondo.appendChild(caja);
      fondo.addEventListener('mousedown', ev => { if (ev.target === fondo) cerrar(null); });
      document.body.appendChild(fondo);
      pila.push(fondo);
      document.addEventListener('keydown', teclas);
      const foco = caja.querySelector('input, textarea, select') || caja.querySelector('.modal-pie .btn-primario');
      if (foco) setTimeout(() => foco.focus(), 30);
    });
  }

  function alerta(mensaje, titulo) {
    return modal({ titulo: titulo || 'Aviso', contenido: el('p', {}, mensaje), botones: [{ texto: 'Entendido', tipo: 'primario' }] });
  }

  function confirmar(mensaje, titulo, textoSi = 'Sí', textoNo = 'Cancelar', peligro = false) {
    return modal({
      titulo: titulo || 'Confirmar',
      contenido: el('p', {}, mensaje),
      botones: [{ texto: textoNo, valor: false }, { texto: textoSi, valor: true, tipo: peligro ? 'peligro' : 'primario' }]
    }).then(v => v === true);
  }

  /** Pide un texto. validar(texto) devuelve un mensaje de error o null. */
  function pedirTexto(mensaje, porDefecto = '', { titulo, validar, placeholder } = {}) {
    let entrada, error;
    return modal({
      titulo: titulo || 'Escribe',
      contenido: (c) => {
        c.appendChild(el('label', { class: 'campo-etiqueta' }, mensaje));
        entrada = el('input', {
          type: 'text', class: 'campo', value: porDefecto, placeholder: placeholder || '',
          autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', autocomplete: 'off'
        });
        error = el('p', { class: 'campo-error' });
        entrada.addEventListener('keydown', ev => {
          if (ev.key === 'Enter') { ev.preventDefault(); c.parentNode.querySelector('.modal-pie .btn-primario').click(); }
        });
        c.appendChild(entrada);
        c.appendChild(error);
      },
      botones: [
        { texto: 'Cancelar', valor: null },
        {
          texto: 'Aceptar', tipo: 'primario', accion: () => {
            const v = PB.util.quitarComillasTipograficas(entrada.value.trim());
            const msg = validar ? validar(v) : null;
            if (msg) { error.textContent = msg; entrada.focus(); return false; }
            return v;
          }
        }
      ]
    });
  }

  let contAvisos = null;
  function aviso(mensaje, tipo = 'info', ms = 3200) {
    if (!contAvisos) {
      contAvisos = el('div', { class: 'avisos', 'aria-live': 'polite' });
      document.body.appendChild(contAvisos);
    }
    const t = el('div', { class: 'aviso aviso-' + tipo }, mensaje);
    contAvisos.appendChild(t);
    setTimeout(() => t.classList.add('saliendo'), ms);
    setTimeout(() => t.remove(), ms + 400);
  }

  return { modal, alerta, confirmar, pedirTexto, aviso };
})();

/* Las teclas del iPad pueden escribir comillas “tipográficas”: las cambiamos
 * por comillas rectas, que son las que entiende Python. */
PB.util.quitarComillasTipograficas = (s) =>
  String(s).replace(/[“”„‟″«»]/g, '"').replace(/[‘’‚‛′]/g, "'");

/* ---------- Descargar y copiar, con alternativas ----------
 * El iframe de Google Sites puede bloquear descargas o el portapapeles;
 * en ese caso mostramos el texto para copiarlo a mano. */
PB.archivos = (() => {
  const { el } = PB.util;

  function mostrarParaCopiar(texto, titulo, nota) {
    return PB.ui.modal({
      titulo: titulo || 'Copia este texto',
      ancho: '720px',
      contenido: (c) => {
        if (nota) c.appendChild(el('p', { class: 'nota' }, nota));
        const ta = el('textarea', { class: 'campo campo-codigo', rows: '14', readonly: true, spellcheck: 'false' });
        ta.value = texto;
        c.appendChild(ta);
        setTimeout(() => { ta.focus(); ta.select(); }, 60);
      },
      botones: [{ texto: 'Cerrar', tipo: 'primario' }]
    });
  }

  function descargar(nombre, contenido, tipo = 'text/plain') {
    try {
      const blob = new Blob([contenido], { type: tipo + ';charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = el('a', { href: url, download: nombre, style: { display: 'none' } });
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
      PB.ui.aviso('Descarga iniciada: ' + nombre, 'exito');
      // Si el navegador bloqueó la descarga no hay forma de saberlo con certeza:
      // ofrecemos siempre la opción de ver el texto.
      return true;
    } catch (e) {
      mostrarParaCopiar(contenido, nombre, 'Tu navegador no permitió descargar el archivo. Copia el texto y guárdalo con el nombre «' + nombre + '».');
      return false;
    }
  }

  async function copiar(texto, titulo) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(texto);
        PB.ui.aviso('Copiado al portapapeles', 'exito');
        return true;
      }
    } catch (e) { /* probamos el método antiguo */ }
    try {
      const ta = el('textarea', { style: { position: 'fixed', left: '-9999px', top: '0' } });
      ta.value = texto;
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      if (ok) { PB.ui.aviso('Copiado al portapapeles', 'exito'); return true; }
    } catch (e) { /* mostramos el texto */ }
    mostrarParaCopiar(texto, titulo || 'Copia este texto', 'No se pudo copiar automáticamente. Selecciona el texto y cópialo.');
    return false;
  }

  function leerArchivo(aceptar = '.json,application/json,text/plain', multiple = false) {
    return new Promise(resolve => {
      const inp = el('input', { type: 'file', accept: aceptar, style: { display: 'none' } });
      if (multiple) inp.multiple = true;
      inp.addEventListener('change', async () => {
        const archivos = Array.from(inp.files || []);
        const textos = [];
        for (const f of archivos) {
          textos.push({ nombre: f.name, texto: await f.text() });
        }
        inp.remove();
        resolve(multiple ? textos : (textos[0] || null));
      });
      document.body.appendChild(inp);
      inp.click();
    });
  }

  return { descargar, copiar, mostrarParaCopiar, leerArchivo };
})();
