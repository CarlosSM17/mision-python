/* =========================================================================
 * 42-verificador.js — Revisa un programa contra los casos de prueba y las
 * restricciones del reto, y explica qué falló (no solo «incorrecto»).
 *
 * Restricciones (requiere / prohibe), por ejemplo:
 *   "while"        usa while al menos una vez
 *   "def*2"        al menos dos funciones
 *   "print<=2"     a lo más dos print
 *   "for|while"    al menos uno de los dos
 * Casos de prueba:
 *   { entradas: ["10","5"], azar: [7], contiene: ["Más bajo", "2 intentos"],
 *     no_contiene: [...], exacto: "...", nombre: "..." }
 * La comparación ignora mayúsculas, acentos, ¡ ¿ y espacios repetidos.
 * ========================================================================= */
'use strict';

PB.verificador = (() => {
  const { normalizar } = PB.util;

  const DESCRIPCIONES = {
    print: 'mostrar algo con print()', input: 'pedir datos con input()', int: 'convertir con int()', float: 'convertir con float()',
    str: 'convertir a texto con str()', len: 'usar len()', range: 'usar range()', max: 'usar max()', min: 'usar min()', sum: 'usar sum()',
    round: 'usar round()', if: 'tomar una decisión con if', elif: 'usar elif', else: 'usar else', for: 'usar un bucle for',
    while: 'usar un bucle while', def: 'definir una función con def', return: 'devolver un valor con return', break: 'usar break',
    continue: 'usar continue', and: 'usar and', or: 'usar or', not: 'usar not', in: 'usar in', lista: 'usar una lista [ ]',
    append: 'agregar a una lista con .append()', remove: 'usar .remove()', upper: 'usar .upper()', lower: 'usar .lower()',
    title: 'usar .title()', fstring: 'usar una f-string: f"… {variable} …"', comentario: 'escribir al menos un comentario con #',
    randint: 'usar random.randint()', choice: 'usar random.choice()', 'import random': 'traer el módulo con import random',
    '+=': 'usar +=', '=': 'guardar valores en variables con =', '%': 'usar % (residuo)', '//': 'usar // (división entera)',
    '+': 'usar +', '*': 'usar *', '==': 'comparar con ==', variable: 'guardar valores en variables', '[]': 'usar corchetes [ ]',
    indice: 'usar posiciones de una lista: lista[0]',
    acumula: 'sumar a una variable (contador o acumulador): puntos = puntos + 1'
  };

  const LLAMADAS = new Set(['print', 'input', 'int', 'float', 'str', 'len', 'range', 'max', 'min', 'sum', 'round', 'sorted', 'abs', 'bool', 'type']);
  const METODOS = new Set(['append', 'remove', 'upper', 'lower', 'title', 'capitalize', 'strip', 'randint', 'choice', 'insert', 'pop', 'sort', 'count', 'replace', 'index', 'split', 'join', 'isdigit']);

  function contarClave(clave, c) {
    if (clave === 'acumula') return c.acumula || 0;
    if (clave === 'lista') return c.listas;
    if (clave === 'fstring') return c.fstrings;
    if (clave === 'comentario') return c.comentarios;
    if (clave === 'variable') return c.operadores['='] || 0;
    if (clave === 'indice') return (c.operadores['['] || 0) - c.listas;
    if (clave === 'import random') return (c.claves.import && c.nombres.random) ? 1 : 0;
    if (PB.py.PALABRAS_CLAVE.has(clave)) return c.claves[clave] || 0;
    if (LLAMADAS.has(clave)) return c.llamadas[clave] || 0;
    if (METODOS.has(clave)) return c.metodos[clave] || 0;
    if (/^[^\w\s]+$/.test(clave)) return c.operadores[clave] || 0;
    return (c.llamadas[clave] || 0) + (c.nombres[clave] || 0);
  }

  function describir(clave) { return DESCRIPCIONES[clave] || `usar «${clave}»`; }

  // Frases para «al menos N veces» que suenan naturales
  const DESCRIPCIONES_N = {
    def: n => `definir al menos ${n} funciones con def`,
    return: n => `usar return en al menos ${n} lugares`,
    lista: n => `usar al menos ${n} listas`,
    input: n => `pedir al menos ${n} datos con input()`,
    print: n => `usar print al menos ${n} veces`,
    if: n => `usar if al menos ${n} veces`,
    for: n => `usar al menos ${n} bucles for`,
    while: n => `usar al menos ${n} bucles while`,
    append: n => `agregar a la lista con .append() al menos ${n} veces`,
    acumula: n => `sumar puntos con un contador al menos ${n} veces (puntos = puntos + 1)`,
    variable: n => `usar al menos ${n} variables`
  };
  const ALTERNATIVAS = { 'for|while': 'usar un bucle (for o while)', 'fstring|+': 'unir textos con + o con una f-string' };

  /** Evalúa una lista de restricciones. Devuelve [{texto, ok}]. */
  function revisarRestricciones(codigo, requiere = [], prohibe = []) {
    const c = PB.py.contar(codigo);
    const r = [];
    for (const regla of requiere) {
      let m;
      if ((m = /^(.+?)\*(\d+)$/.exec(regla))) {
        const n = contarClave(m[1], c), min = +m[2];
        const texto = DESCRIPCIONES_N[m[1]] ? DESCRIPCIONES_N[m[1]](min) : `${describir(m[1])} (al menos ${min} veces)`;

      r.push({ texto: `no ${describir(regla)}`, ok: contarClave(regla, c) === 0, clave: '!' + regla });
    }
    return r;

  function compararSalida(salida, prueba) {
    const obtenida = normalizar(salida);
    const fallos = [];
    if (prueba.exacto !== undefined && prueba.exacto !== null) {
      if (obtenida !== normalizar(prueba.exacto)) fallos.push({ tipo: 'exacto', esperado: prueba.exacto });
    }
    if (prueba.contiene) {
      let desde = 0;
      for (const fragmento of prueba.contiene) {
        const f = normalizar(fragmento);
        const pos = obtenida.indexOf(f, desde);
        if (pos < 0) {
          const enOtroLugar = obtenida.indexOf(f) >= 0;
          fallos.push({ tipo: enOtroLugar ? 'orden' : 'falta', esperado: fragmento });
          break;
        }
        desde = pos + f.length;
      }
    }
    for (const fragmento of prueba.no_contiene || []) {
      if (obtenida.includes(normalizar(fragmento))) fallos.push({ tipo: 'sobra', esperado: fragmento });
    }
    if (prueba.lineasMin) {
      const n = obtenida ? obtenida.split('\n').filter(l => l.trim()).length : 0;
      if (n < prueba.lineasMin) fallos.push({ tipo: 'lineas', esperado: prueba.lineasMin, obtenido: n });
    }
    return fallos;
  }

  function mensajeFallo(f) {
    if (f.tipo === 'exacto') return `La salida debía ser exactamente:\n${f.esperado}`;
    if (f.tipo === 'orden') return `Aparece «${f.esperado}», pero no en el orden esperado.`;
    if (f.tipo === 'falta') return `Se esperaba ver «${f.esperado}» en la salida, y no apareció.`;
    if (f.tipo === 'sobra') return `No debería aparecer «${f.esperado}».`;
    if (f.tipo === 'lineas') return `Tu programa debe mostrar al menos ${f.esperado} renglones, y mostró ${f.obtenido}.`;
    return 'La salida no es la esperada.';
  }

  function describirEntradas(prueba) {
    const partes = [];
    if (prueba.entradas && prueba.entradas.length) partes.push('escribiendo ' + prueba.entradas.map(e => '«' + e + '»').join(', '));
    if (prueba.azar && prueba.azar.length) partes.push((prueba.azar.length === 1 ? 'con el valor al azar ' : 'con los valores al azar ') + prueba.azar.join(', '));

  function configuracion(reto, nivel) {

      prohibe: [...(reto.prohibe || []), ...(n.prohibe || [])],

  }

  /**
   * Verifica un programa. Devuelve:
   * { ok, sintaxis, huecos, restricciones:[{texto,ok}], pruebas:[{nombre, ok, detalle, entradas, salida, error}] }

    const r = { ok: false, sintaxis: null, huecos: 0, restricciones: [], pruebas: [], vacio: false };

    if (!codigo.trim()) { r.vacio = true; return r; }

    const diag = PB.py.revisarSintaxis(codigo);
    if (diag) {
      r.sintaxis = PB.errores.explicar({ tipo: diag.tipo, mensaje: diag.mensaje, linea: diag.linea, original: diag.tipo }, codigo);

    const conteo = PB.py.contar(codigo);
    r.huecos = conteo.nombres.___ || 0;
    r.restricciones = revisarRestricciones(codigo, cfg.requiere, cfg.prohibe);

    let i = 0;
    for (const prueba of cfg.pruebas) {
      i++;
      if (alProgreso) alProgreso(i, cfg.pruebas.length);
      const res = await PB.ejecutor.ejecutar(codigo, { entradas: prueba.entradas || [], azar: prueba.azar || [], limiteMs: prueba.limiteMs || 4000 });

      if (res.error) {
        if (res.error.tipo === 'SinInterprete' || res.error.tipo === 'Ocupado') {
          item.error = PB.errores.explicar(res.error, codigo);
          item.detalle = item.error.texto;
          r.pruebas.push(item);
          break;
        }
        item.error = PB.errores.explicar(res.error, codigo);
        item.detalle = item.error.texto;

  }

/* =========================================================================
 * 50-progreso.js — Progreso del alumno guardado en el dispositivo.

'use strict';

PB.progreso = (() => {
  const VERSION = 1;
  const NIVELES = ['explorador', 'programador', 'maestro'];
  const ESTRELLAS = { explorador: 1, programador: 2, maestro: 3 };
  let clave = 'pb:progreso';
  let datos = null;
  let alCambiar = [];

  function vacio() {
    return {
      version: VERSION, curso: PB.config.idCurso, alumno: { nombre: '', grupo: '' },
      creado: PB.util.hoyISO(), actualizado: PB.util.hoyISO(),
      retos: {}, borradores: {}, respuestas: {}, pruebas: {}, coevaluaciones: [], insignias: {}, pasos: {}, ejecuciones: {}, juego: {}
    };
  }

  function cargar() {
    clave = 'pb:progreso:' + PB.config.idCurso;
    datos = PB.almacen.leer(clave, null);
    if (!datos || datos.version !== VERSION) datos = Object.assign(vacio(), datos || {});
    for (const k of ['retos', 'borradores', 'respuestas', 'pruebas', 'insignias', 'pasos', 'ejecuciones', 'juego']) datos[k] = datos[k] || {};
    datos.coevaluaciones = datos.coevaluaciones || [];
    return datos;
  }

  const guardarYa = () => {
    datos.actualizado = PB.util.hoyISO();
    PB.almacen.escribir(clave, datos);
  };
  const guardarPronto = PB.util.debounce(guardarYa, 400);

  function guardar(inmediato) {
    if (inmediato) guardarYa(); else guardarPronto();
    for (const fn of alCambiar) { try { fn(); } catch (e) { /* nada */ } }
  }

  /* ---------- Alumno ---------- */
  const alumno = () => datos.alumno;
  function fijarAlumno(nombre, grupo) {
    datos.alumno = { nombre: nombre.trim(), grupo: (grupo || '').trim() };
    guardar(true);
  }

  /* ---------- Retos ---------- */
  function estadoReto(id) {
    return datos.retos[id] || { niveles: {}, intentos: 0 };
  }

    const e = datos.retos[id] = estadoReto(id);
    e.intentos = (e.intentos || 0) + 1;

    e.niveles = e.niveles || {};
    const antes = mejorNivel(id);
    const nuevo = !e.niveles[nivel];
    if (nuevo) e.niveles[nivel] = PB.util.hoyISO();
    if (modo) e.modo = Math.max(e.modo || 0, modo);
    e.superado = true;

  }
  function mejorNivel(id) {
    const e = datos.retos[id];

  function guardarBorrador(k, valor) {

  }

  /* ---------- Respuestas (predicción, puente, ticket, autoevaluación) ---------- */

  function responder(k, valor) {
    datos.respuestas[k] = Object.assign({ fecha: PB.util.hoyISO() }, valor);
    guardar(true);
  }

  const prueba = (tipo) => datos.pruebas[tipo];
  function guardarPrueba(tipo, valor) {
    datos.pruebas[tipo] = Object.assign({ fecha: PB.util.hoyISO() }, valor);
    guardar(true);
  }

  /* ---------- Coevaluaciones ---------- */
  function agregarCoevaluacion(c) {
    datos.coevaluaciones.push(Object.assign({ fecha: PB.util.hoyISO() }, c));
    guardar(true);
  }

  /* ---------- Pasos vistos de cada sesión ---------- */
  function marcarPaso(sesion, paso) {
    const p = datos.pasos[sesion] = datos.pasos[sesion] || {};
    if (!p[paso]) { p[paso] = PB.util.hoyISO(); guardar(); }

  /** Recuerda que un código se ejecutó completo sin errores (para proyectos). */

  function estrellasSesion(sesion) {
    if (sesion.proyecto) return superado(sesion.proyecto.id) ? 3 : 0;
    if (!sesion.mision) return 0;
    return ESTRELLAS[mejorNivel(sesion.mision.id)] || 0;
  }
  const principalDe = (s) => s.mision || s.proyecto || null;

  /** Revisa las insignias de mundo; devuelve las recién ganadas. */
  function revisarInsignias() {
    const nuevas = [];
    for (const u of PB.curso.unidades) {
      if (!u.insignia) continue;
      const sesiones = PB.curso.sesiones.filter(s => s.unidad === u.numero && principalDe(s));
      if (!sesiones.length) continue;
      const completa = sesiones.every(s => superado(principalDe(s).id));
      if (completa && !datos.insignias[u.numero]) {
        datos.insignias[u.numero] = PB.util.hoyISO();
        nuevas.push(u);
      }
    }
    if (nuevas.length) guardar(true);
    return nuevas;
  }
  const tieneInsignia = (unidad) => !!datos.insignias[unidad];

  /* ---------- Calificación propuesta ---------- */
  function calificacion() {
    const cfg = PB.config.evaluacion;
    const sesiones = PB.curso.sesiones;
    const j = datos.juego || {};
    // Retos de programación: misiones (por nivel) + retos rápidos
    let creditos = 0, posibles = 0, misionesHechas = 0, retosHechos = 0, retosTotal = 0, misionesTotal = 0;
    for (const s of sesiones) {
      if (s.mision) {
        misionesTotal++; posibles++;
        const n = mejorNivel(s.mision.id);
        if (n === 'programador' || n === 'maestro') { creditos += 1; misionesHechas++; }
        else if (n === 'explorador') { creditos += cfg.creditoExplorador; misionesHechas++; }
      }
      // Mini-proyectos (no el final, que tiene su propio peso) cuentan como una misión
      if (s.proyecto && s.numero !== cfg.sesionProyectoFinal) {
        misionesTotal++; posibles++;
        if (superado(s.proyecto.id)) { creditos += 1; misionesHechas++; }
      }
      for (const r of s.retos || []) { retosTotal++; posibles++; if (superado(r.id)) { creditos += 1; retosHechos++; } }
    }
    const retos = posibles ? creditos / posibles * 100 : 0;
    // Actividades interactivas
    const acts = sesiones.flatMap(s => s.actividades || []);
    const actsHechas = acts.filter(a => j.actividades && j.actividades[a.id] && j.actividades[a.id].completada).length;
    const actividades = acts.length ? actsHechas / acts.length * 100 : 0;
    // Kahoots de cada misión: mejor porcentaje
    const conKahoot = sesiones.filter(s => s.kahoot && s.kahoot.preguntas && s.kahoot.preguntas.length);
    const sumaK = conKahoot.reduce((t, s) => t + ((j.kahoots && j.kahoots['m' + s.numero]) ? j.kahoots['m' + s.numero].mejorPct : 0), 0);
    const kahootsJugados = conKahoot.filter(s => j.kahoots && j.kahoots['m' + s.numero]).length;
    const kahoots = conKahoot.length ? sumaK / conKahoot.length * 100 : 0;
    const final = requisitosProyecto(cfg.sesionProyectoFinal);
    const p = cfg.pesos;
    const total = (retos * p.retos + actividades * p.actividades + kahoots * p.kahoots + final.porcentaje * p.proyectoFinal) / 100;
    return {
      retos: Math.round(retos), misionesHechas, misionesTotal, retosHechos, retosTotal,
      actividades: Math.round(actividades), actsHechas, actsTotal: acts.length,
      kahoots: Math.round(kahoots), kahootsJugados, kahootsTotal: conKahoot.length,
      final, total: Math.round(total), pesos: p
    };
  }

  function requisitosProyecto(numSesion) {
    const s = PB.curso.sesiones.find(x => x.numero === numSesion);
    if (!s || !s.proyecto) return { cumplidos: 0, total: 0, porcentaje: 0, entregado: false };
    const e = estadoReto(s.proyecto.id);
    const cumplidos = e.requisitosCumplidos || 0;
    const total = e.requisitosTotal || ((s.proyecto.requiere || []).length + 1);
    return { cumplidos, total, porcentaje: total ? Math.round((cumplidos / total) * 100) : 0, entregado: !!e.superado };
  }
  function guardarRequisitos(id, cumplidos, total) {
    const e = datos.retos[id] = estadoReto(id);
    e.requisitosCumplidos = Math.max(e.requisitosCumplidos || 0, cumplidos);
    e.requisitosTotal = total;
    guardar();
  }

  /* ---------- Exportar / importar ---------- */
  function exportar(conBorradores = true) {
    const copia = PB.util.clonar(datos);
    if (!conBorradores) delete copia.borradores;
    return JSON.stringify(copia, null, 1);
  }

  function codigoProgreso() {
    const json = exportar(false);
    const b64 = btoa(unescape(encodeURIComponent(json)));
    return 'PB1:' + b64;
  }

  function leerExterno(texto) {
    let t = String(texto).trim();
    if (t.startsWith('PB1:')) t = decodeURIComponent(escape(atob(t.slice(4))));
    const d = JSON.parse(t);
    if (!d || typeof d !== 'object' || !d.retos) throw new Error('No es un archivo de progreso.');
    return d;
  }

  /** Combina un progreso externo con el actual (se queda con lo mejor). */
  function importar(texto) {
    const ext = leerExterno(texto);
    if (!datos.alumno.nombre && ext.alumno) datos.alumno = ext.alumno;
    for (const [id, e] of Object.entries(ext.retos || {})) {
      const mio = datos.retos[id] = estadoReto(id);
      mio.niveles = Object.assign({}, e.niveles || {}, mio.niveles || {});
      mio.superado = mio.superado || e.superado;
      mio.intentos = Math.max(mio.intentos || 0, e.intentos || 0);
      mio.modo = Math.max(mio.modo || 0, e.modo || 0);
      if (e.requisitosCumplidos) {
        mio.requisitosCumplidos = Math.max(mio.requisitosCumplidos || 0, e.requisitosCumplidos);
        mio.requisitosTotal = e.requisitosTotal;
      }
    }
    for (const k of ['respuestas', 'pruebas', 'insignias', 'borradores', 'ejecuciones']) {
      datos[k] = Object.assign({}, ext[k] || {}, datos[k] || {});
    }
    for (const [s, p] of Object.entries(ext.pasos || {})) datos.pasos[s] = Object.assign({}, p, datos.pasos[s] || {});
    // Datos del juego: nos quedamos con lo mejor de cada lado
    const je = ext.juego || {}, jm = datos.juego = datos.juego || {};
    jm.xp = Math.max(jm.xp || 0, je.xp || 0);
    for (const k of ['logros', 'actividades', 'exploradores', 'desafios', 'animo']) jm[k] = Object.assign({}, je[k] || {}, jm[k] || {});
    jm.c = jm.c || {};
    for (const [k, v] of Object.entries(je.c || {})) jm.c[k] = Math.max(jm.c[k] || 0, v);
    jm.otorgado = jm.otorgado || {};
    for (const [k, v] of Object.entries(je.otorgado || {})) jm.otorgado[k] = Math.max(jm.otorgado[k] || 0, v);
    jm.kahoots = jm.kahoots || {};
    for (const [k, v] of Object.entries(je.kahoots || {})) {
      const m = jm.kahoots[k] || { mejor: 0, mejorPct: 0, jugadas: 0 };
      jm.kahoots[k] = { mejor: Math.max(m.mejor, v.mejor || 0), mejorPct: Math.max(m.mejorPct, v.mejorPct || 0), jugadas: Math.max(m.jugadas, v.jugadas || 0), ultima: v.ultima || m.ultima };
    }
    if (je.racha && (!jm.racha || (je.racha.mejor || 0) > (jm.racha.mejor || 0))) jm.racha = Object.assign({}, jm.racha || {}, { mejor: je.racha.mejor });
    if (!jm.avatar && je.avatar) jm.avatar = je.avatar;
    const vistas = new Set(datos.coevaluaciones.map(c => c.fecha));
    for (const c of ext.coevaluaciones || []) if (!vistas.has(c.fecha)) datos.coevaluaciones.push(c);
    guardar(true);
    return ext;
  }

  function reiniciar() {
    datos = vacio();
    guardar(true);
  }

  /* ---------- Resumen para entregar ---------- */
  function resumenTexto() {
    const a = datos.alumno;
    const cal = calificacion();
    const j = datos.juego || {};
    const nv = PB.juego ? PB.juego.nivelInfo(j.xp || 0) : { nivel: 1, titulo: '' };
    const L = [];
    L.push(`${PB.config.nombreCurso}`);
    L.push(`Alumno: ${a.nombre || '(sin nombre)'}${a.grupo ? ' · Grupo: ' + a.grupo : ''}`);
    L.push(`Fecha: ${PB.util.fechaCorta(PB.util.hoyISO())}`);
    L.push(`Nivel ${nv.nivel} (${nv.titulo}) · ${j.xp || 0} XP · ${Object.keys(j.logros || {}).length} logros · mejor racha ${(j.racha && j.racha.mejor) || 0} días`);
    L.push('');
    L.push('MISIONES');
    for (const s of PB.curso.sesiones) {
      const partes = [];
      if (s.mision) { const n = mejorNivel(s.mision.id); partes.push('misión: ' + (n ? `${n} ${'★'.repeat(ESTRELLAS[n])}` : 'pendiente')); }
      if (s.proyecto) { const e = estadoReto(s.proyecto.id); partes.push('proyecto: ' + (e.superado ? `entregado (${e.requisitosCumplidos || 0}/${e.requisitosTotal || '?'})` : e.requisitosCumplidos ? `en proceso (${e.requisitosCumplidos}/${e.requisitosTotal})` : 'pendiente')); }
      if (s.retos && s.retos.length) partes.push(`retos ${s.retos.filter(r => superado(r.id)).length}/${s.retos.length}`);
      if (s.actividades && s.actividades.length) partes.push(`actividades ${s.actividades.filter(x => j.actividades && j.actividades[x.id]).length}/${s.actividades.length}`);
      const k = j.kahoots && j.kahoots['m' + s.numero];
      if (s.kahoot) partes.push('kahoot ' + (k ? Math.round(k.mejorPct * 100) + ' %' : '—'));
      const animo = j.animo && j.animo[s.numero];
      if (animo) partes.push('ánimo ' + animo);
      L.push(`  ${s.numero}. ${s.titulo}: ${partes.join(' · ') || '—'}`);
    }
    const diag = prueba('diagnostica'), fin = prueba('final');
    L.push('');
    L.push('PRUEBAS DE LECTURA DE CÓDIGO');
    L.push(`  Diagnóstica: ${diag ? diag.puntaje + '/' + diag.total : 'sin presentar'}`);
    L.push(`  Final: ${fin ? fin.puntaje + '/' + fin.total : 'sin presentar'}`);
    if (datos.coevaluaciones.length) {
      L.push('');
      L.push('COEVALUACIONES REALIZADAS');
      for (const c of datos.coevaluaciones) L.push(`  A ${c.companero}: ${Object.entries(c.criterios || {}).map(([k, v]) => k + ' ' + v).join(', ')}`);
    }
    L.push('');
    L.push('INSIGNIAS: ' + (PB.curso.unidades.filter(u => tieneInsignia(u.numero)).map(u => u.insignia).join(', ') || 'ninguna todavía'));
    L.push('');
    L.push('CALIFICACIÓN ESTIMADA (la definitiva la asigna el docente)');
    L.push(`  Retos de programación (${cal.pesos.retos} %): ${cal.retos}`);
    L.push(`  Actividades interactivas (${cal.pesos.actividades} %): ${cal.actividades}`);
    L.push(`  Kahoots (${cal.pesos.kahoots} %): ${cal.kahoots}`);
    L.push(`  Proyecto final (${cal.pesos.proyectoFinal} %): requisitos ${cal.final.cumplidos}/${cal.final.total} (se evalúa con rúbrica)`);
    L.push(`  Estimado: ${cal.total}/100`);
    return L.join('\n');
  }

  return {
    cargar, guardar, alumno, fijarAlumno,
    estadoReto, sumarIntento, marcarReto, mejorNivel, superado,
    borrador, guardarBorrador, respuesta, responder, prueba, guardarPrueba, agregarCoevaluacion,
    marcarPaso, pasoVisto, registrarEjecucion, ejecucionOk,
    estrellasSesion, revisarInsignias, tieneInsignia, calificacion, guardarRequisitos, principalDe,
    exportar, codigoProgreso, leerExterno, importar, reiniciar, resumenTexto,
    alCambiar: (fn) => alCambiar.push(fn),
    get datos() { return datos; },
    NIVELES, ESTRELLAS
  };
})();

  /**

   */
  function ganarXP(cantidad, motivo, clave, { silencioso = false } = {}) {
    const j = estado();
    cantidad = Math.round(cantidad);
    if (cantidad <= 0) return 0;
    let delta = cantidad;
    if (clave) {
      const previo = j.otorgado[clave] || 0;
      if (cantidad <= previo) return 0;
      delta = cantidad - previo;

      const fichas = this.sesion.fichas || [];
      if (fichas.length) {
        const det = el('details', { class: 'fichas-taller' }, el('summary', {}, '📑 Fichas de sintaxis'));
        for (const f of fichas) {
          det.appendChild(el('div', { class: 'ficha-mini' }, el('div', { class: 'ficha-titulo' }, f.titulo), PB.bloqueCodigo(f.codigo), f.nota ? el('p', { class: 'nota', html: f.nota }) : null));
        }
        lado.appendChild(det);
      }
      e.appendChild(lado);
    }

    _ejemploDePrueba(p) {
      if (!p.contiene && !p.exacto) return null;
      const partes = [];
      if (p.entradas && p.entradas.length) partes.push('Si escribes: ' + p.entradas.join(', '));
      if (p.azar && p.azar.length) partes.push((partes.length ? 'y el' : 'Si el') + ' valor al azar es ' + p.azar.join(', '));
      partes.push(partes.length ? 'debe aparecer:' : 'Debe aparecer:');
      return partes.join(' ') + '\n' + (p.exacto || p.contiene.join('\n'));
    }

    _pintarRequisitos(resultados) {
      if (!this.listaRequisitos) return;
      const cfg = PB.verificador.configuracion(this.reto, this.nivel);
      const items = resultados || PB.verificador.revisarRestricciones('', cfg.requiere, cfg.prohibe).map(x => Object.assign(x, { ok: null }));
      vaciar(this.listaRequisitos);
      for (const it of items) {
        this.listaRequisitos.appendChild(el('li', { class: it.ok === true ? 'ok' : it.ok === false ? 'no' : '' }, it.texto));
      }
    }

    _actualizarSelectorModo() {
      for (const b of this.selModo.children) {
        const m = +b.dataset.modo;
        b.classList.toggle('activo', m === this.modo);
        b.setAttribute('aria-checked', String(m === this.modo));
        b.disabled = m < this.modoMin;
      }
      this.raiz.classList.remove('modo-1', 'modo-2', 'modo-3', 'modo-4');
      this.raiz.classList.add('modo-' + this.modo);
    }

    /* ---------------- Modos ---------------- */
    async cambiarModo(m) {
      if (m === this.modo || m < this.modoMin) return;
      if (PB.ejecutor.ocupado) PB.ejecutor.detener();
      const codigo = this.codigoActual();
      const deBloques = this.modo <= 2, aBloques = m <= 2;
      if (deBloques && !aBloques) {
        // Pasamos el Python de los bloques al editor
        PB.progreso.guardarBorrador('t:' + this.claveBase, codigo);
      } else if (!deBloques && aBloques) {
        const diag = PB.py.revisarSintaxis(codigo);
        if (diag) {
          PB.ui.alerta(`Antes de volver a los bloques corrige el error de la línea ${diag.linea}: ${diag.mensaje}`, 'No se puede convertir');
          return;
        }
        try {
          const r = PB.conv.aBloques(codigo);
          PB.progreso.guardarBorrador('b:' + this.claveBase, { bloques: r.json, generado: true });
        } catch (e) { /* se queda el borrador anterior */ }
      }
      PB.progreso.guardarBorrador('modo:' + this.reto.id + ':' + (this.nivel || '-'), m);
      this._entrarModo(m, false);
    }

    _entrarModo(m, inicial) {
      this.modo = m;
      this._actualizarSelectorModo();
      this._limpiarTrabajo();
      if (m <= 2) this._montarBloques(inicial); else this._montarTexto(inicial);
      this._pestanasAngostas();
      this._vista('trabajo');
      if (!inicial) this._pintarEnunciado();
      setTimeout(() => this._redimensionar(), 50);
    }

    _limpiarTrabajo() {
      for (const ws of [this.ws, this.wsPista]) { if (ws) { try { ws.dispose(); } catch (e) { /* nada */ } } }
      this.ws = null; this.wsPista = null; this.editor = null; this.panel = null;
      vaciar(this.trabajo); vaciar(this.lateralSup);
    }

    _montarBloques(inicial) {
      const div = el('div', { class: 'blockly-div' });
      this.trabajo.appendChild(div);
      this.ws = PB.blockly.crearEspacio(div, { sesion: this.sesion.numero, modo: this.modo, permitidos: this.reto.bloques || null, escala: PB.estado.escalaBloques });
      // Panel de Python
      const cab = el('div', { class: 'lateral-cabeza' }, el('span', {}, '🐍 Python'), el('span', { class: 'nota' }, this.modo === 2 ? 'Escribe en los huecos amarillos' : 'Toca una línea para ver su bloque'));
      const cont = el('div', { class: 'panel-python-cont' });
      this.lateralSup.append(cab, cont);
      this.panel = new PB.PanelPython(cont, {
        alClicLinea: (n, id) => {
          if (!id || !this.ws) return;
          const b = this.ws.getBlockById(id);
          if (b) { b.select(); this._centrarSiFuera(b); }
        },
        alEditarHueco: (id, texto) => {
          const b = this.ws && this.ws.getBlockById(id);
          if (b) b.setFieldValue(texto, 'CODIGO');
        }
      });
      if (this.modo === 2) {
        this.barra = PB.barraSimbolos(this.lateralSup, () => (document.activeElement && document.activeElement.classList.contains('pl-hueco')) ? document.activeElement : this._ultimoHueco);
        this.lateralSup.addEventListener('focusin', ev => { if (ev.target.classList.contains('pl-hueco')) this._ultimoHueco = ev.target; });
      }
      // Contenido inicial: borrador o código del reto
      const borrador = PB.progreso.borrador('b:' + this.claveBase);
      let cargado = false;
      if (borrador && borrador.bloques) {
        try {
          Blockly.Events.disable();
          Blockly.serialization.workspaces.load(borrador.bloques, this.ws);
          cargado = true;
        } catch (e) { console.warn('Borrador dañado', e); } finally { Blockly.Events.enable(); }
      }
      if (!cargado) {
        try { PB.conv.cargar(this.ws, this.codigoInicial()); } catch (e) { console.warn('Código inicial no convertible', e); }
      }
      const regenerar = PB.util.debounce(() => this._regenerar(true), 120);
      this.ws.addChangeListener((ev) => {
        if (this.destruido) return;
        if (ev.type === Blockly.Events.SELECTED) { this._alSeleccionar(ev.newElementId); return; }
        if (ev.isUiEvent) return;
        regenerar();
      });
      this._regenerar(false);
      setTimeout(() => PB.blockly.encuadrar(this.ws, PB.estado.escalaBloques || 0.85), 60);
    }

    _centrarSiFuera(b) {
      try {
        const m = this.ws.getMetrics();
        const xy = b.getRelativeToSurfaceXY();
        const x = xy.x * this.ws.scale, y = xy.y * this.ws.scale;
        if (x < m.viewLeft || x > m.viewLeft + m.viewWidth - 40 || y < m.viewTop || y > m.viewTop + m.viewHeight - 40) this.ws.centerOnBlock(b.id);
      } catch (e) { /* nada */ }
    }

    _alSeleccionar(id) {
      if (!this.panel) return;
      if (!id) { this.panel.limpiar('sel'); return; }
      const b = this.ws.getBlockById(id);
      const n = b ? PB.gen.lineaDeBloque(this.gen, b) : null;
      this.panel.marcar(n, 'sel');
    }

    _regenerar(guardar) {
      if (!this.ws) return;
      this.gen = PB.gen.generar(this.ws);
      this.panel.mostrar(this.gen);
      if (guardar) {
        const json = Blockly.serialization.workspaces.save(this.ws);
        PB.progreso.guardarBorrador('b:' + this.claveBase, { bloques: json });
      }
      if (this.esProyecto) this._requisitosEnVivo();
    }

    _montarTexto(inicial) {
      const cont = el('div', { class: 'editor-cont' });
      this.trabajo.appendChild(cont);
      let codigo = PB.progreso.borrador('t:' + this.claveBase);
      if (codigo === undefined || codigo === null) codigo = this._inicialComoTexto();
      const guardar = PB.util.debounce((v) => {
        PB.progreso.guardarBorrador('t:' + this.claveBase, v);
        if (this.esProyecto) this._requisitosEnVivo();
        if (this.pistaActiva === 'mio') this._pintarPistaMio();
      }, 400);
      this.editor = new PB.Editor(cont, { codigo, alCambiar: (v) => { this.editor.limpiarMarcas('error'); guardar(v); } });
      PB.barraSimbolos(this.trabajo, () => this.editor);
      // Panel lateral de bloques (pista o borrador)
      const opciones = this.modo === 3 ? [['mio', 'Mi código'], ['pista', 'Pista'], ['borrador', 'Borrador']] : [['mio', 'Mi código'], ['borrador', 'Borrador']];
      const seg = el('div', { class: 'segmentado' });
      for (const [k, t] of opciones) seg.appendChild(el('button', { class: 'seg-btn', 'data-k': k, onclick: () => this._pista(k) }, t));
      this.cuerpoPista = el('div', { class: 'pista-bloques' });
      const cab = el('div', { class: 'lateral-cabeza' }, el('span', {}, '🧩 Bloques'), seg,
        el('button', { class: 'btn-icono btn-plegar', title: 'Mostrar u ocultar los bloques', 'aria-label': 'Mostrar u ocultar los bloques', onclick: () => this._plegarPista() }, '▾'));
      this.lateralSup.append(cab, this.cuerpoPista);
      this.segPista = seg;
      this.raiz.classList.toggle('pista-plegada', this.modo === 4);
      this._pista(this.modo === 3 ? 'mio' : 'borrador', true);
      if (this.esProyecto) this._requisitosEnVivo();
    }

    _inicialComoTexto() {
      const c = this.codigoInicial();
      return c.replace(/«([^»]*)»/g, (_, t) => t || '___');
    }

    _plegarPista() {
      this.raiz.classList.toggle('pista-plegada');
      setTimeout(() => this._redimensionar(), 260);
    }

    _pista(k, inicial) {
      this.pistaActiva = k;
      for (const b of this.segPista.children) b.classList.toggle('activo', b.dataset.k === k);
      if (this.wsPista) { try { this.wsPista.dispose(); } catch (e) { /* nada */ } this.wsPista = null; }
      vaciar(this.cuerpoPista);
      if (!inicial && this.raiz.classList.contains('pista-plegada')) this._plegarPista();
      if (k === 'mio') this._pintarPistaMio();
      else if (k === 'pista') {
        const div = el('div', { class: 'blockly-div' });
        this.cuerpoPista.appendChild(el('p', { class: 'nota pista-nota' }, 'Así empieza la solución. Las piezas vacías son las que tú debes completar.'), div);
        this.wsPista = PB.blockly.crearLectura(div, 0.7);
        const n = this.reto.niveles && this.reto.niveles.explorador;
        const base = (n && n.inicio) || this.codigoInicial();
        try { PB.conv.cargar(this.wsPista, base); } catch (e) { /* nada */ }
        setTimeout(() => PB.blockly.encuadrar(this.wsPista, 0.75), 60);
      } else if (k === 'borrador') {
        const div = el('div', { class: 'blockly-div' });
        const acciones = el('div', { class: 'pista-acciones' },
          el('button', { class: 'btn btn-chico btn-suave', onclick: () => this._borradorAEditor() }, '⬅ Pasar al editor'),
          el('button', { class: 'btn btn-chico btn-suave', onclick: () => this._editorABorrador() }, 'Traer del editor ➡'));
        this.cuerpoPista.append(acciones, div);
        this.wsPista = PB.blockly.crearEspacio(div, { sesion: this.sesion.numero, modo: 1, permitidos: null, escala: 0.7 });
        const b = PB.progreso.borrador('bb:' + this.claveBase);
        if (b) { try { Blockly.serialization.workspaces.load(b, this.wsPista); } catch (e) { /* nada */ } }
        this.wsPista.addChangeListener(PB.util.debounce((ev) => {
          if (this.destruido || !this.wsPista) return;
          PB.progreso.guardarBorrador('bb:' + this.claveBase, Blockly.serialization.workspaces.save(this.wsPista));
        }, 400));
      }
      setTimeout(() => this._redimensionar(), 60);
    }

    _pintarPistaMio() {
      if (!this.cuerpoPista || this.pistaActiva !== 'mio') return;
      const codigo = this.editor ? this.editor.valor : '';
      if (!this.wsPista) {
        vaciar(this.cuerpoPista);
        this.avisoPista = el('p', { class: 'nota pista-nota' }, 'Tu código, convertido en bloques.');
        const div = el('div', { class: 'blockly-div' });
        this.cuerpoPista.append(this.avisoPista, div);
        this.wsPista = PB.blockly.crearLectura(div, 0.7);
      }
      const diag = PB.py.revisarSintaxis(codigo);
      if (diag) {
        this.avisoPista.textContent = `Corrige la línea ${diag.linea} para ver tus bloques: ${diag.mensaje}`;
        this.avisoPista.classList.add('aviso-error');
        return;
      }
      this.avisoPista.textContent = 'Tu código, convertido en bloques.';
      this.avisoPista.classList.remove('aviso-error');
      try { PB.conv.cargar(this.wsPista, codigo); PB.blockly.encuadrar(this.wsPista, 0.75); } catch (e) { /* nada */ }
    }

    async _borradorAEditor() {
      if (!this.wsPista) return;
      const codigo = PB.gen.generar(this.wsPista).codigo;
      if (!codigo.trim()) { PB.ui.aviso('El borrador está vacío.', 'info'); return; }
      if (this.editor.valor.trim() && !(await PB.ui.confirmar('Se reemplazará lo que tienes en el editor por el código del borrador. ¿Continuar?', 'Pasar al editor', 'Reemplazar'))) return;
      this.editor.valor = codigo;
      PB.progreso.guardarBorrador('t:' + this.claveBase, codigo);
    }

    _editorABorrador() {
      const diag = PB.py.revisarSintaxis(this.editor.valor);
      if (diag) { PB.ui.alerta(`Corrige primero la línea ${diag.linea}: ${diag.mensaje}`); return; }
      try { PB.conv.cargar(this.wsPista, this.editor.valor); PB.blockly.encuadrar(this.wsPista, 0.75); } catch (e) { /* nada */ }
    }

    /* ---------------- Código actual ---------------- */
    codigoActual() {
      if (this.modo <= 2) {
        if (this.ws) this.gen = PB.gen.generar(this.ws);
        return this.gen.codigo;
      }
      return this.editor ? this.editor.valor : '';
    }

    _marcarLinea(n, clase) {
      if (this.modo <= 2) {
        if (this.panel) this.panel.marcar(n, clase);
        if (this.ws) {
          const id = n ? this.gen.lineaABloque[n] : null;
          if (clase === 'actual') this.ws.highlightBlock(id || null);
          if (clase === 'error' && id) {
            const b = this.ws.getBlockById(id);
            if (b) { b.select(); this._centrarSiFuera(b); }
          }
        }
      } else if (this.editor) {
        this.editor.limpiarMarcas(clase);
        if (n) this.editor.marcarLinea(n, clase);
      }
    }
    _limpiarMarcas() {
      if (this.panel) { this.panel.limpiar('actual'); this.panel.limpiar('error'); }
      if (this.ws) this.ws.highlightBlock(null);
      if (this.editor) this.editor.limpiarMarcas();
    }

    /* ---------------- Ejecutar ---------------- */
    _ocupado(si, paso) {
      this.btnEjecutar.hidden = si;
      this.btnPaso.hidden = si;
      this.btnDetener.hidden = !si;
      this.btnComprobar.disabled = si;
      this.controlesPaso.hidden = !(si && paso);
      this.raiz.classList.toggle('paso-activo', !!(si && paso));
      setTimeout(() => this._redimensionar(), 30);
    }

    async ejecutar(paso = false) {
      if (PB.ejecutor.ocupado) return;
      const codigo = this.codigoActual();
      this._limpiarMarcas();
      this.consola.limpiar();
      this._sub('consola');
      if (this.raiz.classList.contains('angosto')) this._vista('inf');
      if (!codigo.trim()) {
        this.consola.mensaje(this.modo <= 2 ? 'Tu programa está vacío: arrastra bloques desde la caja de herramientas.' : 'Tu programa está vacío: escribe código en el editor.', 'info');
        return;
      }
      const diag = PB.py.revisarSintaxis(codigo);
      if (diag) {
        const exp = PB.errores.explicar({ tipo: diag.tipo, mensaje: diag.mensaje, linea: diag.linea, original: diag.tipo }, codigo);
        this.consola.mostrarError(exp);
        this._marcarLinea(exp.linea, 'error');
        return;
      }
      if (paso) {
        this.tablaVars.limpiar();
        PB.ejecutor.pausar(false);
        this.btnPausa.textContent = '⏸ Pausa';
        this.btnSiguiente.disabled = true;
      }
      this._ocupado(true, paso);
      const res = await PB.ejecutor.ejecutar(codigo, {
        alSalida: t => this.consola.escribir(t),
        alEntrada: () => {
          if (this.raiz.classList.contains('angosto')) this._vista('inf');
          return this.consola.pedir();
        },
        paso: paso ? {
          retardo: VELOCIDADES[this.velocidad].ms,
          alLinea: (linea, vars, locales) => {
            this._marcarLinea(linea, 'actual');
            this.tablaVars.mostrar(vars, locales, linea);
          }
        } : null
      });
      this.consola.cancelarPedido();
      this._ocupado(false);
      if (this.ws) this.ws.highlightBlock(null);
      if (this.panel) this.panel.limpiar('actual');
      if (this.editor) this.editor.limpiarMarcas('actual');
      if (res.error) {
        const exp = PB.errores.explicar(res.error, codigo);
        this.consola.mostrarError(exp);
        if (exp.linea) this._marcarLinea(exp.linea, 'error');
      } else {
        this.consola.mensaje('✔ El programa terminó.', 'exito');
      }
      PB.progreso.registrarEjecucion(this.claveBase, codigo, !res.error);
      if (PB.ganchos) PB.ganchos.alEjecutar(!res.error, res.error);
      if (paso && PB.ganchos) PB.ganchos.alPaso();
      if (this.esProyecto) this._requisitosEnVivo();
    }

    _pausar() {
      const p = !PB.ejecutor.pausado;
      PB.ejecutor.pausar(p);
      this.btnPausa.textContent = p ? '▶ Seguir' : '⏸ Pausa';
      this.btnSiguiente.disabled = !p;
    }
    _cambiarVelocidad() {
      this.velocidad = (this.velocidad + 1) % VELOCIDADES.length;
      PB.ejecutor.fijarRetardo(VELOCIDADES[this.velocidad].ms);
      this.btnVelocidad.textContent = 'Velocidad: ' + VELOCIDADES[this.velocidad].t;
    }

    /* ---------------- Comprobar ---------------- */
    _requisitosEnVivo() {
      if (!this.esProyecto || !this.listaRequisitos) return;
      const codigo = this.codigoActual();
      const cfg = PB.verificador.configuracion(this.reto, this.nivel);
      const r = PB.verificador.revisarRestricciones(codigo, cfg.requiere, cfg.prohibe);
      r.push({ texto: 'se ejecuta completo sin errores (ejecútalo con ▶)', ok: PB.progreso.ejecucionOk(this.claveBase, codigo) });
      this._pintarRequisitos(r);
      return r;
    }

    async comprobar() {
      if (PB.ejecutor.ocupado) return;
      const codigo = this.codigoActual();
      this._limpiarMarcas();
      this._sub('resultados');
      const caja = vaciar(this.contResultados);
      PB.progreso.sumarIntento(this.reto.id);

      if (this.esProyecto) {
        const r = this._requisitosEnVivo() || [];
        const cumplidos = r.filter(x => x.ok).length;
        PB.progreso.guardarRequisitos(this.reto.id, cumplidos, r.length);
        caja.appendChild(el('h3', {}, `Lista de cotejo: ${cumplidos} de ${r.length}`));
        const ul = el('ul', { class: 'requisitos grande' });
        for (const it of r) ul.appendChild(el('li', { class: it.ok ? 'ok' : 'no' }, it.texto));
        caja.appendChild(ul);
        if (cumplidos === r.length) {
          const rp = PB.progreso.marcarReto(this.reto.id, 'programador', this.modo);
          caja.appendChild(el('div', { class: 'resultado-ok' }, '🎉 ¡Tu proyecto cumple todos los requisitos! Descárgalo (⋯ → Descargar .py) y prepárate para presentarlo.'));
          const xpP = PB.ganchos ? PB.ganchos.alSuperar({ reto: this.reto, tipo: 'proyecto', nuevo: rp.nuevo, fallos: this.fallos || 0 }) : 0;
          this._celebrar({ proyecto: true, xp: xpP });
          if (this.o.alSuperar) this.o.alSuperar({ ok: true });
        } else {
          caja.appendChild(el('p', { class: 'nota' }, 'Sigue trabajando: cuando cumplas todos los puntos, tu proyecto quedará entregado.'));
        }
        return;
      }

      caja.appendChild(el('p', { class: 'nota centro' }, 'Revisando…'));
      this.btnComprobar.disabled = true;
      const res = await PB.verificador.verificar(codigo, this.reto, this.nivel, {
        alProgreso: (i, n) => { caja.firstChild.textContent = `Revisando prueba ${i} de ${n}…`; }
      });
      this.btnComprobar.disabled = false;
      vaciar(caja);
      this._pintarResultados(caja, res, codigo);
      if (!res.ok) this.fallos = (this.fallos || 0) + 1;
      if (res.ok) {
        const nivel = this.nivel || 'programador';
        const r = PB.progreso.marcarReto(this.reto.id, nivel, this.modo);
        const insignias = PB.progreso.revisarInsignias();
        const xp = PB.ganchos ? PB.ganchos.alSuperar({ reto: this.reto, tipo: this.o.tipo, nivel, nuevo: r.nuevo, fallos: this.fallos || 0 }) : 0;
        this._celebrar({ nivel: this.nivel, nuevo: r.nuevo, insignias, xp });
        if (this.o.alSuperar) this.o.alSuperar({ ok: true, nivel, nuevo: r.nuevo });
      }
    }

    _pintarResultados(caja, res, codigo) {
      if (res.vacio) { caja.appendChild(el('p', { class: 'resultado-no' }, 'Tu programa está vacío.')); return; }
      if (res.sintaxis) {
        caja.appendChild(el('div', { class: 'resultado-no' }, el('strong', {}, '⚠ ' + res.sintaxis.titulo), el('p', {}, res.sintaxis.texto)));
        this._marcarLinea(res.sintaxis.linea, 'error');
        return;
      }
      const okTotal = res.ok;
      caja.appendChild(el('div', { class: okTotal ? 'resultado-ok' : 'resultado-no' },
        okTotal ? '🎉 ¡Reto superado! Tu programa pasó todas las pruebas.' : 'Todavía no: revisa lo que está en rojo.'));
      if (res.huecos) caja.appendChild(el('div', { class: 'res-item no' }, `✗ Quedan ${res.huecos} hueco(s) «___» sin completar.`));
      for (const rq of res.restricciones) {
        caja.appendChild(el('div', { class: 'res-item ' + (rq.ok ? 'ok' : 'no') }, (rq.ok ? '✓ ' : '✗ ') + 'Debe ' + rq.texto));

    _solucion() {

      const nombre = `sesion-${String(this.sesion.numero).padStart(2, '0')}-${PB.util.slug(this.o.titulo || this.reto.titulo)}.py`;

/* =========================================================================
 * 62-kahoot.js — Quizzes tipo Kahoot.

 *     tarjetas de color o con los dedos, y el docente marca quién acertó.
 * Pregunta: { pregunta, codigo?, opciones:[2..4], correcta, tiempo?, explicacion?,
 *             tipo?: 'vf', codigoOpciones? }
 * ========================================================================= */
'use strict';

PB.kahoot = (() => {
  const { el, vaciar } = PB.util;
  const FORMAS = [
    { color: '#E21B3C', forma: 'triangulo', nombre: 'Rojo' },
    { color: '#1368CE', forma: 'rombo', nombre: 'Azul' },
    { color: '#D89E00', forma: 'circulo', nombre: 'Amarillo' },
    { color: '#26890C', forma: 'cuadrado', nombre: 'Verde' }
  ];
  const FORMAS_VF = [{ color: '#1368CE', forma: 'rombo', nombre: 'Azul' }, { color: '#E21B3C', forma: 'triangulo', nombre: 'Rojo' }];
  const NOMBRES_EQUIPO = ['Los Pythones', 'Bits Veloces', 'Cazabugs', 'Loop Infinito', 'Las Variables', 'Team Print', 'Los Índices', 'Booleanos'];
  const COLORES_EQUIPO = ['#E21B3C', '#1368CE', '#D89E00', '#26890C', '#9966FF', '#FF8C1A', '#0FBD8C', '#FF6680'];

  function svgForma(forma, tam = 28) {
    const f = {
      triangulo: '<polygon points="16,3 30,28 2,28"/>',
      rombo: '<polygon points="16,2 30,16 16,30 2,16"/>',
      circulo: '<circle cx="16" cy="16" r="13"/>',
      cuadrado: '<rect x="4" y="4" width="24" height="24" rx="2"/>'
    }[forma];
    const s = el('span', { class: 'kh-forma', 'aria-hidden': 'true' });
    s.innerHTML = `<svg width="${tam}" height="${tam}" viewBox="0 0 32 32" fill="#fff">${f}</svg>`;
    return s;
  }

  const formasDe = (q) => (q.tipo === 'vf' || q.opciones.length === 2 ? FORMAS_VF : FORMAS);
  const opcionesDe = (q) => (q.tipo === 'vf' && !q.opciones ? ['Verdadero', 'Falso'] : q.opciones);

  function contenidoOpcion(q, texto) {
    if (q.codigoOpciones) {
      const pre = el('pre', { class: 'kh-codigo-opcion' });
      pre.textContent = texto;
      return pre;
    }
    return el('span', { class: 'kh-texto-opcion', html: texto });
  }

  function tarjetaPregunta(q, numero, total, grande) {
    const caja = el('div', { class: 'kh-pregunta' + (grande ? ' grande' : '') });
    caja.appendChild(el('div', { class: 'kh-pregunta-texto', html: q.pregunta }));
    if (q.codigo) caja.appendChild(PB.bloqueCodigo(q.codigo, { numeros: q.codigo.split('\n').length > 2, clase: 'kh-codigo' }));
    return caja;
  }

  function mezclar(a) {
    const r = a.slice();
    for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
    return r;
  }

  /* ================================================================ *
   * Juego individual
   * ================================================================ */
  function jugar(contenedor, { titulo, subtitulo, preguntas, clave, xpMax = 150, alTerminar, alEquipos, aleatorio = false }) {
    const raiz = el('div', { class: 'kahoot' });
    contenedor.appendChild(raiz);
    let lista = preguntas.slice();
    let estado, temporizador = null, destruido = false;

    const limpiarTimer = () => { if (temporizador) { clearInterval(temporizador); temporizador = null; } };
    PB.app.alSalir(() => { destruido = true; limpiarTimer(); document.removeEventListener('keydown', teclas); });

    function teclas(ev) {
      if (destruido || !estado) return;
      if (estado.fase === 'pregunta' && /^[1-4]$/.test(ev.key)) {
        const i = +ev.key - 1;
        if (i < opcionesDe(lista[estado.i]).length) responder(i);

        ev.preventDefault();

    document.addEventListener('keydown', teclas);

    function intro() {
      vaciar(raiz);

      raiz.appendChild(el('div', { class: 'kh-intro' },
        el('div', { class: 'kh-logo' }, 'PyQuiz', el('span', {}, '!')),
        el('h2', {}, titulo),
        subtitulo ? el('p', { class: 'kh-sub' }, subtitulo) : null,
        el('div', { class: 'kh-datos' },
          el('span', {}, `❓ ${lista.length} preguntas`),
          el('span', {}, '⏱ con tiempo'),
          el('span', {}, '🔥 bonos por racha')),
        mejor ? el('p', { class: 'kh-record' }, `🏆 Tu récord: ${mejor.mejor.toLocaleString('es-MX')} puntos (${Math.round(mejor.mejorPct * 100)} %)`) : null,
        el('div', { class: 'kh-intro-botones' },
          el('button', { class: 'kh-btn kh-btn-jugar', onclick: empezar }, '▶ ¡Jugar!'),
          alEquipos ? el('button', { class: 'kh-btn kh-btn-sec', onclick: alEquipos }, '👥 Jugar en equipos (proyector)') : null),
        el('p', { class: 'kh-ayuda' }, 'Responde rápido: entre más rápido aciertes, más puntos. También puedes usar las teclas 1, 2, 3 y 4.')));
    }

    function empezar() {
      if (aleatorio) lista = mezclar(preguntas);
      estado = { i: 0, puntos: 0, correctas: 0, racha: 0, mejorRacha: 0, rapidas: 0, respuestas: [], fase: 'cuenta' };
      cuentaRegresiva(() => pregunta());
    }

    function cuentaRegresiva(fin) {
      vaciar(raiz);
      const n = el('div', { class: 'kh-cuenta' }, '3');
      raiz.appendChild(el('div', { class: 'kh-cuenta-caja' }, n));
      let k = 3;
      PB.juego.sonido('cuenta');
      const t = setInterval(() => {
        if (destruido) { clearInterval(t); return; }
        k--;
        if (k > 0) { n.textContent = String(k); n.classList.remove('pulso'); void n.offsetWidth; n.classList.add('pulso'); PB.juego.sonido('cuenta'); }
        else if (k === 0) { n.textContent = '¡Ya!'; PB.juego.sonido('ya'); }
        else { clearInterval(t); fin(); }
      }, 800);
    }

    function pregunta() {
      if (destruido) return;
      const q = lista[estado.i];
      estado.fase = 'pregunta';
      vaciar(raiz);
      const tiempo = q.tiempo || 20;
      const barra = el('div', { class: 'kh-barra-tiempo-relleno' });
      const segs = el('div', { class: 'kh-segundos' }, String(tiempo));
      raiz.appendChild(el('div', { class: 'kh-barra-sup' },
        el('span', {}, `Pregunta ${estado.i + 1} de ${lista.length}`),
        el('span', { class: 'kh-puntos' }, `${estado.puntos.toLocaleString('es-MX')} pts`),
        estado.racha > 1 ? el('span', { class: 'kh-racha' }, `🔥 ${estado.racha}`) : el('span')));
      raiz.appendChild(tarjetaPregunta(q, estado.i + 1, lista.length));
      raiz.appendChild(el('div', { class: 'kh-tiempo' }, segs, el('div', { class: 'kh-barra-tiempo' }, barra)));
      const ops = el('div', { class: 'kh-opciones n' + opcionesDe(q).length });
      const formas = formasDe(q);
      estado.botones = opcionesDe(q).map((op, i) => {
        const b = el('button', { class: 'kh-opcion', style: { background: formas[i].color }, onclick: () => responder(i), 'aria-label': `Opción ${i + 1}` },
          svgForma(formas[i].forma), contenidoOpcion(q, op));
        ops.appendChild(b);
        return b;
      });
      raiz.appendChild(ops);
      const t0 = performance.now();
      estado.t0 = t0;
      let ultimoSeg = tiempo;
      limpiarTimer();
      temporizador = setInterval(() => {
        const t = (performance.now() - t0) / 1000;
        const resto = Math.max(0, tiempo - t);
        barra.style.width = (resto / tiempo * 100) + '%';
        const s = Math.ceil(resto);
        if (s !== ultimoSeg) {
          ultimoSeg = s;
          segs.textContent = String(s);
          if (s <= 5 && s > 0) { PB.juego.sonido('tic'); segs.classList.add('urgente'); }
        }
        if (resto <= 0) responder(-1);
      }, 100);
    }

    function responder(i) {
      if (estado.fase !== 'pregunta') return;
      limpiarTimer();
      estado.fase = 'retro';
      const q = lista[estado.i];
      const tiempo = q.tiempo || 20;
      const t = Math.min(tiempo, (performance.now() - estado.t0) / 1000);
      const ok = i === q.correcta;
      let ganados = 0;
      if (ok) {
        estado.correctas++;
        estado.racha++;
        estado.mejorRacha = Math.max(estado.mejorRacha, estado.racha);

      const retro = el('div', { class: 'kh-retro ' + (ok ? 'ok' : 'no') },
        el('div', { class: 'kh-retro-titulo' }, i < 0 ? '⏰ ¡Se acabó el tiempo!' : ok ? '✔ ¡Correcto!' : '✘ Incorrecto'),
        ok ? el('div', { class: 'kh-retro-puntos' }, `+${ganados}`) : null,
        ok && estado.racha > 1 ? el('div', { class: 'kh-retro-racha' }, `🔥 Racha de ${estado.racha}`) : null,
        q.explicacion ? el('div', { class: 'kh-retro-expl', html: q.explicacion }) : null,

      raiz.appendChild(retro);
      setTimeout(() => { const b = retro.querySelector('.kh-btn-sig'); if (b) b.focus({ preventScroll: true }); retro.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }, 50);
    }

    }

    function final() {

      vaciar(raiz);
      const total = lista.length;
      const pct = estado.correctas / total;
      const medalla = pct >= 0.9 ? '🥇' : pct >= 0.7 ? '🥈' : pct >= 0.5 ? '🥉' : '🎖️';
      const frase = pct === 1 ? '¡Perfecto! Eres una leyenda.' : pct >= 0.7 ? '¡Excelente trabajo!' : pct >= 0.5 ? '¡Bien! Sigue practicando.' : 'Repasa la teoría y vuelve a intentarlo.';
      let info = { xp: 0, record: false };
      if (clave) info = PB.juego.registrarKahoot(clave, { puntos: estado.puntos, correctas: estado.correctas, total, mejorRacha: estado.mejorRacha, rapidas: estado.rapidas }, xpMax);
      PB.juego.sonido('fin');

      const revision = el('div', { class: 'kh-revision', hidden: true });
      estado.respuestas.forEach((r, k) => {
        revision.appendChild(el('div', { class: 'kh-rev-item ' + (r.ok ? 'ok' : 'no') },
          el('div', {}, el('strong', {}, `${k + 1}. `), el('span', { html: r.q.pregunta })),
          r.q.codigo ? PB.bloqueCodigo(r.q.codigo) : null,
          el('div', { class: 'nota' }, r.ok ? `✔ Correcto (+${r.ganados})` : `✘ ${r.i < 0 ? 'Sin respuesta' : 'Respondiste: ' + textoPlano(opcionesDe(r.q)[r.i])} · Correcta: ${textoPlano(opcionesDe(r.q)[r.q.correcta])}`),
          r.q.explicacion ? el('div', { class: 'nota', html: r.q.explicacion }) : null));
      });
      raiz.appendChild(el('div', { class: 'kh-final' },
        el('div', { class: 'kh-medalla' }, medalla),
        el('h2', {}, frase),
        el('div', { class: 'kh-puntaje' }, estado.puntos.toLocaleString('es-MX'), el('small', {}, ' puntos')),
        el('div', { class: 'kh-stats' },
          el('div', {}, el('strong', {}, `${estado.correctas}/${total}`), el('span', {}, 'correctas')),
          el('div', {}, el('strong', {}, `🔥 ${estado.mejorRacha}`), el('span', {}, 'mejor racha')),

  /* ================================================================ *
   * Modo equipos (para proyectar en clase)
   * ================================================================ */
  function equipos(contenedor, { titulo, preguntas, alSalir }) {
    const raiz = el('div', { class: 'kahoot kahoot-equipos' });

    let i = 0, temporizador = null, destruido = false, fase = 'config', pausado = false;

    const limpiarTimer = () => { if (temporizador) { clearInterval(temporizador); temporizador = null; } };
    PB.app.alSalir(() => { destruido = true; limpiarTimer(); document.removeEventListener('keydown', teclas); });

    let accionPrincipal = null;
    function teclas(ev) {
      if (destruido) return;
      if ((ev.key === ' ' || ev.key === 'Enter') && accionPrincipal && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {

    const barraSup = () => el('div', { class: 'kh-barra-sup' },
      el('span', {}, titulo),
      fase !== 'config' && fase !== 'podio' ? el('span', {}, `Pregunta ${i + 1} de ${preguntas.length}`) : el('span'),

          etiquetaSiguiente: sig ? 'Siguiente actividad ▶' : (ctx.siguiente ? `Ir a ${ctx.siguiente.nombre} ▶` : 'Terminar')
        });
        return;
      }
    }
    const hechas = acts.filter(a => PB.juego.actividadHecha(a.id)).length;
    c.appendChild(el('div', { class: 'juega-cabeza' },
      el('h2', {}, '🎮 ¡A jugar!'),
      el('div', { class: 'juega-progreso' }, `${hechas} de ${acts.length} completadas`, el('div', { class: 'xp-barra' }, el('div', { class: 'xp-barra-relleno', style: { width: (hechas / acts.length * 100) + '%' } })))));

        el('div', { class: 'ta-icono' }, meta.icono),

    });
    c.appendChild(rejilla);

  /* ---------- Programa: retos rápidos, misión y extra (o proyecto) ---------- */
  function pasoPrograma(c, s, ctx) {
    if (s.proyecto) { pasoProyecto(c, s, ctx); return; }
    if (s.retos && s.retos.length) {
      c.appendChild(el('h2', {}, '⚡ Retos rápidos'));
      c.appendChild(el('p', { class: 'intro-paso' }, 'Programas cortos de una sola idea. Escribe en el editor; si quieres, usa los bloques como apoyo.'));
      const lista = el('div', { class: 'lista-micro' });
      s.retos.forEach((r, i) => {
        const ok = PB.progreso.superado(r.id);
        lista.appendChild(el('a', { class: 'tarjeta-micro' + (ok ? ' hecho' : ''), href: `#/m/${s.numero}/programa/reto/${i + 1}` },
          el('span', { class: 'tm-num' }, ok ? '✓' : String(i + 1)),
          el('span', { class: 'tm-cuerpo' }, el('strong', {}, r.titulo), el('span', { class: 'nota', html: r.resumen || '' })),
          el('span', { class: 'tm-ir' }, ok ? 'Repasar' : `+${r.xp || 80} XP →`)));
      });
      c.appendChild(lista);
    }
    if (s.mision) {
      const r = s.mision;
      const est = PB.progreso.estadoReto(r.id);
      c.appendChild(el('h2', { class: 'titulo-mision' }, '🏆 Misión: ' + r.titulo));
      if (r.historia) c.appendChild(el('p', { class: 'historia' }, r.historia));
      if (r.enunciado) c.appendChild(el('div', { class: 'tarea', html: r.enunciado }));
      const niveles = [
        { id: 'explorador', nombre: 'Explorador', n: 1, xp: 100, desc: r.niveles?.explorador?.descripcion || 'Parte del programa ya está escrita: completa lo que falta.' },
        { id: 'programador', nombre: 'Programador', n: 2, xp: 150, desc: r.niveles?.programador?.descripcion || 'Escribe el programa completo.' },
        { id: 'maestro', nombre: 'Maestro', n: 3, xp: 200, desc: r.niveles?.maestro?.enunciado ? 'Todo lo del Programador y además: ' + r.niveles.maestro.enunciado : 'Un requisito adicional.' }
      ].filter(n => r.niveles && r.niveles[n.id]);
      const fila = el('div', { class: 'niveles' });
      for (const n of niveles) {
        const ok = est.niveles && est.niveles[n.id];
        fila.appendChild(el('a', { class: 'tarjeta-nivel nivel-' + n.id + (ok ? ' hecho' : ''), href: `#/m/${s.numero}/programa/mision/${n.id}` },
          el('div', { class: 'tn-cabeza' }, estrellas(n.n), el('strong', {}, n.nombre), ok ? el('span', { class: 'tn-ok' }, '✓') : el('span', { class: 'tn-xp' }, `+${n.xp} XP`)),
          el('p', { html: n.desc }),
          el('span', { class: 'btn btn-chico ' + (n.id === 'programador' ? 'btn-primario' : 'btn-suave') }, ok ? 'Repetir' : 'Aceptar')));
      }
      c.appendChild(fila);
    }
    if (s.extra) {
      const x = s.extra;
      const ok = PB.progreso.superado(x.id);
      c.appendChild(el('a', { class: 'tarjeta-extra' + (ok ? ' hecho' : ''), href: `#/m/${s.numero}/programa/extra` },
        el('div', { class: 'te-icono' }, '⭐'),
        el('div', {}, el('strong', {}, 'Reto extra: ' + x.titulo), el('div', { class: 'nota', html: x.enunciado || '' }), el('span', { class: 'chip' }, ok ? '✔ Superado' : `+${x.xp || 150} XP · opcional`))));
    }
    c.appendChild(ctx.botonSiguiente());
  }

  function pasoProyecto(c, s, ctx) {
    const r = s.proyecto;
    c.appendChild(el('h2', {}, '🚀 ' + r.titulo));
    if (r.historia) c.appendChild(el('p', { class: 'historia' }, r.historia));
    if (r.enunciado) c.appendChild(el('div', { class: 'tarea', html: r.enunciado }));
    const req = PB.verificador.revisarRestricciones('', r.requiere || []).map(x => x.texto);
    if (req.length) c.appendChild(el('div', { class: 'requisitos-caja' }, el('strong', {}, 'Requisitos mínimos:'), el('ul', { class: 'requisitos' }, ...req.map(t => el('li', {}, t)))));
    const ops = el('div', { class: 'opciones-proyecto' });

      ops.appendChild(el('a', { class: 'tarjeta-proyecto', href: `#/m/${s.numero}/programa/proyecto/${op.id}` },
        el('div', { class: 'tp-icono' }, op.icono || '🚀'), el('strong', {}, op.titulo), el('p', { html: op.resumen || '' }), el('span', { class: 'btn btn-chico btn-primario' }, 'Elegir')));
    }

    if (PB.estado.docente && r.rubrica) c.appendChild(pintarRubrica(r.rubrica));
    c.appendChild(ctx.botonSiguiente());
  }

  /* ---------- Coevaluación ---------- */
  function pasoCoevaluacion(c, s, ctx) {
    const co = s.coevaluacion;
    c.appendChild(el('h2', {}, co.titulo || 'Coevaluación'));
    c.appendChild(el('p', { html: co.instrucciones || '' }));
    const rub = co.rubrica || (PB.curso.sesiones.find(x => x.proyecto && x.proyecto.rubrica) || {}).proyecto?.rubrica;
    const form = el('div', { class: 'coeval' });
    const nombre = el('input', { class: 'campo', type: 'text', placeholder: 'Nombre de tu compañera o compañero' });
    const proyecto = el('input', { class: 'campo', type: 'text', placeholder: '¿Qué proyecto presentó?' });
    form.append(el('label', { class: 'campo-etiqueta' }, 'Evalúo a:'), nombre, el('label', { class: 'campo-etiqueta' }, 'Proyecto:'), proyecto);
    const elecciones = {};
    if (rub) {
      for (const cr of rub.criterios) {
        const fila = el('div', { class: 'coeval-criterio' }, el('strong', {}, cr.nombre));
        const ops = el('div', { class: 'coeval-opciones' });
        cr.descriptores.forEach((d, i) => {
          const b = el('button', { type: 'button', class: 'coeval-op', onclick: () => {
            elecciones[cr.nombre] = i + 1;
            for (const x of ops.children) x.classList.remove('elegida');
            b.classList.add('elegida');
          } }, el('b', {}, rub.niveles[i]), el('span', {}, d));
          ops.appendChild(b);
        });
        fila.appendChild(ops);
        form.appendChild(fila);
      }
    }
    const gusto = el('textarea', { class: 'campo', rows: '2', placeholder: 'Lo que más me gustó…' });
    const sugerencia = el('textarea', { class: 'campo', rows: '2', placeholder: 'Una sugerencia para mejorar…' });
    form.append(el('label', { class: 'campo-etiqueta' }, 'Lo que más me gustó'), gusto, el('label', { class: 'campo-etiqueta' }, 'Una sugerencia'), sugerencia);
    form.appendChild(el('button', { class: 'btn btn-primario', onclick: () => {
      if (!nombre.value.trim()) { PB.ui.aviso('Escribe el nombre de quien evalúas.', 'error'); return; }
      if (rub && Object.keys(elecciones).length < rub.criterios.length) { PB.ui.aviso('Elige un nivel en cada criterio.', 'error'); return; }
      PB.progreso.agregarCoevaluacion({ companero: nombre.value.trim(), proyecto: proyecto.value.trim(), criterios: Object.assign({}, elecciones), gusto: gusto.value.trim(), sugerencia: sugerencia.value.trim() });
      PB.juego.ganarXP(40, 'Coevaluación', 'coeval:' + PB.progreso.datos.coevaluaciones.length);
      PB.ui.aviso('Coevaluación guardada. ¡Gracias!', 'exito');
      PB.app.render();
    } }, 'Guardar coevaluación (+40 XP)'));
    c.appendChild(form);
    const hechas = PB.progreso.datos.coevaluaciones;
    if (hechas.length) {
      c.appendChild(el('h3', {}, 'Coevaluaciones que has hecho'));
      c.appendChild(el('ul', {}, ...hechas.map(h => el('li', {}, `${h.companero}${h.proyecto ? ' («' + h.proyecto + '»)' : ''}: ${Object.entries(h.criterios).map(([k, v]) => k + ' ' + v).join(' · ')}`))));
    }
    c.appendChild(ctx.botonSiguiente());
  }

  /* ---------- Prueba diagnóstica / final ---------- */
  function pasoPrueba(c, s, ctx) {
    const tipo = s.prueba;
    const items = PB.curso.prueba.items;
    const hecha = PB.progreso.prueba(tipo);
    c.appendChild(el('h2', {}, tipo === 'diagnostica' ? '📝 Prueba diagnóstica' : '📝 Prueba final'));
    c.appendChild(el('p', { html: tipo === 'diagnostica'
      ? 'Son 10 preguntas de <b>leer código y predecir qué hace</b>. Todavía no sabes Python: es normal no saber muchas respuestas. ¡Responde lo que creas! Al final del curso harás las mismas preguntas para ver cuánto avanzaste.'
      : 'Son las mismas 10 preguntas de la prueba diagnóstica. Lee cada programa con calma y predice qué hace.' }));
    if (hecha && !PB.estado.docente) { mostrarResultadoPrueba(c, tipo, hecha, items); c.appendChild(ctx.botonSiguiente()); return; }
    let i = 0;
    const respuestas = [];
    const zona = el('div', { class: 'prueba-zona' });
    c.appendChild(zona);
    const formas = PB.kahoot.FORMAS;
    const pintar = () => {
      vaciar(zona);
      const it = items[i];
      zona.appendChild(el('div', { class: 'prueba-progreso' }, `Pregunta ${i + 1} de ${items.length}`,
        el('div', { class: 'barra-progreso' }, el('div', { class: 'barra-relleno', style: { width: ((i) / items.length * 100) + '%' } }))));
      const caja = el('div', { class: 'pregunta' });
      caja.appendChild(el('div', { class: 'pregunta-texto', html: it.pregunta }));
      if (it.codigo) caja.appendChild(PB.bloqueCodigo(it.codigo, { numeros: true }));
      const ops = el('div', { class: 'sal-opciones' });
      it.opciones.forEach((op, j) => {
        const b = el('button', { class: 'sal-opcion', style: { background: formas[j % 4].color }, onclick: () => { respuestas[i] = j; i++; if (i < items.length) pintar(); else terminar(); } }, PB.kahoot.svgForma(formas[j % 4].forma, 22));
        const pre = el('pre'); pre.textContent = op;
        b.appendChild(pre);
        ops.appendChild(b);
      });
      caja.appendChild(ops);
      caja.appendChild(el('button', { class: 'btn btn-chico btn-suave', onclick: () => { respuestas[i] = -1; i++; if (i < items.length) pintar(); else terminar(); } }, 'No sé'));
      zona.appendChild(caja);
    };
    const terminar = () => {
      const puntaje = respuestas.filter((r, j) => r === items[j].correcta).length;
      const datos = { respuestas, puntaje, total: items.length };
      if (!PB.progreso.prueba(tipo) || PB.estado.docente) PB.progreso.guardarPrueba(tipo, datos);
      PB.juego.ganarXP(50, 'Prueba ' + tipo, 'prueba:' + tipo);
      vaciar(zona);
      mostrarResultadoPrueba(zona, tipo, datos, items);
    };
    pintar();
    c.appendChild(ctx.botonSiguiente());
  }

  function mostrarResultadoPrueba(c, tipo, datos, items) {
    c.appendChild(el('div', { class: 'resultado-prueba' },
      el('div', { class: 'puntaje-grande' }, `${datos.puntaje}`, el('small', {}, `/${datos.total}`)),
      el('p', {}, tipo === 'diagnostica' ? '¡Gracias! Este es tu punto de partida.' : 'Este es tu resultado final.')));
    if (tipo === 'final') {
      const d = PB.progreso.prueba('diagnostica');
      if (d) {
        const dif = datos.puntaje - d.puntaje;
        c.appendChild(el('div', { class: 'comparacion-pruebas' },
          el('div', {}, el('small', {}, 'Diagnóstica'), el('strong', {}, `${d.puntaje}/${d.total}`)),
          el('div', { class: 'flecha' }, '→'),
          el('div', {}, el('small', {}, 'Final'), el('strong', {}, `${datos.puntaje}/${datos.total}`)),
          el('div', { class: dif > 0 ? 'avance' : '' }, dif > 0 ? `+${dif} 🎉` : dif === 0 ? 'igual' : String(dif))));
      }
    }
    const det = el('details', { class: 'repaso-prueba' }, el('summary', {}, 'Repasar las respuestas'));
    items.forEach((it, j) => {
      const r = datos.respuestas[j];
      det.appendChild(el('div', { class: 'repaso-item ' + (r === it.correcta ? 'ok' : 'no') },
        el('strong', {}, `${j + 1}. `, el('span', { html: it.pregunta })),
        it.codigo ? PB.bloqueCodigo(it.codigo) : null,
        el('p', {}, `Tu respuesta: ${r >= 0 && r !== undefined ? String.fromCharCode(65 + r) : 'No sé'} · Correcta: ${String.fromCharCode(65 + it.correcta)}`),
        it.explicacion ? el('p', { class: 'nota', html: it.explicacion }) : null));
    });
    c.appendChild(det);
  }

  /* ---------- Cierre de la misión ---------- */
  function pasoCierre(c, s) {
    const j = PB.juego.estado();
    const pr = progresoMision(s);
    const u = mundoDe(s);
    c.appendChild(el('div', { class: 'cierre-banner', style: { '--c': u.color } },
      el('div', { class: 'cierre-emoji' }, pr.pct >= 1 ? '🏁' : '🚩'),
      el('div', {}, el('h2', {}, pr.pct >= 1 ? `¡Misión ${s.numero} cumplida!` : `Misión ${s.numero}: casi lista`),
        el('div', { class: 'cierre-stats' },
          el('span', {}, `⭐ ${xpDeMision(s)} XP ganados`),
          el('span', {}, `✅ ${pr.vistos}/${pr.total} pasos`),
          (s.mision || s.proyecto) ? el('span', {}, estrellas(PB.progreso.estrellasSesion(s))) : null,
          s.actividades ? el('span', {}, `🎮 ${s.actividades.filter(a => PB.juego.actividadHecha(a.id)).length}/${s.actividades.length} actividades`) : null))));
    if (pr.pct >= 1) setTimeout(() => PB.juego.confeti(1500, 100), 300);
    if (s.resumen && s.resumen.length) {
      c.appendChild(el('h3', {}, '🧠 Lo que aprendiste'));
      c.appendChild(el('div', { class: 'resumen-tarjetas' }, ...s.resumen.map(r => el('div', { class: 'resumen-tarjeta' },
        el('div', { class: 'resumen-icono' }, r.icono || '✔'), el('div', {}, el('div', { html: r.texto }), r.codigo ? PB.bloqueCodigo(r.codigo) : null)))));
    }
    // Autoevaluación con emojis
    c.appendChild(el('h3', {}, '💬 ¿Cómo te sentiste en esta misión?'));
    const animos = [['😃', 'Lo entendí todo'], ['🙂', 'Casi todo'], ['😐', 'Más o menos'], ['😟', 'Necesito ayuda']];
    const fila = el('div', { class: 'animo-fila' });
    const pintarAnimo = () => {
      vaciar(fila);
      for (const [e, t] of animos) {
        fila.appendChild(el('button', { class: 'animo-btn' + (j.animo[s.numero] === e ? ' elegido' : ''), onclick: () => {
          j.animo[s.numero] = e; PB.progreso.guardar(true); PB.juego.sonido('clic');
          PB.juego.ganarXP(10, 'Autoevaluación', 'animo:' + s.numero);
          pintarAnimo();
        } }, el('span', { class: 'animo-emoji' }, e), el('span', {}, t)));
      }

  const JUEGOS = {

      let piezas = solucion.map((l, i) => ({ id: 'p' + i, texto: l.texto, nivel: conSangria ? 0 : l.nivel }))

      let respuesta = [];
      const zonaPiezas = el('div', { class: 'ord-piezas' });

            ctx.fallo('Esa línea está bien. Mira la línea que parpadea.');
          } else ctx.fallo(fallos === 2 && act.pista ? 'Pista: ' + act.pista : 'Esa línea está bien. Sigue buscando.');
        }

      function preguntarTipo(caja) {

            else { b.classList.add('no'); fallos++; ctx.fallo(`No es ${op}. Piensa: ¿falta algo al escribir (sintaxis), un nombre que no existe, o tipos que no se pueden mezclar?`); }

    /* ---------------- Completar ---------------- */
    completar(c, act, ctx) {
      const partes = act.codigo.split(/⟦([^⟧]*)⟧/);

          });

        for (const op of mezclar(act.opciones)) {
          const b = el('button', { class: 'comp-ficha', onclick: () => {
            const destino = (ultimo && !ultimo.classList.contains('ok')) ? ultimo : huecos.map(h => h.inp).find(i => !i.value) || huecos[0].inp;
            destino.value = op; destino.classList.remove('ok', 'no');

      const mc = miniConsola(consola);
      function comprobar() {
        if (ctx.terminado) return;
        let bien = 0;
        for (const h of huecos) {
          const ok = h.alternativas.some(a => sinEspacios(a) === sinEspacios(h.inp.value));

            mc.ejecutar(codigo, act.entradas || []);

    },

    /* ---------------- Clasificar ---------------- */
    clasificar(c, act, ctx) {
      const items = mezclar(act.elementos.map((e, i) => Object.assign({ id: i, en: null }, e)));
      let seleccionado = null;
      const bandeja = el('div', { class: 'cla-bandeja' });
      const cajas = el('div', { class: 'cla-cajas' });
      const cajasPorId = {};
      for (const cat of act.categorias) {
        const lista = el('div', { class: 'cla-lista' });
        const caja = el('button', { class: 'cla-caja', style: { '--c': cat.color || '#4C97FF' }, onclick: () => colocar(cat.id) },
          el('div', { class: 'cla-caja-titulo' }, cat.icono ? cat.icono + ' ' : '', cat.nombre), lista);
        cajasPorId[cat.id] = lista;
        cajas.appendChild(caja);
      }
      c.append(el('div', { class: 'ord-titulo' }, 'Toca un elemento y después la caja donde va'), bandeja, cajas,
        el('div', { class: 'act-botones' }, el('button', { class: 'btn btn-primario', onclick: comprobar }, '✔ Comprobar')));
      function ficha(it) {
        const b = el('span', { class: 'cla-ficha' + (seleccionado === it ? ' sel' : '') + (it.estado ? ' ' + it.estado : ''), role: 'button', tabindex: '0' });
        if (it.codigo !== false) b.appendChild(el('code', {}, it.texto)); else b.textContent = it.texto;
        b.addEventListener('click', (ev) => {
          ev.stopPropagation();
          if (it.estado === 'ok' || ctx.terminado) return;
          if (it.en !== null) { it.en = null; seleccionado = it; }
          else seleccionado = seleccionado === it ? null : it;
          PB.juego.sonido('clic');
          pintar();
        });
        return b;
      }
      function colocar(cat) {
        if (!seleccionado) { ctx.decir('Primero toca un elemento de arriba.'); return; }
        seleccionado.en = cat;
        seleccionado.estado = '';
        seleccionado = items.find(i => i.en === null) || null;
        PB.juego.sonido('clic');
        pintar();
      }
      function pintar() {
        vaciar(bandeja);
        const libres = items.filter(i => i.en === null);
        if (!libres.length) bandeja.appendChild(el('span', { class: 'nota' }, 'Todos colocados. ¡Comprueba!'));
        libres.forEach(i => bandeja.appendChild(ficha(i)));
        for (const id of Object.keys(cajasPorId)) {
          vaciar(cajasPorId[id]);
          items.filter(i => i.en === id).forEach(i => cajasPorId[id].appendChild(ficha(i)));
        }
      }
      function comprobar() {
        if (ctx.terminado) return;
        if (items.some(i => i.en === null)) { ctx.decir('Coloca todos los elementos antes de comprobar.'); return; }
        let mal = 0;
        for (const i of items) {
          if (i.en === i.cat) i.estado = 'ok';
          else { i.estado = 'no'; mal++; }
        }
        pintar();
        if (!mal) { ctx.exito({ puntaje: ctx.intentos ? 0.8 : 1 }); return; }
        ctx.fallo(`${mal} elemento(s) en la caja equivocada. Regresaron arriba.`);
        setTimeout(() => { for (const i of items) if (i.estado === 'no') { i.en = null; i.estado = ''; } pintar(); }, 900);
      }
      pintar();
    },

    /* ---------------- Relacionar ---------------- */
    relacionar(c, act, ctx) {
      const izq = act.pares.map((p, i) => ({ id: i, texto: p[0] }));
      const der = mezclar(act.pares.map((p, i) => ({ id: i, texto: p[1] })));
      const parejas = new Map();      // idIzq → objeto der
      const bloqueadas = new Set();
      let selIzq = null;
      const colIzq = el('div', { class: 'rel-col' }), colDer = el('div', { class: 'rel-col' });
      c.append(el('div', { class: 'ord-titulo' }, 'Toca un elemento de la izquierda y después su pareja de la derecha'),
        el('div', { class: 'rel-columnas' }, colIzq, colDer),
        el('div', { class: 'act-botones' }, el('button', { class: 'btn btn-primario', onclick: comprobar }, '✔ Comprobar')));
      const contenido = (t, esCodigo) => (esCodigo ? el('code', {}, t) : el('span', { html: t }));
      const indicePar = (idIzq) => [...parejas.keys()].indexOf(idIzq);
      function pintar() {
        vaciar(colIzq); vaciar(colDer);
        for (const it of izq) {
          const par = parejas.has(it.id);
          const color = par ? COLORES_PAR[indicePar(it.id) % COLORES_PAR.length] : null;
          colIzq.appendChild(el('button', {
            class: 'rel-item' + (selIzq === it.id ? ' sel' : '') + (bloqueadas.has(it.id) ? ' ok' : ''), style: color ? { '--c': color, borderColor: color } : null,
            onclick: () => { if (bloqueadas.has(it.id)) return; if (par) parejas.delete(it.id); selIzq = it.id; PB.juego.sonido('clic'); pintar(); }
          }, contenido(it.texto, act.codigoIzq !== false)));
        }
        for (const it of der) {
          const duenio = [...parejas.entries()].find(([, d]) => d === it);
          const color = duenio ? COLORES_PAR[indicePar(duenio[0]) % COLORES_PAR.length] : null;
          colDer.appendChild(el('button', {
            class: 'rel-item' + (duenio && bloqueadas.has(duenio[0]) ? ' ok' : ''), style: color ? { '--c': color, borderColor: color } : null,
            onclick: () => {
              if (duenio && bloqueadas.has(duenio[0])) return;
              if (selIzq === null) { ctx.decir('Primero toca un elemento de la izquierda.'); return; }
              if (duenio) parejas.delete(duenio[0]);
              parejas.set(selIzq, it);
              selIzq = izq.find(x => !parejas.has(x.id)) ? izq.find(x => !parejas.has(x.id)).id : null;
              PB.juego.sonido('clic');
              pintar();
            }
          }, contenido(it.texto, act.codigoDer !== false)));
        }
      }
      function comprobar() {
        if (ctx.terminado) return;
        if (parejas.size < izq.length) { ctx.decir('Forma todas las parejas antes de comprobar.'); return; }
        let mal = 0;
        for (const [idIzq, d] of [...parejas.entries()]) {
          if (d.id === idIzq) bloqueadas.add(idIzq);
          else { parejas.delete(idIzq); mal++; }
        }
        selIzq = izq.find(x => !parejas.has(x.id)) ? izq.find(x => !parejas.has(x.id)).id : null;
        pintar();
        if (!mal) ctx.exito({ puntaje: ctx.intentos ? 0.8 : 1 });
        else ctx.fallo(`${mal} pareja(s) incorrecta(s). Se deshicieron: vuelve a intentarlo.`);
      }
      selIzq = 0;
      pintar();
    },

    /* ---------------- ¿Qué imprime? ---------------- */
    salida(c, act, ctx) {

      if (act.entradas && act.entradas.length) c.appendChild(el('p', { class: 'nota' }, '⌨ Cuando el programa pide datos, se escribe: ', ...act.entradas.map(e => el('code', { class: 'chip chip-codigo' }, e))));

      };
      if (act.opciones) {

      } else {

        c.append(ta, el('div', { class: 'act-botones' },
          el('button', { class: 'btn btn-primario', onclick: () => {
            if (ctx.terminado) return;
            if (!ta.value.trim()) { ctx.decir('Escribe tu predicción primero.'); return; }

            else if (ctx.intentos >= 1) { mostrarReal(); ctx.fallo('Compara tu predicción con la salida real. ¿Dónde estuvo la diferencia? Corrige y vuelve a comprobar.'); }
